allprojects {
    afterEvaluate {
        minecraft.runs.gameTestServer {
            workingDirectory project.file("build/inspect-gametest-${System.currentTimeMillis()}")
            property 'forge.enabledGameTestNamespaces', 'afl_inspect_tests'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
    }
}
