// Isolated server verification. Never opens or manipulates the user's client/world.
allprojects {
    afterEvaluate {
        minecraft.runs.gameTestServer {
            workingDirectory project.file('build/noise-system-v2-gametest')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
    }
}
