allprojects {
    afterEvaluate {
        def testDir = project.file("build/town-building-gametest-${System.currentTimeMillis()}")
        minecraft.runs.gameTestServer {
            workingDirectory testDir
            property 'forge.enabledGameTestNamespaces', 'afl_town_building_tests'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doLast {
                def log = new File(testDir, 'logs/latest.log')
                if (!log.exists() || !log.getText('UTF-8').contains('[AFL TOWN BUILDING TEST] PASS'))
                    throw new GradleException('Town building GameTest did not pass')
            }
        }
    }
}
