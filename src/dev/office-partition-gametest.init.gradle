allprojects {
    afterEvaluate {
        def testDir = project.file("build/office-partition-gametest-${System.currentTimeMillis()}")
        minecraft.runs.gameTestServer {
            workingDirectory testDir
            property 'forge.enabledGameTestNamespaces', 'afl_office_partition_tests'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doLast {
                def log = new File(testDir, 'logs/latest.log')
                if (!log.exists() || !log.getText('UTF-8').contains('[AFL OFFICE PARTITION TEST] PASS')) {
                    throw new GradleException('Office-partition regression did not execute; zero selected tests is not a pass')
                }
            }
        }
    }
}
