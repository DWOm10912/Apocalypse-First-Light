allprojects {
    afterEvaluate {
        minecraft.runs.gameTestServer {
            workingDirectory project.file("build/bridge-gametest-${System.currentTimeMillis()}")
            property 'afl.referenceTestArtifact', project.file('build/reference_imports/modern_office_building_v_reference/prepared-safe.json').absolutePath
            property 'forge.enabledGameTestNamespaces', 'afl_bridge_tests'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
    }
}
