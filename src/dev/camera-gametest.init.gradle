// Isolated camera contract suite: never loads the user's authoring world.
allprojects {
    afterEvaluate {
        minecraft.runs.gameTestServer {
            workingDirectory project.file("build/camera-gametest-${System.currentTimeMillis()}")
            property 'forge.enabledGameTestNamespaces', 'afl_camera_tests'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
    }
}
