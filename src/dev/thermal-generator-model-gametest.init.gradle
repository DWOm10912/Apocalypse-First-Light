allprojects {
    afterEvaluate {
        minecraft.runs.gameTestServer {
            workingDirectory project.file('build/thermal-generator-model-gametest')
            property 'forge.enabledGameTestNamespaces', 'afl_thermal_model_tests'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
    }
}
