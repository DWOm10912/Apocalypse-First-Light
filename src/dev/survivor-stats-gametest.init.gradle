allprojects {
    afterEvaluate {
        def testDir = project.file("build/survivor-stats-gametest-${System.currentTimeMillis()}")
        minecraft.runs.gameTestServer {
            workingDirectory testDir
            property 'forge.enabledGameTestNamespaces', 'afl_survivor_stats_tests'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doLast {
                def log = new File(testDir, 'logs/latest.log')
                def text = log.exists() ? log.getText('UTF-8') : ''
                if (!text.contains('[AFL SURVIVOR STATS TEST] PASS') || !text.contains('[AFL SURVIVOR SETUP TEST] PASS'))
                    throw new GradleException('Survivor stats / setup GameTest did not pass')
            }
        }
    }
}
