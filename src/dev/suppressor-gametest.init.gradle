allprojects {
    afterEvaluate {
        minecraft.runs.gameTestServer {
            workingDirectory project.file('build/suppressor-gametest')
            // Forge filters generated tests by structure namespace, not their test ID.
            property 'forge.enabledGameTestNamespaces', 'afl_workbench_tests'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
    }
}
