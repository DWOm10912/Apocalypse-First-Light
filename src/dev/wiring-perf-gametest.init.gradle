allprojects {
    afterEvaluate {
        def testDir = project.file("build/wiring-perf-gametest-${System.currentTimeMillis()}")
        minecraft.runs.gameTestServer {
            workingDirectory testDir
            property 'forge.enabledGameTestNamespaces', 'afl_wiring_perf'
            property 'afl.perf.template', project.file('run/afl_authoring_exports/forest_home_b_m1.nbt').absolutePath
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doLast {
                def log = new File(testDir, 'logs/latest.log')
                def text = log.exists() ? log.getText('UTF-8') : ''
                def missing = ['house', 'worst'].findAll { !text.contains("[AFL WIRING PERF] PASS ${it}:") }
                if (!missing.isEmpty()) {
                    throw new GradleException("Wiring performance tests did not pass: ${missing}")
                }
            }
        }
    }
}
