allprojects {
    afterEvaluate {
        minecraft.runs.gameTestServer {
            workingDirectory project.file("build/office-detail-test-${System.currentTimeMillis()}")
            property 'forge.enabledGameTestNamespaces', 'afl_office_detail_tests'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
    }
}
