allprojects {
    afterEvaluate {
        def testDir = project.file("build/forest-home-m2-gametest-${System.currentTimeMillis()}")
        minecraft.runs.gameTestServer {
            workingDirectory testDir
            property 'forge.enabledGameTestNamespaces', 'afl_m2_tests'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doLast {
                def log = new File(testDir, 'logs/latest.log')
                if (!log.exists() || !log.getText('UTF-8').contains('[AFL FOREST HOME M2 TEST] PASS')) {
                    throw new GradleException('Forest home M2 test did not pass')
                }
            }
        }
    }
}
