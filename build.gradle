buildscript {
    repositories {
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    dev {
        java.srcDir 'src/dev/java'
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

mixin {
    add sourceSets.main, 'apocalypse_firstlight.refmap.json'
    config 'apocalypse_firstlight.mixins.json'
}

// Forge's automatic event-subscriber scan indexes the main ModFile output.
// Include dev command sources there for runClient, then exclude them from the published jar.
sourceSets.main.java.srcDir 'src/dev/java'
// M1-A sandbox assets are visible to development runs, explicitly excluded from the release jar below.
sourceSets.main.resources.srcDir 'src/dev/highway_mesh_resources'

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX"
    // task for the given run configuration before launching the game.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations
    // before launching the game.
    copyIdeResources = true

    // generateRunFolders = true

    // This property enables access transformers for use in development.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        // Applies to all run configurations below.
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id

            // Required for external Mixin mods such as Oculus in the
            // ForgeGradle deobfuscated development environment.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
        }

        clientPureForge {
            workingDirectory project.file('run-pure-forge')
            property 'forge.enabledGameTestNamespaces', mod_id

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

// ForgeGradle recognizes the literal `client` run name automatically.
// The separately named smoke-test run inherits that resolved launch definition.
//
// IMPORTANT:
// For a shader-free pure Forge run, launch it with:
//   .\gradlew.bat runClientPureForge -PaflWithoutShaders
minecraft.runs.clientPureForge.parent(minecraft.runs.client)

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    // Vextris (Antaurora's mesh library), from its internal Maven repository (gradle.properties vextris_repo).
    maven {
        name = 'Vextris internal'
        url = file(vextris_repo)
        content {
            includeGroup 'io.github.dwom10912'
        }
    }

    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'

        content {
            includeGroupByRegex 'software\\.bernie.*'
            includeGroup 'com.eliotlash.mclib'
        }
    }

    maven {
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com'

        content {
            includeGroup 'mezz.jei'
        }
    }

    maven {
        name = 'Illusive Soulworks maven'
        url = 'https://maven.theillusivec4.top/'

        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }

    maven {
        name = 'Curse Maven'
        url = 'https://www.cursemaven.com'

        content {
            includeGroup 'curse.maven'
        }
    }

    maven {
        name = "Xaero's Maven"
        url = 'https://chocolateminecraft.com/maven'

        content {
            includeGroup 'xaero.map'
            includeGroup 'xaero.lib'
        }
    }

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    /*
     * Optional development-client renderer stack.
     *
     * IMPORTANT:
     * Let ForgeGradle supply the deobfuscated development-runtime versions.
     * Do NOT manually copy raw or mapped Embeddium/Oculus jars into run/mods.
     *
     * Normal:
     *   .\gradlew.bat runClient
     *
     * Disable Embeddium/Oculus:
     *   .\gradlew.bat runClient -PaflWithoutShaders
     *
     * Pure-Forge smoke client:
     *   .\gradlew.bat runClientPureForge -PaflWithoutShaders
     */
    if (!project.hasProperty('aflWithoutShaders')) {
        runtimeOnly fg.deobf(
                "curse.maven:embeddium-908741:${embeddium_file_id}"
        )

        runtimeOnly fg.deobf(
                "curse.maven:oculus-581495:${oculus_file_id}"
        )
    }
    // Embeddium's chunk mesh API (ChunkMeshEvent) for the guns lying on the ground (client/GroundGunEmbeddium, loaded only
    // when Embeddium is); compile only, so -PaflWithoutShaders and a pure Forge install still run without it.
    compileOnly fg.deobf("curse.maven:embeddium-908741:${embeddium_file_id}")

    // Optional comparison mod only.
    // Use -PaflWithTacz to opt in;
    // -PaflWithoutTacz remains an explicit override for old scripts.
    if (project.hasProperty('aflWithTacz') &&
            !project.hasProperty('aflWithoutTacz')) {

        runtimeOnly fg.deobf(
                "curse.maven:timeless-and-classics-zero-1028108:8141310"
        )
    }

    implementation fg.deobf(
            "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
    )

    implementation "com.eliotlash.mclib:mclib:20"

    // Vextris mesh library: compile against its API; at runtime it is its own mod (mods.toml hard dependency).
    // compileOnly + runtimeOnly: nothing of Vextris is copied or bundled into the AFL jar.
    compileOnly fg.deobf("io.github.dwom10912:vextris:${vextris_version}")
    runtimeOnly fg.deobf("io.github.dwom10912:vextris:${vextris_version}")

    // Curios (required): extra equipment slots. AFL compiles against the API only; the full mod runs in dev.
    compileOnly fg.deobf(
            "top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api"
    )

    runtimeOnly fg.deobf(
            "top.theillusivec4.curios:curios-forge:5.14.1+1.20.1"
    )

    implementation fg.deobf(
            "curse.maven:terrablender-563928:${terrablender_file_id}"
    )

    // Optional JEI client integration.
    // API jars compile compat code; the full mod is dev-runtime only.
    compileOnly fg.deobf(
            "mezz.jei:jei-1.20.1-common-api:15.49.0.188"
    )

    compileOnly fg.deobf(
            "mezz.jei:jei-1.20.1-forge-api:15.49.0.188"
    )

    runtimeOnly fg.deobf(
            "mezz.jei:jei-1.20.1-forge:15.49.0.188"
    )

    // Optional Jade integration.
    runtimeOnly fg.deobf(
            "curse.maven:jade-324717:5493390"
    )

    compileOnly fg.deobf(
            "curse.maven:jade-324717:5493390"
    )

    // Development-runtime helpers only.
    // AFL neither compiles against nor declares these mods.
    if (!project.hasProperty('aflWithoutWorldEdit')) {
        runtimeOnly fg.deobf(
                "curse.maven:worldedit-225608:4586218"
        )
    }

    compileOnly fg.deobf(
            "curse.maven:worldedit-225608:4586218"
    )

    devCompileOnly fg.deobf(
            "curse.maven:worldedit-225608:4586218"
    )

    implementation(
            "xaero.map:xaeroworldmap-forge-1.20.1:1.41.2:dev"
    ) {
        exclude group: 'xaero.lib',
                module: 'xaerolib-forge-1.20.1'
    }

    implementation(
            "xaero.lib:xaerolib-forge-1.20.1:1.1.15:dev"
    )
}

// ClimateParameterListMixin targets TerraBlender's runtime-added method.
// The exact descriptor is retained in the mixin;
// only compile-time target validation is disabled because the method is injected after javac.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            '-AdisableTargetValidator=true'
    ]
}

// This block expands all declared replace properties in the specified resource targets.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching([
            'META-INF/mods.toml',
            'pack.mcmeta'
    ]) {
        expand replaceProperties + [
                project: project
        ]
    }
}

tasks.named('jar', Jar).configure {
    exclude 'com/antaurora/apofirstlight/dev/**'
    exclude 'assets/afl_highway_demo/**'
    exclude 'assets/apocalypse_firstlight/blockstates/dev_highway_surface.json'
    exclude 'assets/apocalypse_firstlight/models/block/dev_highway_surface.json'
    // Mesh Trees P4 (docs/rendering/mesh_trees_p4_formal.md): the trees ship (src/main); only the development commands
    // stay out, compiled from src/dev/java into the formal package com.antaurora.apofirstlight.tree
    exclude 'com/antaurora/apofirstlight/tree/TreeCommands*'
    exclude 'com/antaurora/apofirstlight/tree/ForestCommands*'
    exclude 'com/antaurora/apofirstlight/tree/FellingCommands*'
    exclude '.gitattributes'

    manifest {
        attributes([
                'Specification-Title'       : mod_id,
                'Specification-Vendor'      : mod_authors,
                'Specification-Version'     : '1',
                'Implementation-Title'      : project.name,
                'Implementation-Version'    : project.jar.archiveVersion,
                'Implementation-Vendor'     : mod_authors,
                'Implementation-Timestamp'  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Pure JOML regression, no game bootstrap or additional test dependency.
tasks.register('projectionMathTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.weapon.client.FirstPersonProjectionSanitizerTest'
}

tasks.named('check') {
    dependsOn tasks.named('projectionMathTest')
}

// Player skeleton V1 numeric checks (docs/dev/player_skeleton_v1_design.md 8.3): rest pose vs vanilla cubes, joints at
// their limits, BR51 reach, camera clearance. Pure JOML / Gson on the game's own skeleton classes, no game bootstrap.
tasks.register('skeletonCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.skeleton.PlayerSkeletonCheck'
}

// Ragdoll V1 (docs/dev/ragdoll_v1_plan.md 7): fixed scenes, a body falls and must end still, out of blocks, in limits.
tasks.register('ragdollCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.skeleton.RagdollCheck'
}

// AFL Rig Blockbench plugin (docs/dev/afl_rig_blockbench_plugin_v1.md): the player actions posed by the real poser, as JSON
// for tools/blockbench/afl_rig_check.mjs, which compares the plugin's port of the poser with it.
tasks.register('aflRigParity', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.skeleton.AflRigParity'
    args 'build/afl_rig_parity.json'
}

// P9 draw / holster V1 (docs/dev/p9_draw_holster_actions_v1.md 2.1-2.3): the guns' player prop files from their geo, mesh and
// item model; --args="--check p9_01" compares instead.
tasks.register('gunPropExport', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.skeleton.GunPropExport'
    args 'p9_01'
}

// Vehicle physics V0-b package 1 (docs/vehicles/first_pickup_v0_design.md 3.8): settle, drive, brake, slopes, kerb, wall, turns.
tasks.register('vehicleCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.vehicle.physics.VehiclePhysicsCheck'
}

// T15 headlamp beams (docs/vehicles/first_pickup_v0_design.md 8.10): light along and across, reach, walls, layers.
tasks.register('headlightCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.vehicle.HeadlightBeamCheck'
}

// Camera director V1 (docs/dev/camera_director_v1_plan.md): blend / stack / lock math and the moved shake sources.
tasks.register('cameraCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.client.camera.CameraDirectorCheck'
}

// WG-01 pure contract regression; no world bootstrap or new test dependencies.
tasks.register('terrainContractTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.worldgen.terrain.TerrainContractTest'
}

tasks.named('check') {
    dependsOn tasks.named('terrainContractTest')
}

// Road ground query regression (docs/worldgen/road_surface_query_v1.md): every road of a cached network file,
// 0.25 m steps; -ProadNetwork=<file>, or every cached network under run/ and build/federal-c2-client/ (afl_cache).
// Not in check: needs a cache, which the game writes on a federal world's first load.
tasks.register('roadSurfaceCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.worldgen.network.road.RoadSurfaceCheck'
    if (project.hasProperty('roadNetwork')) args project.property('roadNetwork')
}

// C3.3b survey: where the built roads stop short of each other (docs/worldgen/federal_junctions_c3_3b.md).
tasks.register('junctionSurvey', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.worldgen.network.road.JunctionSurvey'
    if (project.hasProperty('debugRegrade')) systemProperty 'afl.debugRegrade', 'true'
    args project.findProperty('roadNetwork') ?: 'build/federal-c2-client/afl_cache/road_network/afl_road_network_c3_v1_4_225bd321232e0bda.json'
}

// C3.3b check: junction pads and town corners over built networks (docs/worldgen/federal_junctions_c3_3b.md 6).
tasks.register('junctionCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.worldgen.network.road.JunctionCheck'
    if (project.hasProperty('roadNetwork')) args project.property('roadNetwork')
}

// C3.3b group 2 survey: state road ends on an interstate (docs/worldgen/federal_interchanges_c3_3b.md); -ProadNetwork=<file>.
tasks.register('interchangeSurvey', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.worldgen.network.road.InterchangeSurvey'
    args((project.findProperty('roadNetwork') ?: 'build/federal-c2-client/afl_cache/road_network/afl_road_network_c3_v1_4_225bd321232e0bda.json').toString().split(';'))
}

// C3.3b group 2: the diamond interchanges (docs/worldgen/federal_interchanges_c3_3b.md 10); -ProadNetwork=<file;file>, none: every cache.
tasks.register('interchangeCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.worldgen.network.road.InterchangeCheck'
    if (project.hasProperty('debugInterchanges')) systemProperty 'afl.debugInterchanges', 'true'
    if (project.hasProperty('noInterchanges')) systemProperty 'afl.noInterchanges', 'true'
    if (project.hasProperty('debugLine')) systemProperty 'afl.debugLine', project.property('debugLine').toString()
    if (project.hasProperty('roadNetwork')) args project.property('roadNetwork').toString().split(';')
}

// C3.3b group 2 package B: the interchange guide signs (docs/worldgen/federal_interchanges_c3_3b.md 10, 11.2); -ProadNetwork=<file;file>, none: every cache.
tasks.register('guideSignCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.worldgen.network.road.GuideSignCheck'
    if (project.hasProperty('debugGuides')) systemProperty 'afl.debugGuides', 'true'
    if (project.hasProperty('roadNetwork')) args(project.property('roadNetwork').toString().split(';'))
}

// Offline front view of guide signs as the client bakes them (client/road/GuideSignRender): -Pout=<png> -Pbones=<bone;bone>.
tasks.register('guideSignRender', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.client.road.GuideSignRender'
    args(['src/main/resources/assets/apocalypse_firstlight/textures/block/road/guide_sign.png', (project.findProperty('out') ?: 'build/guide_signs.png').toString()]
            + (project.findProperty('bones') ?: 'adv|4|R61|S|Redfield|1|0,0;dir|1|R80||Redfield/Pelican Point|ur|0,0;gore|8||||ur|0,0;ent||F65|N|Kessler|ul|0,0').toString().split(';').toList())
}

// Regional weather V1 offline look (docs/gameplay/regional_weather_v1_plan.md 10): -Pout= -Pseed= -Pfirst= -Pdays=
tasks.register('weatherMap', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.weather.WeatherMapRender'
    args([(project.findProperty('out') ?: 'design/world/weather_w1/days.png').toString(),
          (project.findProperty('seed') ?: '-295378578869149513').toString(),
          (project.findProperty('first') ?: '0').toString(),
          (project.findProperty('days') ?: '3').toString()])
}

// C3.3b group 3 survey: interstate corners at cities and interstate joins (docs/worldgen/federal_systems_c3_3b.md); -ProadNetwork=<file;file>
tasks.register('systemSurvey', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.worldgen.network.road.SystemSurvey'
    args((project.findProperty('roadNetwork') ?: 'build/federal-c2-client/afl_cache/road_network/afl_road_network_c3_v1_4_225bd321232e0bda.json').toString().split(';'))
}

// C3.3b group 3: the system interchanges built from the offline plans (docs/worldgen/federal_systems_c3_3b.md); -ProadNetwork=<file;file>
// (default: the newest plan per seed in build/federal-systems/plans), -PdebugSystems=1, -PnoSystems=1
tasks.register('systemCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.worldgen.network.road.SystemCheck'
    maxHeapSize = '4g'
    if (project.findProperty('debugSystems')) systemProperty 'afl.debugSystems', 'true'
    if (project.findProperty('noSystems')) systemProperty 'afl.noSystems', 'true'
    if (project.findProperty('systemsPng')) systemProperty 'afl.systemsPng', project.property('systemsPng').toString()
    if (project.findProperty('systemsAt')) systemProperty 'afl.systemsAt', project.property('systemsAt').toString()
    if (project.findProperty('systemsEdge')) systemProperty 'afl.systemsEdge', project.property('systemsEdge').toString()
    if (project.findProperty('roadNetwork')) args project.property('roadNetwork').toString().split(';')
}

// C3.3b group 3 offline planning: the network planned again from cached C2 terrain plans, written to build/federal-systems/plans
// (docs/worldgen/federal_systems_c3_3b.md 5); -PterrainPlans=<bin;bin> (default: the six survey seeds, other checkouts read only)
tasks.register('townCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.worldgen.network.road.TownCheck'
    maxHeapSize = '6g'
    if (project.findProperty('townPng')) systemProperty 'afl.townPng', project.property('townPng').toString()
    if (project.findProperty('debugInterchanges')) systemProperty 'afl.debugInterchanges', 'true'
    if (project.findProperty('debugTowns')) systemProperty 'afl.debugTowns', 'true'
    if (project.findProperty('terrainPlans')) args(project.findProperty('terrainPlans').toString().split(';'))
    if (project.findProperty('townJfr')) jvmArgs('-XX:StartFlightRecording=filename=' + project.property('townJfr').toString() + ',settings=profile')
}

tasks.register('townProbe', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.worldgen.network.road.TownProbe'
    maxHeapSize = '6g'
    if (project.findProperty('probeArgs')) args(project.findProperty('probeArgs').toString().split(';'))
}

tasks.register('townSurvey', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antaurora.apofirstlight.worldgen.network.road.TownSurvey'
    maxHeapSize = '6g'
    if (project.findProperty('townArgs')) args(project.findProperty('townArgs').toString().split(' '))
}

tasks.register('systemPlans', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
