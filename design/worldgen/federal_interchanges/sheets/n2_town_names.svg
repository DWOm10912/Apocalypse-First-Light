="273" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#23282b">月桂岭</text><text x="1060" y="272" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">山月桂 + 山岭，东部丘陵的叫法</text><rect x="40" y="294" width="1820" height="162" fill="#f3ecd0" opacity="0.55"/><text x="46" y="324" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#23282b">S2 农业平原</text><text x="46" y="344" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5d6669">中西部农业州</text><line x1="40" y1="294" x2="1860" y2="294" stroke="#9aa3a6" stroke-width="1"/><text x="250" y="326" font-family="Consolas, IBM Plex Mono, monospace" font-size="13.5" fill="#5d6669">county_seat</text><text x="470" y="326" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">县城 2 级</text><rect x="600" y="302" width="123" height="38" rx="5" fill="#006b45"/><rect x="603" y="305" width="117" height="32" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><text x="661.5" y="330" font-family="Bahnschrift, Arial Narrow, sans-serif" style="font-variation-settings: 'wdth' 78, 'wght' 620" font-size="26" fill="#fff" text-anchor="middle">Sutton</text><text x="900" y="327" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#23282b">萨顿</text><text x="1060" y="326" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">平原县城多用开拓者的姓</text><text x="250" y="380" font-family="Consolas, IBM Plex Mono, monospace" font-size="13.5" fill="#5d6669">farm_town_north</text><text x="470" y="380" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">农镇</text><rect x="600" y="356" width="138.5" height="38" rx="5" fill="#006b45"/><rect x="603" y="359" width="132.5" height="32" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><text x="669.25" y="384" font-family="Bahnschrift, Arial Narrow, sans-serif" style="font-variation-settings: 'wdth' 78, 'wght' 620" font-size="26" fill="#fff" text-anchor="middle">Elmwood</text><text x="900" y="381" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#23282b">榆林镇</text><text x="1060" y="380" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">平原上的防风榆树林</text><text x="250" y="434" font-family="Consolas, IBM Plex Mono, monospace" font-size="13.5" fill="#5d6669">farm_town_south</text><text x="470" y="434" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">农镇</text><rect x="600" y="410" width="154" height="38" rx="5" fill="#006b45"/><rect x="603" y="413" width="148" height="32" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><text x="677" y="438" font-family="Bahnschrift, Arial Narrow, sans-serif" style="font-variation-settings: 'wdth' 78, 'wght' 620" font-size="26" fill="#fff" text-anchor="middle">Redfield</text><text x="900" y="435" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#23282b">红田镇</text><text x="1060" y="434" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">南边的红土麦田</text><rect x="40" y="456" width="1820" height="108" fill="#dde5ee" opacity="0.55"/><text x="46" y="486" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#23282b">S3 寒冷山地</text><text x="46" y="506" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5d6669">山区矿业</text><line x1="40" y1="456" x2="1860" y2="456" stroke="#9aa3a6" stroke-width="1"/><text x="250" y="488" font-family="Consolas, IBM Plex Mono, monospace" font-size="13.5" fill="#5d6669">mining_town</text><text x="470" y="488" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">矿镇</text><rect x="600" y="464" width="123" height="38" rx="5" fill="#006b45"/><rect x="603" y="467" width="117" height="32" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><text x="661.5" y="492" font-family="Bahnschrift, Arial Narrow, sans-serif" style="font-variation-settings: 'wdth' 78, 'wght' 620" font-size="26" fill="#fff" text-anchor="middle">Cobalt</text><text x="900" y="489" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#23282b">科博尔特</text><text x="1060" y="488" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">山区矿镇常拿矿种命名</text><text x="250" y="542" font-family="Consolas, IBM Plex Mono, monospace" font-size="13.5" fill="#5d6669">pass_village</text><text x="470" y="542" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">村</text><rect x="600" y="518" width="154" height="38" rx="5" fill="#006b45"/><rect x="603" y="521" width="148" height="32" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><text x="677" y="546" font-family="Bahnschrift, Arial Narrow, sans-serif" style="font-variation-settings: 'wdth' 78, 'wght' 620" font-size="26" fill="#fff" text-anchor="middle">Tamarack</text><text x="900" y="543" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#23282b">落叶松垭</text><text x="1060" y="542" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">美洲落叶松；垭口上的村</text><rect x="40" y="564" width="1820" height="162" fill="#e7e3f0" opacity="0.55"/><text x="46" y="594" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#23282b">S4 工业湖区</text><text x="46" y="614" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5d6669">五大湖工业</text><line x1="40" y1="564" x2="1860" y2="564" stroke="#9aa3a6" stroke-width="1"/><text x="250" y="596" font-family="Consolas, IBM Plex Mono, monospace" font-size="13.5" fill="#5d6669">industrial_city</text><text x="470" y="596" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">工业城 1 级</text><rect x="600" y="572" width="138.5" height="38" rx="5" fill="#006b45"/><rect x="603" y="575" width="132.5" height="32" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><text x="669.25" y="600" font-family="Bahnschrift, Arial Narrow, sans-serif" style="font-variation-settings: 'wdth' 78, 'wght' 620" font-size="26" fill="#fff" text-anchor="middle">Kessler</text><text x="900" y="597" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#23282b">凯斯勒</text><text x="1060" y="596" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">钢铁公司创办人的姓，典型的公司城</text><text x="250" y="650" font-family="Consolas, IBM Plex Mono, monospace" font-size="13.5" fill="#5d6669">port_town</text><text x="470" y="650" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">港镇</text><rect x="600" y="626" width="200.5" height="38" rx="5" fill="#006b45"/><rect x="603" y="629" width="194.5" height="32" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><text x="700.25" y="654" font-family="Bahnschrift, Arial Narrow, sans-serif" style="font-variation-settings: 'wdth' 78, 'wght' 620" font-size="26" fill="#fff" text-anchor="middle">Gull Harbor</text><text x="900" y="651" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#23282b">海鸥港</text><text x="1060" y="650" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">北湾的湖港</text><text x="250" y="704" font-family="Consolas, IBM Plex Mono, monospace" font-size="13.5" fill="#5d6669">mill_town</text><text x="470" y="704" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">村</text><rect x="600" y="680" width="200.5" height="38" rx="5" fill="#006b45"/><rect x="603" y="683" width="194.5" height="32" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><text x="700.25" y