" width="185" height="38" rx="5" fill="#006b45"/><rect x="603" y="791" width="179" height="32" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><text x="692.5" y="816" font-family="Bahnschrift, Arial Narrow, sans-serif" style="font-variation-settings: 'wdth' 78, 'wght' 620" font-size="26" fill="#fff" text-anchor="middle">Bayou Noir</text><text x="900" y="813" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#23282b">黑水湾</text><text x="1060" y="812" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">黑水河汊（bayou）</text><text x="250" y="866" font-family="Consolas, IBM Plex Mono, monospace" font-size="13.5" fill="#5d6669">shore_town</text><text x="470" y="866" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">镇</text><rect x="600" y="842" width="231.5" height="38" rx="5" fill="#006b45"/><rect x="603" y="845" width="225.5" height="32" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><text x="715.75" y="870" font-family="Bahnschrift, Arial Narrow, sans-serif" style="font-variation-settings: 'wdth' 78, 'wght' 620" font-size="26" fill="#fff" text-anchor="middle">Pelican Point</text><text x="900" y="867" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#23282b">鹈鹕角</text><text x="1060" y="866" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">海岸沙嘴上的镇</text><rect x="40" y="888" width="1820" height="108" fill="#f3e1cf" opacity="0.55"/><text x="46" y="918" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#23282b">S6 西部荒漠高原</text><text x="46" y="938" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5d6669">西南西班牙语</text><line x1="40" y1="888" x2="1860" y2="888" stroke="#9aa3a6" stroke-width="1"/><text x="250" y="920" font-family="Consolas, IBM Plex Mono, monospace" font-size="13.5" fill="#5d6669">desert_town</text><text x="470" y="920" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">镇 2 级</text><rect x="600" y="896" width="169.5" height="38" rx="5" fill="#006b45"/><rect x="603" y="899" width="163.5" height="32" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><text x="684.75" y="924" font-family="Bahnschrift, Arial Narrow, sans-serif" style="font-variation-settings: 'wdth' 78, 'wght' 620" font-size="26" fill="#fff" text-anchor="middle">Mesa Roja</text><text x="900" y="921" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#23282b">梅萨罗哈</text><text x="1060" y="920" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">西班牙语"红色台地"</text><text x="250" y="974" font-family="Consolas, IBM Plex Mono, monospace" font-size="13.5" fill="#5d6669">canyon_outpost</text><text x="470" y="974" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">前哨</text><rect x="600" y="950" width="231.5" height="38" rx="5" fill="#006b45"/><rect x="603" y="953" width="225.5" height="32" rx="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><text x="715.75" y="978" font-family="Bahnschrift, Arial Narrow, sans-serif" style="font-variation-settings: 'wdth' 78, 'wght' 620" font-size="26" fill="#fff" text-anchor="middle">Fort Ocotillo</text><text x="900" y="975" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" font-weight="700" fill="#23282b">奥科蒂约堡</text><text x="1060" y="974" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">沙漠植物 ocotillo；Fort = 前哨</text><line x1="40" y1="996" x2="1860" y2="996" stroke="#23282b" stroke-width="1.5"/><text x="40" y="1030" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#5d6669">· 州名这次没有定：现在用不到（干线号码跨州不变），等州界欢迎牌、州内道路时再定。</text><text x="40" y="1052" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#5d6669">· 计划：B 包的牌面文字按一张名字表生成，定了以后再改名只改这张表。</text></g>
