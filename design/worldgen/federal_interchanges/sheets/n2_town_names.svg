<g><text x="40" y="52" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="700" fill="#23282b">16 个城镇的名字（草案）：牌上用英文名，游戏界面中文用中文名</text><text x="40" y="80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14.5" fill="#5d6669">按各州的开发史分口音：东部英式老州、平原中西部、山区矿镇、五大湖工业、南部法语湾区、西南西班牙语；构词照北美常见的 -haven、-field、Fort、Bayou、Mesa，不用真实大城市的名字。</text><text x="40" y="122" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#8e3a32">州</text><text x="250" y="122" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#8e3a32">内部 id</text><text x="470" y="122" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#8e3a32">类型</text><text x="600" y="122" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#8e3a32">牌面效果（英文）</text><text x="900" y="122" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#8e3a32">中文名</text><text x="1060" y="122" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#8e3a32">由来</text><line x1="40" y1="132" x2="1860" y2="132" stroke="#23282b" stroke-width="1.5"/><rect x="40" y="132" width="1820" height="162" fill="#e2eed9" opacity="0.55"/><text x="46" y="162" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#23282b">S1 东部森林河谷</text><text x="46" y="182" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#5d6669">英式殖民老州</text><text x="250" y="164" font-family="Consolas, IBM Plex Mono, monospace" font-size="13.5" fill="#5d6669">river_city</text><text x="470" y="164" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#23282b">城市 1 级</text><rect x="600" y="140" width="169.5" height="38" rx="5" fill="#006b45"/><rect x="603" y="143" width="163.5" height="32" rx="3.5" fill="none" s