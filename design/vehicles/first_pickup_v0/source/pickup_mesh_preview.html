<!doctype html><html><head><meta charset="utf-8"><title>Pickup Mesh Preview</title><style>body{margin:0;background:#222}canvas{max-width:100%}</style></head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="crease.js"></script>
<script>
// AFL Halstead Tamarack T15, game mesh preview (design use only): draws the built Pure Meshes (tools/build-pickup-t15.mjs)
// the way the entity renderer does: pickup_t15 + pickup_t15_front always, the wheel mesh at the four hubs (the left ones
// turned half a turn about Y), cab / engine / chassis when built; bones at their geo pivots; normals: opts.normals 'flat',
// 'crease' (Vextris format 3 crease_angle with the file's crease_weighting, default corner angle; crease.js) or 'area'
// (forced face-area weighting); base atlas
// with the painted parts multiplied by the paint colours; wear = the overlay for round(wear x 10) drawn over the painted
// parts with the vanilla cutout rule (texture alpha only); glass translucent. Plain two-light setup like vanilla entities.
// Serve with serve.cjs (it maps /assets/ to the mod assets), then in the console: await shot(view, opts) / await sheet().
const PI = Math.PI, W = 1400, H = 900;
const r = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true}); r.setPixelRatio(1); r.setSize(W, H);
r.outputEncoding = THREE.sRGBEncoding; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9fb4c4');
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const l0 = new THREE.DirectionalLight(0xffffff, 0.55); l0.position.set(0.2, 1, -0.7); scene.add(l0);
const l1 = new THREE.DirectionalLight(0xffffff, 0.35); l1.position.set(-0.2, 1, 0.7); scene.add(l1);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({color: '#6d6a5e'})); ground.rotation.x = -PI / 2; scene.add(ground);
const cam = new THREE.PerspectiveCamera(32, W / H, 0.02, 100);
const load = u => new Promise(res => new THREE.TextureLoader().load(u, t => { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.flipY = false; t.encoding = THREE.sRGBEncoding; res(t); }, undefined, () => res(null)));
const json = u => fetch(u).then(x => x.ok ? x.json() : null).catch(() => null);
const srgb = h => new THREE.Color(h).convertSRGBToLinear();
// hub positions (blocks, runtime frame) and the turned flag; spare under the bed rear, lying flat
const SPARE = [0, 0.50, 1.86];   // spare under the bed, outboard face down
const HUBS = {fl: [-0.712, 0.36, -1.60, true], fr: [0.712, 0.36, -1.60, false], rl: [-0.712, 0.36, 1.25, true], rr: [0.712, 0.36, 1.25, false]};
const MESHES = [['pickup_t15', 'pickup_t15'], ['pickup_t15_front', 'pickup_t15'], ['pickup_t15_cab', 'pickup_t15_cab'], ['pickup_t15_seat', 'pickup_t15_cab'], ['pickup_t15_engine', 'pickup_t15_under'], ['pickup_t15_chassis', 'pickup_t15_under']];
let ROOT = null; const BONES = {}, PAINTED = [], WEAR = [], WEARTEX = [], GROUPS = {}, GEOMS = [];
function partMeshes(mesh, tex, parent, bonesOut) {
  const cut = new THREE.MeshLambertMaterial({map: tex, side: THREE.DoubleSide, alphaTest: 0.1});
  const glass = new THREE.MeshLambertMaterial({map: tex, side: THREE.DoubleSide, transparent: true, depthWrite: false});
  for (const p of mesh.parts) {
    const pos = [], uv = [], crease = p.crease_angle ?? mesh.crease_angle ?? 0, normals = {};
    const sets = {crease: crease > 0 ? creaseNormals(p.vertices, p.faces, crease, p.crease_weighting ?? mesh.crease_weighting ?? 'angle') : null, area: crease > 0 ? creaseNormals(p.vertices, p.faces, crease, 'area') : null};
    for (const k of ['crease', 'area']) if (sets[k]) normals[k] = [];
    p.faces.forEach((f, fi) => { const tri = f.length === 4 ? [[0, 1, 2], [0, 2, 3]] : [[0, 1, 2]];
      for (const t of tri) for (const k of t) { const v = p.vertices[f[k]]; pos.push(v[0], v[1], v[2]); uv.push(v[3], v[4]);
        for (const m in normals) normals[m].push(...sets[m][fi][k]); } });
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.computeVertexNormals();
    normals.flat = Array.from(g.attributes.normal.array); GEOMS.push({g, normals, mode: 'flat'});
    const isGlass = p.render_layer === 'translucent', painted = /_paint2?$/.test(p.name);
    const me = new THREE.Mesh(g, isGlass ? glass : painted ? cut.clone() : cut); (bonesOut[p.bone] || parent).add(me);
    if (painted) { me.userData.second = p.name.endsWith('_paint2'); PAINTED.push(me);
      const w = new THREE.Mesh(g, new THREE.MeshLambertMaterial({side: THREE.DoubleSide, alphaTest: 0.5, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1}));
      w.userData.wearLayer = true; (bonesOut[p.bone] || parent).add(w); WEAR.push(w); }
  }
}
async function build() {
  ROOT = new THREE.Group(); scene.add(ROOT);
  for (const [id, atlas] of MESHES) {
    const [mesh, geo, tex] = await Promise.all([json(`/assets/meshes/${id}.aflmesh.json`), json(`/assets/geo/${id}.geo.json`), load(`/assets/textures/entity/vehicle/${atlas}.png`)]);
    if (!mesh || !geo) continue;
    const grp = new THREE.Group(); ROOT.add(grp); GROUPS[id] = grp; const bones = {};
    for (const b of geo['minecraft:geometry'][0].bones) { const g = new THREE.Group(); g.position.set(-b.pivot[0] / 16, b.pivot[1] / 16, b.pivot[2] / 16); grp.add(g); bones[b.name] = g; (BONES[b.name] = BONES[b.name] || []).push(g); }
    partMeshes(mesh, tex, grp, bones);
  }
  const [wm, wtex] = await Promise.all([json('/assets/meshes/pickup_t15_wheel.aflmesh.json'), load('/assets/textures/entity/vehicle/pickup_t15.png')]);
  if (wm) for (const [n, [x, y, z, turned]] of Object.entries(HUBS)) {
    const g = new THREE.Group(); g.position.set(x, y, z); if (turned) g.rotation.y = PI; ROOT.add(g); GROUPS['wheel_' + n] = g; partMeshes(wm, wtex, g, {});
  }
  if (wm) { const g = new THREE.Group(); g.position.set(...SPARE); g.rotation.z = -PI / 2; ROOT.add(g); GROUPS.spare = g; partMeshes(wm, wtex, g, {}); }
  for (let L = 1; L <= 10; L++) WEARTEX[L] = await load(`/assets/textures/entity/vehicle/pickup_t15_wear_${L}.png`);
}
function setNormals(mode) {
  for (const e of GEOMS) { const m = e.normals[mode] ? mode : 'flat'; if (e.mode === m) continue;
    e.g.setAttribute('normal', new THREE.Float32BufferAttribute(e.normals[m], 3)); e.mode = m; }
}
// gloss: Phong highlights on every opaque part (a stand-in for a shader pack's specular, where normal errors show most)
let GLOSS = false;
function setGloss(on) {
  if (GLOSS === on) return; GLOSS = on;
  ROOT.traverse(o => { if (!o.isMesh || o.material.transparent || o.userData.wearLayer) return;
    const old = o.material, m = on ? new THREE.MeshPhongMaterial({map: old.map, side: old.side, alphaTest: old.alphaTest, color: old.color, shininess: 70, specular: new THREE.Color(0x444444)})
      : new THREE.MeshLambertMaterial({map: old.map, side: old.side, alphaTest: old.alphaTest, color: old.color});
    o.material = m; });
}
function setPaint(c1, c2, wear) {
  const fade = c => { const col = srgb(c), hsl = {}; col.getHSL(hsl); col.setHSL(hsl.h, hsl.s * (1 - 0.35 * wear), Math.min(1, hsl.l * (1 + 0.08 * wear))); return col; };
  for (const m of PAINTED) m.material.color = fade(m.userData.second ? (c2 || c1) : c1);
  const L = Math.round(wear * 10);
  for (const w of WEAR) { w.visible = L > 0 && !!WEARTEX[L]; if (w.visible && w.material.map !== WEARTEX[L]) { w.material.map = WEARTEX[L]; w.material.needsUpdate = true; } }
}
function pose({hood = 0, tailgate = 0, doorL = 0, doorR = 0, steer = 0} = {}) {
  const rot = (b, x, y) => (BONES[b] || []).forEach(g => g.rotation.set(x, y, 0));
  rot('hood', hood * PI / 180, 0); rot('tailgate', tailgate * PI / 180, 0); rot('door_l', 0, -doorL * PI / 180); rot('door_r', 0, doorR * PI / 180);
  for (const n of ['fl', 'fr']) if (GROUPS['wheel_' + n]) GROUPS['wheel_' + n].rotation.y = (HUBS[n][3] ? PI : 0) - steer * PI / 180;
}
const VIEWS = {   // runtime frame: front toward -Z, right toward +X, driver at -X
  front34: [[-4.2, 1.9, -5.4], [0, 0.8, 0]], rear34: [[4.4, 2.2, 5.2], [0, 0.8, 0]], side: [[-9, 1.0, 0], [0, 0.85, 0]], sideR: [[9, 1.0, 0], [0, 0.85, 0]],
  front: [[0, 1.0, -9], [0, 0.8, 0]], rear: [[0, 1.2, 9], [0, 0.8, 0]], top: [[0.01, 11, 0], [0, 0, 0]],
  faceClose: [[-1.3, 1.1, -3.6], [0, 0.78, -2.2]], rearClose: [[1.4, 1.3, 3.7], [0, 0.8, 2.2]], wheelClose: [[-2.3, 0.6, -2.4], [-0.7, 0.36, -1.6]],
  cabClose: [[-2.6, 1.8, 0.6], [-0.5, 1.2, -0.4]], roof: [[-2.2, 3.0, 1.2], [0, 1.5, -0.3]],
  bay: [[-1.6, 2.5, -3.3], [0, 0.75, -1.6]], bayTop: [[0.4, 3.0, -2.3], [0, 0.7, -1.6]],
  cab: [[-2.1, 1.55, -0.2], [0.3, 0.9, 0.0]], under: [[-3.5, 0.15, 1.5], [0, 0.4, 0]], bed: [[1.6, 2.8, 4.2], [0, 0.8, 1.2]],
  bayR: [[2.0, 2.2, -3.2], [0, 0.72, -1.6]], doorIn: [[-2.3, 1.55, 0.35], [-0.2, 1.0, -0.35]], eye: [[-0.37, 1.47, 0.12], [-0.37, 1.02, -0.70]],
  dashWide: [[0.15, 1.42, 0.25], [-0.3, 1.0, -0.65]], seatView: [[0.0, 1.5, -1.2], [0.0, 1.0, 0.1]],
  under2: [[-4.0, 0.25, -0.6], [0, 0.45, 0.2]], underRear: [[-2.6, 0.3, 3.6], [0, 0.5, 1.3]],
};
async function shot(view, {c1 = '#7b1e1a', c2 = null, wear = 0, hood = 0, tailgate = 0, doorL = 0, doorR = 0, steer = 0, fov = 32, name = null, normals = 'flat', gloss = false} = {}) {
  if (!ROOT) await build();
  setNormals(normals); setGloss(gloss);
  setPaint(c1, c2, wear); pose({hood, tailgate, doorL, doorR, steer});
  const [p, t] = VIEWS[view]; cam.fov = fov; cam.position.set(...p); cam.lookAt(...t); cam.updateProjectionMatrix(); r.render(scene, cam);
  if (name) { const blob = await new Promise(res => r.domElement.toBlob(res, 'image/png')); await fetch('/save?name=' + name, {method: 'POST', body: blob}); }
  return 'ok';
}
async function sheet(list) {
  const S = list || [
    ['front34', {name: 'v1_front34.png'}], ['rear34', {name: 'v1_rear34.png'}], ['side', {name: 'v1_side.png'}],
    ['faceClose', {name: 'v1_face.png'}], ['rearClose', {name: 'v1_rear_close.png'}], ['wheelClose', {name: 'v1_wheel.png'}],
    ['cabClose', {name: 'v1_cab_close.png'}], ['bay', {name: 'v1_bay.png', hood: 58}],
    ['front34', {name: 'v1_wear5.png', c1: '#3d4a5a', wear: 0.5}], ['front34', {name: 'v1_wear10.png', c1: '#3d4a5a', wear: 1}],
    ['side', {name: 'v1_twotone.png', c1: '#2f4a35', c2: '#cfc19f'}], ['bayR', {name: 'v1_bay_r.png', hood: 58}],
    ['doorIn', {name: 'v1_cab_door.png', doorL: 68}], ['eye', {name: 'v1_cab_eye.png', fov: 60}], ['dashWide', {name: 'v1_cab_dash.png', fov: 60}],
    ['seatView', {name: 'v1_cab_seat.png', fov: 60}], ['under2', {name: 'v1_under.png'}], ['underRear', {name: 'v1_under_rear.png'}],
  ];
  for (const [v, o] of S) await shot(v, o);
  return 'done';
}
</script></body></html>
