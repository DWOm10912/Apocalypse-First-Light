<!doctype html><html><head><meta charset="utf-8"><title>Geiger Mesh Preview</title><style>body{margin:0;background:#222}canvas{max-width:100%}</style></head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Geiger counter V2 (direction B), game mesh preview (design use only): draws the built Pure Mesh
// (tools/build-equipment-meshes-v1.mjs geiger_counter) the way client/GeigerCounterItemRenderer does: every part except
// the segments, decimal points and led_on; the segments lit for the shown reading (the same format as
// client/GeigerReadout); led_on instead of led while a count flashes. Flat normals, base atlas, glass translucent.
// Serve with serve.cjs, open http://127.0.0.1:8768/gc_mesh_preview.html, in the console: await sheet().
const PI = Math.PI, W = 1200, H = 800;
const r = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true}); r.setPixelRatio(1); r.setSize(W, H);
r.outputEncoding = THREE.sRGBEncoding; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#8a9aa6');
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const l0 = new THREE.DirectionalLight(0xffffff, 0.6); l0.position.set(0.3, 1, -0.6); scene.add(l0);
const l1 = new THREE.DirectionalLight(0xffffff, 0.3); l1.position.set(-0.3, 0.8, 0.8); scene.add(l1);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.005, 20);
const load = u => new Promise(res => new THREE.TextureLoader().load(u, t => { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.flipY = false; t.encoding = THREE.sRGBEncoding; res(t); }, undefined, () => res(null)));
const json = u => fetch(u).then(x => x.ok ? x.json() : null).catch(() => null);
// seven-segment bits a..g = 1..64; letters O, L and the dash
const DIGIT = [0x3F, 0x06, 0x5B, 0x4F, 0x66, 0x6D, 0x7D, 0x07, 0x7F, 0x6F], O = 0x3F, L = 0x38, DASH = 0x40;
function format(v) {   // -> {cells: [mask x4], dp: index or -1}
  if (v === null) return {cells: [DASH, DASH, DASH, DASH], dp: -1};
  if (v >= 200) return {cells: [0, O, L, 0], dp: -1};
  const [scale, dp] = v < 10 ? [1000, 0] : v < 100 ? [100, 1] : [10, 2];
  const n = Math.min(9999, Math.floor(v * scale + 1e-9)), s = String(n).padStart(4, '0');
  return {cells: [...s].map(c => DIGIT[+c]), dp};
}
let ROOT = null; const PARTS = [];
async function build() {
  ROOT = new THREE.Group(); scene.add(ROOT);
  const [mesh, tex] = await Promise.all([json('/assets/meshes/geiger_counter.aflmesh.json'), load('/assets/textures/item/geiger_counter_mesh.png')]);
  const cut = new THREE.MeshLambertMaterial({map: tex, side: THREE.DoubleSide, alphaTest: 0.1});
  const glass = new THREE.MeshLambertMaterial({map: tex, side: THREE.DoubleSide, transparent: true, depthWrite: false});
  const bright = new THREE.MeshBasicMaterial({map: tex, side: THREE.DoubleSide});
  for (const p of mesh.parts) {
    const pos = [], uv = [];
    for (const f of p.faces) { const tri = f.length === 4 ? [[0, 1, 2], [0, 2, 3]] : [[0, 1, 2]];
      for (const t of tri) for (const k of t) { const v = p.vertices[f[k]]; pos.push(v[0], v[1], v[2]); uv.push(v[3], v[4]); } }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.computeVertexNormals();
    const m = new THREE.Mesh(g, p.render_layer === 'translucent' ? glass : p.name === 'led_on' ? bright : cut); m.name = p.name; ROOT.add(m); PARTS.push(m);
  }
}
function show(v, led) {
  const f = format(v);
  for (const m of PARTS) {
    let s = /^seg_(\d)_([a-g])$/.exec(m.name), d = /^dp_(\d)$/.exec(m.name);
    if (s) m.visible = !!(f.cells[+s[1]] & (1 << (s[2].charCodeAt(0) - 97)));
    else if (d) m.visible = f.dp === +d[1];
    else if (m.name === 'led_on') m.visible = led; else if (m.name === 'led') m.visible = !led;
  }
}
const VIEWS = {   // blocks; the mesh lies face up (+Y), top end toward -Z
  front34: [[0.55, 0.75, 0.75], [0, 0.08, 0]], face: [[0, 1.25, 0.12], [0, 0.18, -0.01]], lcd: [[0.0, 0.62, -0.05], [0, 0.18, -0.16]],
  back: [[0.5, -0.7, 0.6], [0, 0.08, 0]], side: [[1.15, 0.25, 0.0], [0, 0.1, 0]], top: [[0.4, 0.5, -1.1], [0, 0.1, 0]],
};
async function shot(view, {v = 0.42, led = false, fov = 30, name = null} = {}) {
  if (!ROOT) await build();
  show(v, led); const [p, t] = VIEWS[view]; cam.fov = fov; cam.position.set(...p); cam.lookAt(...t); cam.updateProjectionMatrix(); r.render(scene, cam);
  if (name) { const blob = await new Promise(res => r.domElement.toBlob(res, 'image/png')); await fetch('/save?name=' + name, {method: 'POST', body: blob}); }
  return 'ok';
}
async function icon(name) {   // the 16 x 16 inventory icon drawn 16x, nearest
  const img = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = '/assets/textures/item/geiger_counter.png?' + Math.random(); });
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  g.fillStyle = '#8b8b8b'; g.fillRect(0, 0, 256, 256); g.drawImage(img, 0, 0, 256, 256);
  const blob = await new Promise(res => c.toBlob(res, 'image/png')); await fetch('/save?name=' + name, {method: 'POST', body: blob}); return 'ok';
}
// HUD mock: client/GeigerHudOverlay's layout and colours redrawn with canvas paths (the game rasterises the same shapes
// as distance fields; the unit is the vanilla font at half size there, a plain sans font here)
const HUD = {W: 62, H: 24, R: 3, BEZEL: 1.3, LCD: [3.6, 3.6, 44.6, 20.4, 1.4], X0: 7.0, TOP: 6.3, DH: 11.4, DW: 6.8, PITCH: 9.2, BAR: 1.7, GAP: 0.25, COL: 52.6, UNIT: 4.4, LED: 13.0, LEDR: 1.35, BELL: 18.0};
function rrPath(g, x0, y0, x1, y1, rad) { g.beginPath(); g.moveTo(x0 + rad, y0); g.arcTo(x1, y0, x1, y1, rad); g.arcTo(x1, y1, x0, y1, rad); g.arcTo(x0, y1, x0, y0, rad); g.arcTo(x0, y0, x1, y0, rad); g.closePath(); }
function poly(g, pts) { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fill(); }
function hudPanel(g, ox, oy, s, v, led, alarm) {
  g.save(); g.translate(ox, oy); g.scale(s, s);
  const H_ = HUD, grad = g.createLinearGradient(0, 0, 0, H_.H); grad.addColorStop(0, '#5A5E64'); grad.addColorStop(1, '#2A2C2F');
  rrPath(g, 0, 0, H_.W, H_.H, H_.R); g.strokeStyle = 'rgba(232,228,220,0.28)'; g.lineWidth = 0.3; g.stroke();
  rrPath(g, 0.3, 0.3, H_.W - 0.3, H_.H - 0.3, H_.R - 0.3); g.fillStyle = grad; g.fill(); g.strokeStyle = 'rgba(26,27,29,0.9)'; g.lineWidth = 0.45; g.stroke();
  rrPath(g, H_.BEZEL, H_.BEZEL, H_.W - H_.BEZEL, H_.H - H_.BEZEL, H_.R - H_.BEZEL * 0.6); g.fillStyle = '#141517'; g.fill();
  const [lx0, ly0, lx1, ly1, lr] = H_.LCD, lg = g.createLinearGradient(0, ly0, 0, ly0 + 1.6); lg.addColorStop(0, '#8A937E'); lg.addColorStop(1, '#9FA892');
  rrPath(g, lx0, ly0, lx1, ly1, lr); g.fillStyle = lg; g.fill();
  const f = format(v), hb = H_.BAR / 2, G = H_.GAP;
  const hBar = (x0, x1, y) => [[x0 + G, y], [x0 + hb + G, y - hb], [x1 - hb - G, y - hb], [x1 - G, y], [x1 - hb - G, y + hb], [x0 + hb + G, y + hb]];
  const vBar = (x, y0, y1) => [[x, y0 + G], [x + hb, y0 + hb + G], [x + hb, y1 - hb - G], [x, y1 - G], [x - hb, y1 - hb - G], [x - hb, y0 + hb + G]];
  for (let c = 0; c < 4; c++) {
    const x0 = H_.X0 + c * H_.PITCH, l = x0 + hb, r_ = x0 + H_.DW - hb, t = H_.TOP + hb, b = H_.TOP + H_.DH - hb, m = (t + b) / 2;
    const segs = [hBar(l, r_, t), vBar(r_, t, m), vBar(r_, m, b), hBar(l, r_, b), vBar(l, m, b), vBar(l, t, m), hBar(l, r_, m)];
    segs.forEach((sg, bit) => { g.fillStyle = f.cells[c] & (1 << bit) ? '#1D2219' : 'rgba(29,34,25,0.03)'; poly(g, sg); });
    if (c < 3) { const cx = x0 + (H_.DW + H_.PITCH) / 2, y1 = H_.TOP + H_.DH; g.fillStyle = f.dp === c ? '#1D2219' : 'rgba(29,34,25,0.03)'; g.fillRect(cx - H_.BAR / 2, y1 - H_.BAR, H_.BAR, H_.BAR); }
  }
  g.fillStyle = '#F0ECE4'; g.font = 'bold 3.6px Segoe UI, Arial'; g.textAlign = 'center'; g.textBaseline = 'top'; g.fillText('RU/h', H_.COL, H_.UNIT);
  if (led) { g.fillStyle = 'rgba(229,72,58,0.18)'; g.beginPath(); g.arc(H_.COL, H_.LED, H_.LEDR + 1.2, 0, 2 * PI); g.fill(); }
  g.fillStyle = led ? '#E5483A' : '#3A2220'; g.beginPath(); g.arc(H_.COL, H_.LED, H_.LEDR, 0, 2 * PI); g.fill();
  if (alarm) { g.fillStyle = '#E2A24A'; g.beginPath(); g.ellipse(H_.COL, H_.BELL - 0.2, 1.6, 2.0, 0, PI, 2 * PI); g.lineTo(H_.COL + 1.6, H_.BELL + 1.0); g.lineTo(H_.COL - 1.6, H_.BELL + 1.0); g.fill();
    rrPath(g, H_.COL - 2.1, H_.BELL + 0.8, H_.COL + 2.1, H_.BELL + 1.5, 0.3); g.fill(); g.beginPath(); g.arc(H_.COL, H_.BELL + 2.0, 0.55, 0, 2 * PI); g.fill(); }
  g.restore();
}
async function hudSheet(name = 'v2_hud.png') {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 520; const g = c.getContext('2d');
  g.fillStyle = '#5f7a52'; g.fillRect(0, 0, c.width, c.height);
  const states = [[0.042, false, false, '0.042 RU/h'], [3.586, true, false, '3.586 RU/h, count'], [12.7, true, true, '12.70 RU/h, alarm'], [250, true, true, 'OL (>= 200)'], [null, false, false, 'no reading yet']];
  g.font = '15px Segoe UI, Microsoft YaHei'; g.fillStyle = '#f0ece4';
  states.forEach(([v, led, al, label], i) => { const x = 30 + (i % 3) * 390, y = 30 + Math.floor(i / 3) * 250; hudPanel(g, x, y, 5.6, v, led, al); g.fillStyle = '#f0ece4'; g.font = '15px Segoe UI'; g.fillText(label, x, y + 24 * 5.6 + 22); });
  // actual size at GUI scale 3 (one panel px = 3 screen px)
  hudPanel(g, 820, 330, 3, 0.042, true, false); g.fillStyle = '#f0ece4'; g.fillText('GUI scale 3, actual size', 820, 330 + 24 * 3 + 22);
  const blob = await new Promise(res => c.toBlob(res, 'image/png')); await fetch('/save?name=' + name, {method: 'POST', body: blob}); return 'ok';
}
async function sheet() {
  for (const [v, o] of [['front34', {name: 'v2_mesh_front34.png', v: 0.42}], ['face', {name: 'v2_mesh_face.png', v: 12.7, led: true}],
    ['lcd', {name: 'v2_mesh_lcd.png', v: 3.586}], ['back', {name: 'v2_mesh_back.png'}], ['side', {name: 'v2_mesh_side.png', v: 250}],
    ['top', {name: 'v2_mesh_top.png', v: 145.2}]]) await shot(v, o);
  await icon('v2_icon_x16.png');
  return 'done';
}
</script></body></html>
