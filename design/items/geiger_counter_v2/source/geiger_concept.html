<!doctype html><html><head><meta charset="utf-8"><title>Geiger Counter V2 Concept</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>body{margin:0;background:#202224;color:#ddd;font:13px Segoe UI,sans-serif}canvas{display:block;max-width:100%}</style>
</head><body>
<script>
// Geiger counter V2 concept (design only, not a game asset). Two directions, same game readings:
//   A  analog survey meter: cast case with a carry handle, meter on the sloped front-top panel, six-position range
//      switch (OFF / BAT / x100 / x10 / x1 / x0.1), pancake probe clipped to the right side on a coiled cable;
//      structure after the real Ludlum Model 3 class of survey meters (about 22 x 9 x 16.5 cm with handle).
//   B  digital pocket monitor: moulded shell with rubber end caps, 4-digit LCD (rate, total, bar graph), three
//      buttons, pancake window on the back; after the real Inspector class (150 x 80 x 30 mm).
// Brand and model names are placeholders of the Columbian Federation, no real marks.
// Units: metres. Device frames: A x right, y up, z forward (front panel at +z); B x right, y up (long side), z front.
const W = 1600, H = 900, PI = Math.PI;
const r = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
r.setPixelRatio(1); r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.82;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 50);

// ---------------------------------------------------------------- environment (soft studio) for the metal parts
function studioEnv() {
  const es = new THREE.Scene();
  const g = new THREE.SphereGeometry(10, 32, 16), col = [];
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 10, t = Math.max(0, y);
    const c = new THREE.Color().setRGB(0.20 + 0.34 * t, 0.21 + 0.34 * t, 0.23 + 0.36 * t);
    if (y < 0) c.setRGB(0.16 + 0.1 * (1 + y), 0.15 + 0.1 * (1 + y), 0.14 + 0.1 * (1 + y));
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  es.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors: true, side: THREE.BackSide})));
  const box = (x, y, z, w, h, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: new THREE.Color(k, k, k), side: THREE.DoubleSide})); m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m); };
  box(-4, 5, 3, 5, 3, 4); box(5, 3, -2, 3, 4, 2.2); box(0, 6, -5, 6, 2, 2.5);
  const pm = new THREE.PMREMGenerator(r);
  return pm.fromScene(es, 0.02).texture;
}
scene.environment = studioEnv();
scene.add(new THREE.HemisphereLight(0xdfe6ee, 0x403a34, 0.2));
const sun = new THREE.DirectionalLight(0xfff2e0, 1.6); sun.position.set(-0.6, 1.2, 0.8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -0.4, right: 0.4, top: 0.4, bottom: -0.4, near: 0.1, far: 4}); sun.shadow.bias = -0.0004; sun.shadow.radius = 4;
scene.add(sun); scene.add(sun.target);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.ShadowMaterial({opacity: 0.28}));
floor.rotation.x = -PI / 2; floor.receiveShadow = true; scene.add(floor);

// ---------------------------------------------------------------- materials
const std = (c, rough, metal = 0, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({color: c, roughness: rough, metalness: metal}, extra));
const M = {
  paint: std(0x9a7420, 0.45, 0.05),        // civil-defence mustard enamel over cast aluminium
  paintDark: std(0x5e4a18, 0.6, 0.05),
  panel: std(0x1b1d20, 0.55, 0.15),       // black anodised front panel
  alu: std(0xb9bdc1, 0.32, 0.9),
  chrome: std(0xdcdfe2, 0.14, 1.0),
  steel: std(0x8d9196, 0.4, 0.85),
  rubber: std(0x141516, 0.92),
  knob: std(0x0f1011, 0.42, 0.05),
  glass: new THREE.MeshPhysicalMaterial({color: 0xffffff, roughness: 0.05, transmission: 0, transparent: true, opacity: 0.16, metalness: 0, clearcoat: 1}),
  shellB: std(0x2a2d31, 0.55, 0.0),
  capB: std(0xb98516, 0.8, 0.0),
  brass: std(0xb08d57, 0.35, 0.9),
};
const cast = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };

// ---------------------------------------------------------------- geometry helpers
function roundShape(pts, rad) {
  const s = new THREE.Shape(), n = pts.length, A = [], B = [];
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i + n - 1) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
    const rr = Array.isArray(rad) ? rad[i] : rad;
    const u = (a, b) => { const dx = a[0] - b[0], dy = a[1] - b[1], l = Math.hypot(dx, dy); return [dx / l, dy / l]; };
    const ua = u(p0, p1), ub = u(p2, p1);
    A.push([p1[0] + ua[0] * rr, p1[1] + ua[1] * rr]); B.push([p1[0] + ub[0] * rr, p1[1] + ub[1] * rr]);
  }
  s.moveTo(...A[0]); s.quadraticCurveTo(...pts[0], ...B[0]);
  for (let i = 1; i < n; i++) { s.lineTo(...A[i]); s.quadraticCurveTo(...pts[i], ...B[i]); }
  s.closePath(); return s;
}
const rrect = (w, h, rad) => roundShape([[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]], rad);
/** shape in XY extruded along +Z by depth d, bevel b all round, centred on z. */
function slab(shape, d, b, mat, seg = 4) {
  const g = new THREE.ExtrudeGeometry(shape, {depth: Math.max(1e-4, d - 2 * b), bevelEnabled: b > 0, bevelThickness: b, bevelSize: b, bevelSegments: seg, curveSegments: 10});
  g.translate(0, 0, -(d - 2 * b) / 2); g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}
const rbox = (w, h, d, rad, b, mat) => slab(rrect(w - 2 * b, h - 2 * b, Math.max(0.0005, rad - b)), d, b, mat);
function cyl(r0, h, mat, seg = 40, r1 = r0) { return new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, h, seg), mat); }
function tube(points, rad, mat, seg = 64) {
  const c = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  return new THREE.Mesh(new THREE.TubeGeometry(c, seg, rad, 12, false), mat);
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
const decal = (w, h, tex, rough = 0.6) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({map: tex, roughness: rough, transparent: true}));

// ---------------------------------------------------------------- shared print: meter dial and LCD
const ARC = 50 * PI / 180;   // meter sweep +-50 deg
function drawDial(g, w, h) {
  g.fillStyle = '#ece6d6'; g.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h * 0.92, R = h * 0.70;
  g.strokeStyle = '#1b1b1b'; g.fillStyle = '#1b1b1b'; g.lineCap = 'butt';
  g.lineWidth = 5; g.beginPath(); g.arc(cx, cy, R, -PI / 2 - ARC, -PI / 2 + ARC); g.stroke();
  for (let i = 0; i <= 20; i++) {
    const a = -PI / 2 - ARC + 2 * ARC * i / 20, major = i % 5 === 0, L = major ? R * 0.16 : i % 1 === 0 ? R * 0.08 : 0;
    g.lineWidth = major ? 5 : 3; g.beginPath();
    g.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); g.lineTo(cx + Math.cos(a) * (R + L), cy + Math.sin(a) * (R + L)); g.stroke();
    if (major) { g.font = 'bold ' + Math.round(h * 0.085) + 'px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(['0', '.5', '1', '1.5', '2'][i / 5], cx + Math.cos(a) * (R + R * 0.3), cy + Math.sin(a) * (R + R * 0.3)); }
  }
  g.font = Math.round(h * 0.07) + 'px Arial'; g.textAlign = 'center'; g.fillText('RU/h', cx, cy - R * 0.42);
  g.font = Math.round(h * 0.045) + 'px Arial'; g.fillText('NORTHFIELD  CD-310', cx, cy - R * 0.22);
}
function seg7(g, ch, x, y, s, on, off) {
  const map = {'0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc', '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abfgcd', 'O': 'abcdef', 'L': 'fed', '-': 'g', ' ': ''};
  const segs = {a: [0, 0, 1, 0], b: [1, 0, 1, 1], c: [1, 1, 1, 2], d: [0, 2, 1, 2], e: [0, 1, 0, 2], f: [0, 0, 0, 1], g: [0, 1, 1, 1]};
  const lit = map[ch] || '';
  for (const k in segs) {
    const [x0, y0, x1, y1] = segs[k], sk = 0.12;
    g.strokeStyle = lit.includes(k) ? on : off; g.lineWidth = s * 0.17; g.lineCap = 'round'; g.beginPath();
    g.moveTo(x + (x0 * 0.62 - y0 * sk) * s + s * 0.05, y + y0 * 0.5 * s); g.lineTo(x + (x1 * 0.62 - y1 * sk) * s + s * 0.05, y + y1 * 0.5 * s); g.stroke();
  }
}
function lcdText(g, text, x, y, s, on, off) {   // 4 digit cells, '.' rides on the previous cell
  let cell = 0; const cells = [];
  for (const ch of text) { if (ch === '.') { if (cells.length) cells[cells.length - 1].dp = true; } else cells.push({ch, dp: false}); }
  while (cells.length < 4) cells.unshift({ch: ' ', dp: false});
  for (const c of cells) {
    seg7(g, c.ch, x + cell * s * 0.86, y, s, on, off);
    g.fillStyle = c.dp ? on : off; g.beginPath(); g.arc(x + cell * s * 0.86 + s * 0.7, y + s * 1.0, s * 0.07, 0, 2 * PI); g.fill();
    cell++;
  }
}
function fmtRate(v) { if (v >= 200) return 'OL'; if (v < 10) return v.toFixed(2); if (v < 100) return v.toFixed(1); return v.toFixed(0); }
function drawLcd(g, w, h, st = {v: 0.42, total: 3.21}) {
  g.fillStyle = '#a9b39c'; g.fillRect(0, 0, w, h);
  const on = '#1f241c', off = 'rgba(31,36,28,0.07)';
  lcdText(g, fmtRate(st.v), w * 0.06, h * 0.16, h * 0.5, on, off);
  g.fillStyle = on; g.font = 'bold ' + Math.round(h * 0.13) + 'px Arial'; g.textAlign = 'left';
  g.fillText('RU/h', w * 0.78, h * 0.62); g.fillText('RATE', w * 0.78, h * 0.3);
  // bar graph, log 0.01 .. 200
  const n = 24, f = Math.max(0, Math.min(1, Math.log10(Math.max(st.v, 0.01) / 0.01) / Math.log10(200 / 0.01)));
  for (let i = 0; i < n; i++) { g.fillStyle = i < Math.round(f * n) ? on : off; g.fillRect(w * 0.06 + i * (w * 0.88 / n), h * 0.82, w * 0.88 / n - 2, h * 0.08); }
}

// ---------------------------------------------------------------- direction A: analog survey meter
const A = new THREE.Group(); A.name = 'A';
const AL = 0.216, AW = 0.089, AH = 0.095;   // case length, width, height (handle adds 0.066)
const S0 = [0.035, AH], S1 = [AL / 2, 0.055]; // sloped meter panel (z, y)
let needleA;
{
  // case: side profile (z, y) extruded across x, rounded corners, bevelled side edges
  // the extrude bevel grows the outline by b, so the profile is inset by b (the slope line moved along its normal)
  const b = 0.004, sz = S1[0] - S0[0], sy = S0[1] - S1[1], sL = Math.hypot(sz, sy), nz = sy / sL, ny = sz / sL;
  const yAt = z => S0[1] - b * (ny + nz * sy / sz) - (z - S0[0]) * sy / sz;   // inset slope line: y at z
  const zTop = S0[0] + (yAt(S0[0]) - (AH - b)) * sz / sy, yFront = yAt(AL / 2 - b);
  const prof = roundShape([[-AL / 2 + b, b], [AL / 2 - b, b], [AL / 2 - b, yFront], [zTop, AH - b], [-AL / 2 + b, AH - b]], [0.005, 0.005, 0.004, 0.008, 0.005]);
  const body = slab(prof, AW, b, M.paint); body.rotation.y = -PI / 2; A.add(body);
  // seam where the cover meets the base (base is the lower 0.035)
  const seam = rbox(AW + 0.0006, 0.0012, AL + 0.0006, 0.004, 0, M.paintDark); seam.position.y = 0.035; A.add(seam);
  // sloped panel: black bezel plate, recessed dial, glass, needle
  const sl = Math.hypot(S1[0] - S0[0], S1[1] - S0[1]);
  const pan = new THREE.Group(); pan.position.set(0, (S0[1] + S1[1]) / 2, (S0[0] + S1[0]) / 2);
  pan.rotation.x = -(PI / 2 - Math.atan2(S0[1] - S1[1], S1[0] - S0[0])); A.add(pan);
  const bez = rbox(0.074, sl - 0.012, 0.004, 0.006, 0.0012, M.panel); bez.position.z = 0.0012; pan.add(bez);
  const face = decal(0.060, 0.046, canvasTex(640, 490, drawDial), 0.7); face.position.z = 0.0034; pan.add(face);
  const piv = new THREE.Group(); piv.position.set(0, -0.046 / 2 + 0.046 * 0.08, 0.0040); pan.add(piv);
  const nd = new THREE.Mesh(new THREE.BoxGeometry(0.0007, 0.034, 0.0004), std(0x111111, 0.5)); nd.position.y = 0.017; piv.add(nd);
  const hub = cyl(0.0022, 0.0012, M.knob); hub.rotation.x = PI / 2; piv.add(hub);
  needleA = piv;
  const gl = rbox(0.062, 0.048, 0.0012, 0.003, 0, M.glass); gl.position.z = 0.0056; pan.add(gl);
  // zero adjust screw under the dial
  const zs = cyl(0.0025, 0.002, M.steel); zs.rotation.x = PI / 2; zs.position.set(0, -0.031, 0.0035); pan.add(zs);

  // front panel (vertical, z = +AL/2): range knob, audio and response toggles, reset button, printed legends
  const fp = new THREE.Group(); fp.position.set(0, 0.03, AL / 2); A.add(fp);
  const plate = rbox(0.078, 0.046, 0.002, 0.004, 0.0006, M.panel); plate.position.z = 0.001; fp.add(plate);
  const legend = decal(0.078, 0.046, canvasTex(780, 460, (g, w, h) => {
    g.clearRect(0, 0, w, h); g.fillStyle = '#e8e4d8'; g.font = 'bold 26px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
    const kx = w * 0.30, ky = h * 0.50, R = h * 0.40;
    ['OFF', 'BAT', '×100', '×10', '×1', '×0.1'].forEach((t, i) => { const a = PI * (0.95 + i * 0.22); g.fillText(t, kx + Math.cos(a) * R * 1.0, ky + Math.sin(a) * R * 0.95 + (i > 2 ? 0 : 0)); });
    g.fillText('AUD', w * 0.66, h * 0.13); g.fillText('F  S', w * 0.86, h * 0.13); g.fillText('RES', w * 0.76, h * 0.88);
    g.font = '20px Arial'; g.fillText('ON', w * 0.66, h * 0.62); g.fillText('OFF', w * 0.66, h * 0.72);
  }), 0.6); legend.position.z = 0.0021; fp.add(legend);
  const knob = new THREE.Group(); knob.position.set(-0.016, 0, 0.002); fp.add(knob);
  const kb = cyl(0.0105, 0.010, M.knob, 32); kb.rotation.x = PI / 2; kb.position.z = 0.005; knob.add(kb);
  const kp = new THREE.Mesh(new THREE.BoxGeometry(0.004, 0.016, 0.008), M.knob); kp.position.z = 0.012; knob.add(kp);
  const kl = new THREE.Mesh(new THREE.BoxGeometry(0.0009, 0.007, 0.0005), std(0xe8e4d8, 0.6)); kl.position.set(0, 0.004, 0.0162); knob.add(kl);
  knob.rotation.z = -0.25;  // pointing at x1
  for (const [x, y] of [[0.012, 0.009], [0.028, 0.009]]) {
    const nut = cyl(0.0035, 0.002, M.chrome, 6); nut.rotation.x = PI / 2; nut.position.set(x, y - 0.006, 0.003); fp.add(nut);
    const bat = cyl(0.0011, 0.011, M.chrome, 12, 0.0016); bat.position.set(x, y - 0.006, 0.008); bat.rotation.x = PI / 2 - 0.45; fp.add(bat);
  }
  const res = cyl(0.0042, 0.004, std(0x7a1d18, 0.45), 24); res.rotation.x = PI / 2; res.position.set(0.020, -0.016, 0.003); fp.add(res);

  // carry handle: two cast posts and a round grip with a rubber sleeve
  for (const z of [-0.085, 0.018]) { const p = rbox(0.016, 0.06, 0.016, 0.005, 0.002, M.paint); p.position.set(0, AH + 0.026, z); A.add(p); }
  const grip = cyl(0.0105, 0.12, M.rubber, 32); grip.rotation.x = PI / 2; grip.position.set(0, AH + 0.054, -0.034); A.add(grip);
  for (const z of [-0.085, 0.018]) { const c = cyl(0.0118, 0.012, M.paint, 32); c.rotation.x = PI / 2; c.position.set(0, AH + 0.054, z); A.add(c); }

  // rear: battery end cap (two D cells inside) with knurled thumbscrews
  const cap = rbox(AW - 0.006, AH - 0.012, 0.006, 0.006, 0.0015, M.paintDark); cap.position.set(0, AH / 2, -AL / 2 - 0.001); A.add(cap);
  for (const x of [-0.026, 0.026]) { const t = cyl(0.0055, 0.007, M.alu, 24); t.rotation.x = PI / 2; t.position.set(x, AH / 2, -AL / 2 - 0.007); A.add(t); }
  // left: speaker grille; right: probe connector and the clipped pancake probe
  const spk = decal(0.034, 0.034, canvasTex(256, 256, (g, w, h) => { g.clearRect(0, 0, w, h); g.fillStyle = '#121314';
    for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) if (i * i + j * j <= 10) { g.beginPath(); g.arc(w / 2 + i * 32, h / 2 + j * 32, 9, 0, 2 * PI); g.fill(); } }), 0.8);
  spk.rotation.y = -PI / 2; spk.position.set(-AW / 2 - 0.0003, 0.05, 0.03); A.add(spk);
  const con = cyl(0.0068, 0.012, M.chrome, 24); con.rotation.z = PI / 2; con.position.set(AW / 2 + 0.005, 0.022, 0.082); A.add(con);
  const probe = new THREE.Group(); probe.position.set(AW / 2 + 0.022, 0.05, -0.012); A.add(probe);
  const head = cyl(0.033, 0.013, std(0x3a3d41, 0.45, 0.6), 48); head.rotation.z = PI / 2; head.position.z = -0.045; probe.add(head);
  const scr = decal(0.058, 0.058, canvasTex(256, 256, (g, w, h) => { g.clearRect(0, 0, w, h); g.fillStyle = '#2a2c2e'; g.beginPath(); g.arc(w / 2, h / 2, w * 0.48, 0, 2 * PI); g.fill();
    g.fillStyle = '#9a9ea3'; for (let i = -8; i <= 8; i++) for (let j = -8; j <= 8; j++) { const x = w / 2 + i * 14 + (j % 2) * 7, y = h / 2 + j * 12; if (Math.hypot(x - w / 2, y - h / 2) < w * 0.44) { g.beginPath(); g.arc(x, y, 4.2, 0, 2 * PI); g.fill(); } } }), 0.5);
  scr.rotation.y = PI / 2; scr.position.set(0.0068, 0, -0.045); probe.add(scr);
  const neck = cyl(0.012, 0.03, M.alu, 32, 0.016); neck.rotation.x = PI / 2; neck.position.z = -0.008; probe.add(neck);
  const hnd = cyl(0.0135, 0.075, M.rubber, 32); hnd.rotation.x = PI / 2; hnd.position.z = 0.045; probe.add(hnd);
  const gland = cyl(0.007, 0.012, M.alu, 24, 0.009); gland.rotation.x = PI / 2; gland.position.z = 0.088; probe.add(gland);
  for (const z of [-0.012, 0.045]) { const clip = rbox(0.003, 0.034, 0.012, 0.0015, 0, M.steel); clip.position.set(AW / 2 + 0.003, 0.05, z); A.add(clip); }
  // coiled cable from the probe tail to the connector (a few loose turns below the front)
  const pts = []; const g0 = [AW / 2 + 0.022, 0.05, 0.088];
  for (let i = 0; i <= 80; i++) { const t = i / 80, ang = t * 2 * PI * 14, rad = 0.0055;
    const cx = g0[0] + 0.004 * t, cy = g0[1] - 0.045 * Math.sin(t * PI) - 0.028 * t, cz = g0[2] + 0.03 * Math.sin(t * PI);
    pts.push([cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad * 0.6, cz + Math.sin(ang) * rad * 0.8]); }
  pts.push([AW / 2 + 0.012, 0.022, 0.082]);
  A.add(tube(pts, 0.0017, M.rubber, 900));
  // feet
  for (const x of [-0.03, 0.03]) for (const z of [-0.085, 0.085]) { const f = cyl(0.007, 0.004, M.rubber, 20); f.position.set(x, 0.0, z); A.add(f); }
  // nameplate on the left side
  const np = decal(0.07, 0.016, canvasTex(700, 160, (g, w, h) => { g.fillStyle = '#c8c6be'; g.fillRect(0, 0, w, h); g.fillStyle = '#26282a';
    g.font = 'bold 44px Arial'; g.textAlign = 'center'; g.fillText('NORTHFIELD  CD-310', w / 2, 62); g.font = '30px Arial'; g.fillText('RADIATION SURVEY METER', w / 2, 118); }), 0.4);
  np.rotation.y = -PI / 2; np.position.set(-AW / 2 - 0.0003, 0.05, -0.05); A.add(np);
  A.position.y = 0.002;
}
cast(A);

// ---------------------------------------------------------------- direction B: digital pocket monitor
const B = new THREE.Group(); B.name = 'B';
let lcdB, lcdTexB;
{
  const BW = 0.080, BL = 0.150, BT = 0.030;
  const shell = rbox(BW, BL - 0.03, BT, 0.012, 0.007, M.shellB); B.add(shell);
  for (const s of [-1, 1]) { const c = rbox(BW + 0.003, 0.036, BT + 0.003, 0.014, 0.008, M.capB); c.position.y = s * (BL / 2 - 0.018); B.add(c); }
  // front: LCD window, label bezel, three buttons, count LED
  const bz = rbox(0.066, 0.048, 0.002, 0.005, 0.0008, std(0x15171a, 0.4)); bz.position.set(0, 0.022, BT / 2); B.add(bz);

// ---------------------------------------------------------------- render one view into an offscreen canvas
function shot(w, h, eye, at, fov = 30, opts = {}) {

// ---------------------------------------------------------------- HUD drawing (GUI pixels x s)
const HUDC = {frame0: '#5A5E64', frame1: '#2A2C2F', edge: '#1A1B1D', stroke: 'rgba(232,228,220,0.28)', text: '#F0ECE4', base: 'rgba(14,15,17,0.62)', amber: '#E2A24A'};
function rr(g, x, y, w, h, rad) { g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + w, y, x + w, y + h, rad); g.arcTo(x + w, y + h, x, y + h, rad); g.arcTo(x, y + h, x, y, rad); g.arcTo(x, y, x + w, y, rad); g.closePath(); }
function frame(g, x, y, w, h, s) {

  rr(g, x, y, w, h, 4 * s); const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, HUDC.frame0); gr.addColorStop(1, HUDC.frame1); g.fillStyle = gr; g.fill();
  g.strokeStyle = HUDC.edge; g.lineWidth = 0.4 * s; g.stroke();
  rr(g, x + 1.32 * s, y + 1.32 * s, w - 2.64 * s, h - 2.64 * s, 2.8 * s); g.fillStyle = 'rgba(12,13,15,0.92)'; g.fill();
}
function txt(g, t, x, y, px, col = HUDC.text, align = 'center', bold = false) { g.font = (bold ? 'bold ' : '') + px + 'px Consolas, monospace'; g.fillStyle = col; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(t, x, y); }
function battIcon(g, x, y, s, frac, col) { g.strokeStyle = col; g.lineWidth = 0.5 * s; g.strokeRect(x, y, 6 * s, 3 * s); g.fillStyle = col; g.fillRect(x + 6 * s, y + 0.8 * s, 0.7 * s, 1.4 * s); g.fillRect(x + 0.6 * s, y + 0.6 * s, 4.8 * s * frac, 1.8 * s); }
/** A: analog face, 64 x 40 GUI px. st = {mult, v, batt, t} */
function hudA(g, x, y, s, st) {
  const w = 64 * s, h = 40 * s; frame(g, x, y, w, h, s);
  const cx = x + 30 * s, cy = y + 34 * s, R = 23 * s;
  g.strokeStyle = HUDC.text; g.lineWidth = 0.7 * s; g.beginPath(); g.arc(cx, cy, R, -PI / 2 - ARC, -PI / 2 + ARC); g.stroke();
  for (let i = 0; i <= 20; i++) { const a = -PI / 2 - ARC + 2 * ARC * i / 20, L = i % 5 === 0 ? 3 * s : 1.6 * s; g.lineWidth = (i % 5 === 0 ? 0.6 : 0.4) * s;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); g.lineTo(cx + Math.cos(a) * (R + L), cy + Math.sin(a) * (R + L)); g.stroke();
    if (i % 5 === 0) txt(g, ['0', '.5', '1', '1.5', '2'][i / 5], cx + Math.cos(a) * (R + 6.2 * s), cy + Math.sin(a) * (R + 6.2 * s), 3.6 * s); }
  txt(g, 'RU/h', cx, cy - 9 * s, 3.4 * s, 'rgba(240,236,228,0.7)');
  const over = st.v > 2 * st.mult * 1.0, f = Math.min(1.03, st.v / (2 * st.mult)), a = -PI / 2 - ARC + 2 * ARC * Math.max(0, f);
  g.strokeStyle = over ? HUDC.amber : '#E8E4DC'; g.lineWidth = 0.75 * s; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * (R + 1.5 * s), cy + Math.sin(a) * (R + 1.5 * s)); g.stroke();
  g.fillStyle = '#3a3d42'; g.beginPath(); g.arc(cx, cy, 2.2 * s, 0, 2 * PI); g.fill();
  // range badge (right column)
  const bx = x + 54 * s, by = y + 32 * s;
  rr(g, bx - 7 * s, by - 4.5 * s, 14 * s, 9 * s, 2 * s); g.fillStyle = over ? 'rgba(226,162,74,0.25)' : 'rgba(240,236,228,0.08)'; g.fill();
  g.strokeStyle = over ? HUDC.amber : HUDC.stroke; g.lineWidth = 0.4 * s; g.stroke();
  txt(g, '×' + st.mult, bx, by + 0.2 * s, 4.6 * s, over ? HUDC.amber : HUDC.text, 'center', true);
  if (st.batt < 0.2) battIcon(g, x + 4 * s, y + 31 * s, s, st.batt, HUDC.amber);
}
/** B: LCD close-up, 70 x 30 GUI px. st = {v, total, batt, alert} */
function hudB(g, x, y, s, st) {
  const w = 70 * s, h = 30 * s; frame(g, x, y, w, h, s);
  const lx = x + 3 * s, ly = y + 3 * s, lw = w - 6 * s, lh = h - 6 * s;

  const on = '#1d2219', off = 'rgba(29,34,25,0.08)', ol = st.v >= 200;
  lcdText(g, fmtRate(st.v), lx + 3 * s, ly + 2.4 * s, 11 * s, on, off);
  txt(g, 'RU/h', lx + lw - 2.5 * s, ly + 9.5 * s, 3.4 * s, on, 'right', true);
  txt(g, 'RATE', lx + lw - 2.5 * s, ly + 4 * s, 2.8 * s, on, 'right');
  const n = 18, fr = Math.max(0, Math.min(1, Math.log10(Math.max(st.v, 0.01) / 0.01) / Math.log10(200 / 0.01)));
