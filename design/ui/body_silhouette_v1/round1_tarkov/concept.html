<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1010" height="1080"></canvas>
<script>
// Inventory body silhouette concept (user 2026-10-20): the player model in the gear column becomes a flat body outline split
// into parts; an injured part is tinted and carries its badge; pointing at it shows what is wrong and what to use, the best
// item first and, when it is not carried, the next best. Drawn over the inventory concept r2 (cropped to the left half).
const FONT = '"Microsoft YaHei UI","Microsoft YaHei",sans-serif';
const TEXT = '#E8E4DC', DIM = '#A8A49C', DISABLED = '#6C6A66', ACCENT = '#E0A84A', DANGER_TEXT = '#E8867C', OK = '#9CC79A';
const KIND = {DANGER: 0xB8443C, BAD: 0xA86A3A, COLD: 0x4F7FB8, GOOD: 0x5FA67E};
const rgba = (rgb, a) => `rgba(${rgb >> 16 & 255},${rgb >> 8 & 255},${rgb & 255},${a})`;

// ---- glyphs (StatusBadgeHud) ----
const seg = (px, py, ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy))); return Math.hypot(px - ax - t * dx, py - ay - t * dy); };
const taper = (x, y, ax, ay, bx, by, w0, w1) => { const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy))); return Math.hypot(x - ax - dx * t, y - ay - dy * t) - (w0 + (w1 - w0) * (1 - Math.abs(2 * t - 1))); };
const CLAW = (x, y) => Math.min(taper(x, y, 0.42, 0.16, 0.18, 0.80, 0.02, 0.065), taper(x, y, 0.62, 0.10, 0.38, 0.88, 0.02, 0.07), taper(x, y, 0.82, 0.18, 0.58, 0.80, 0.02, 0.065));
/** A bone along the diagonal with a crack across its middle (fracture, new). */
const BONE = (x, y) => {
  const ax = 0.27, ay = 0.73, bx = 0.73, by = 0.27, px = 0.0707 * 1.15, py = 0.0707 * 1.15;
  let d = seg(x, y, ax, ay, bx, by) - 0.075;
  for (const [cx, cy, sx, sy] of [[ax, ay, -1, 1], [bx, by, 1, -1]])
    for (const s of [-1, 1]) d = Math.min(d, Math.hypot(x - (cx + sx * 0.035 + s * px), y - (cy + sy * 0.035 + s * py)) - 0.095);
  const crack = Math.min(seg(x, y, 0.40, 0.42, 0.50, 0.50), seg(x, y, 0.50, 0.50, 0.47, 0.55), seg(x, y, 0.47, 0.55, 0.60, 0.60)) - 0.03;
  return Math.max(d, -crack);
};

const c = document.getElementById('c'), g = c.getContext('2d');
const img = new Image();
img.onload = () => { g.drawImage(img, 0, 0); clearDoll(); draw(); document.title = 'done'; };
img.src = 'inventory_base.png';

/** Paints the player model out: each row blends the panel seen just inside the two slot columns. */
function clearDoll() {
  const x0 = 176, x1 = 464, y0 = 100, y1 = 690;
  const L = g.getImageData(x0 - 3, y0, 3, y1 - y0).data, R = g.getImageData(x1, y0, 3, y1 - y0).data;
  const out = g.createImageData(x1 - x0, y1 - y0);
  for (let y = 0; y < y1 - y0; y++) {
    const l = [0, 0, 0], r = [0, 0, 0];
    for (let i = 0; i < 3; i++) for (let k = 0; k < 3; k++) { l[k] += L[(y * 3 + i) * 4 + k] / 3; r[k] += R[(y * 3 + i) * 4 + k] / 3; }
    for (let x = 0; x < x1 - x0; x++) {
      const t = x / (x1 - x0 - 1), o = (y * (x1 - x0) + x) * 4;
      for (let k = 0; k < 3; k++) out.data[o + k] = l[k] + (r[k] - l[k]) * t;
      out.data[o + 3] = 255;
    }
  }
  g.putImageData(out, x0, y0);
}

// ---- the silhouette: 100 x 200 units, seen from behind (screen left = the body's left) ----
const SX = 180, SY = 112, U = 2.8;
const P = {
  head: 'M50,2.5 C57,2.5 61,8 61,15 C61,22 57,28 50,28 C43,28 39,22 39,15 C39,8 43,2.5 50,2.5 Z',
  chest: 'M37,31 Q50,28.5 63,31 L70.5,36 Q72,53 68,70 L32,70 Q28,53 29.5,36 Z',
  belly: 'M32.5,72.5 L67.5,72.5 Q69,86 66,98 Q58,104 50,104 Q42,104 34,98 Q31,86 32.5,72.5 Z',
  armL: 'M27.5,36 Q22,38 21,47 L18.5,70 Q16,86 13.5,99 Q12,107 16.5,108 Q20.5,108 20.5,101 L24,82 Q26.5,72 27,60 L30,44 Z',
  armR: 'M72.5,36 Q78,38 79,47 L81.5,70 Q84,86 86.5,99 Q88,107 83.5,108 Q79.5,108 79.5,101 L76,82 Q73.5,72 73,60 L70,44 Z',
  legL: 'M34,106.5 Q42,107.5 48.5,106.5 L48,140 Q47,165 46,186 Q46,193 40.5,193.5 Q34.5,193.5 36,186 L35,150 Q33,128 34,106.5 Z',
  legR: 'M66,106.5 Q58,107.5 51.5,106.5 L52,140 Q53,165 54,186 Q54,193 59.5,193.5 Q65.5,193.5 64,186 L65,150 Q67,128 66,106.5 Z',
};
function part(name) { const p = new Path2D(); p.addPath(new Path2D(P[name]), new DOMMatrix([U, 0, 0, U, SX, SY])); return p; }

function text(s, x, y, color, px, align, weight) {
  g.font = `${weight || ''} ${px}px ${FONT}`; g.fillStyle = color; g.textBaseline = 'top'; g.textAlign = align || 'left';
  g.fillText(s, x, y); return g.measureText(s).width;
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

/** A status badge (StatusBadgeHud#badge): shadow, disc, sheen, rim, the white pictogram. r in px. */
function badge(px, py, r, kind, glyph) {
  const R = r + 4, size = r * 1.18, x0 = Math.floor(px - R), y0 = Math.floor(py - R), n = Math.ceil(2 * R) + 1;
  const im = g.getImageData(x0, y0, n, n), d = im.data, cov = v => Math.max(0, Math.min(1, 0.5 - v));
  const over = (o, rgb, a) => { if (a <= 0) return; for (let k = 0; k < 3; k++) d[o + k] = d[o + k] * (1 - a) + (rgb >> (16 - 8 * k) & 255) * a; };
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x = x0 + i + 0.5 - px, y = y0 + j + 0.5 - py, dist = Math.hypot(x, y), o = (j * n + i) * 4;
    const ang = ((Math.atan2(x, -y) * 180 / Math.PI) + 360) % 360, k = r / 5.4;
    over(o, 0x000000, 0.3 * cov(dist - r - 0.7 * k * 3));
    over(o, KIND[kind], 0.95 * cov(dist - r));
    if (ang >= 300 || ang <= 60) over(o, 0xFFFFFF, 0.14 * cov(Math.abs(dist - r + 2) - 0.8));
    over(o, 0xE8E4DC, 0.4 * cov(Math.abs(dist - r - 0.6) - 0.8));
    const gx = (x + size / 2) / size, gy = (y + size / 2) / size;
    if (gx > -0.1 && gx < 1.1 && gy > -0.1 && gy < 1.1) over(o, 0xF6F2EA, cov(glyph(gx, gy) * size));
  }
  g.putImageData(im, x0, y0);
}

// ---- small item pictures for the advice rows (stand-ins for the game's 3D item icons) ----
function iconSplint(x, y) {
  g.save(); g.translate(x + 20, y + 20); g.rotate(-0.6);
  g.fillStyle = '#B8915E'; g.fillRect(-16, -7, 32, 5); g.fillRect(-16, 2, 32, 5);
  g.fillStyle = '#EDE6D6'; g.fillRect(-4, -9, 8, 18); g.fillStyle = 'rgba(0,0,0,0.15)'; g.fillRect(-4, -1, 8, 2);
  g.restore();
}
function iconStick(x, y) {
  g.save(); g.translate(x + 20, y + 20); g.rotate(-0.8);
  g.fillStyle = '#7A5634'; g.fillRect(-16, -2.5, 32, 5); g.fillStyle = '#5E4127'; g.fillRect(4, -2.5, 3, 5);
  g.restore();
}
function iconBandage(x, y) {
  g.beginPath(); g.ellipse(x + 20, y + 20, 13, 13, 0, 0, Math.PI * 2); g.fillStyle = '#EDE6D6'; g.fill();
  g.beginPath(); g.ellipse(x + 20, y + 20, 4, 4, 0, 0, Math.PI * 2); g.fillStyle = '#3a3a38'; g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = 1; for (const r of [7, 10]) { g.beginPath(); g.arc(x + 20, y + 20, r, 0, Math.PI * 2); g.stroke(); }
}
function slot(x, y, dim) {
  rr(x, y, 40, 40, 5); g.fillStyle = 'rgba(16,16,16,0.7)'; g.fill(); g.lineWidth = 1.2; g.strokeStyle = 'rgba(232,228,220,0.18)'; g.stroke();
  if (dim) { rr(x, y, 40, 40, 5); g.fillStyle = 'rgba(10,10,10,0.55)'; }
}

function draw() {
  // parts: healthy ones a faint light fill, injured ones tinted by how bad
  const look = {
    head: [0xE8E4DC, 0.14], chest: [0xE8E4DC, 0.14], belly: [0xE8E4DC, 0.14],
    armL: [0xE8E4DC, 0.14], armR: [0xE0A84A, 0.32], legL: [0xB8443C, 0.55], legR: [0xE8E4DC, 0.14],
  };
  for (const name of Object.keys(P)) {
    const p = part(name), [rgb, a] = look[name];
    g.fillStyle = rgba(0x101010, 0.35); g.fill(p);
    g.fillStyle = rgba(rgb, a); g.fill(p);
    g.lineWidth = name === 'legL' ? 2.4 : 1.3; g.strokeStyle = name === 'legL' ? 'rgba(240,236,228,0.85)' : 'rgba(232,228,220,0.32)'; g.stroke(p);
  }
  // badges on the injured parts: a cleaned and bandaged scratch on the right forearm, an unsplinted fracture in the left shin
  badge(SX + 80 * U, SY + 82 * U, 14, 'BAD', CLAW);
  badge(SX + 41.5 * U, SY + 160 * U, 15, 'BAD', BONE);

  // bottom of the column: health stays one number (no per-part health)
  text('生命', 64, 667, DIM, 20);
  rr(116, 676, 150, 8, 4); g.fillStyle = 'rgba(232,228,220,0.14)'; g.fill();
  rr(116, 676, 150 * 0.72, 8, 4); g.fillStyle = '#CC4A42'; g.fill();
  text('72 / 100', 278, 667, TEXT, 20);

  if (location.search.includes('nohover')) return;
  // the hovered part's card (the inventory tooltip's style), beside the cursor
  const tx = 330, ty = 336, tw = 486, th = 314;
  rr(tx + 3, ty + 4, tw, th, 8); g.fillStyle = 'rgba(0,0,0,0.35)'; g.fill();
  rr(tx, ty, tw, th, 8); g.fillStyle = 'rgba(20,20,20,0.94)'; g.fill(); g.lineWidth = 1.4; g.strokeStyle = 'rgba(232,228,220,0.26)'; g.stroke();
  let y = ty + 16, x = tx + 18;
  text('左腿', x, y, TEXT, 26);
  y += 44;
  badge(x + 13, y + 13, 12, 'BAD', BONE);
  const nw = text('腿骨折', x + 34, y, TEXT, 22);
  text('未固定', x + 34 + nw + 10, y + 2, DIM, 19);
  text('移动速度降低，无法疾跑；不固定几乎不会愈合', x + 34, y + 30, DIM, 18);
  y += 66;
  g.fillStyle = 'rgba(232,228,220,0.16)'; g.fillRect(tx + 14, y, tw - 28, 1.4);
  y += 12;
  text('建议处理', x, y, DIM, 18);
  y += 32;
  // 1: the best, not carried
  slot(x, y, true); g.globalAlpha = 0.4; iconSplint(x, y); g.globalAlpha = 1;
  text('夹板', x + 54, y + 1, DISABLED, 21);
  text('最好：固定后几天内愈合', x + 54, y + 23, DISABLED, 16);
  text('背包里没有', tx + tw - 18, y + 10, DISABLED, 18, 'right');
  y += 54;
  // 2: the next best, carried
  rr(tx + 10, y - 6, tw - 20, 52, 6); g.fillStyle = 'rgba(30,33,36,0.95)'; g.fill(); g.lineWidth = 1.2; g.strokeStyle = 'rgba(224,168,74,0.45)'; g.stroke();
  slot(x, y); iconStick(x, y);
  slot(x + 44, y); iconBandage(x + 44, y);
  text('×2', x + 26, y + 24, TEXT, 14); text('×1', x + 70, y + 24, TEXT, 14);
  text('用木棍和绷带做夹板', x + 98, y + 1, TEXT, 21);
  text('次选：在背包合成格做好再用', x + 98, y + 23, DIM, 16);
  text('背包里有', tx + tw - 18, y + 10, ACCENT, 18, 'right');
  y += 60;
  text('都没有：先别走动，找个地方休息', x, y, DIM, 17);

  // the cursor on the left shin
  const cx = SX + 39 * U, cy = SY + 145 * U;
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx, cy + 30); g.lineTo(cx + 7, cy + 23); g.lineTo(cx + 12, cy + 34); g.lineTo(cx + 17, cy + 32);
  g.lineTo(cx + 12, cy + 21); g.lineTo(cx + 21, cy + 21); g.closePath();
  g.fillStyle = '#fff'; g.fill(); g.lineWidth = 2; g.strokeStyle = '#000'; g.stroke();
}
</script>
</body></html>
