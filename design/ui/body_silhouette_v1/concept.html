<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1010" height="1080"></canvas>
<script>
// Inventory body concept, round 2 (user 2026-10-20: "做minecraft的风格可能会好一点，你这做的真的是塔科夫了"): the player model
// in the gear column becomes the Minecraft body itself, seen from behind and flat: head 8x8, body 8x12 (chest / belly 6 + 6),
// arms and legs 4x12, one skin pixel = one block of the grid. Round 2b (user: "B可以，但是不要屁股对着屏幕"): seen from the
// front, like facing someone (screen left = the body's right), with 右 / 左 under the feet. ?v=a plain blocks, ?v=b the player's own skin (back faces,
// greyed); &hover adds the card for the left leg. Drawn over the inventory concept r2, cropped to the left half.
// The skin is vanilla Steve (from the game jar, outside the repo) standing in for the player's skin.
const SKIN = 'file:///C:/Users/willi/AppData/Local/Temp/claude/D--Minecraft-Modding-Apocalypse-First-Light/56b0fa7b-0684-4ff7-bcc9-64c738fbc531/scratchpad/skins/steve.png';
const Q = new URLSearchParams(location.search), VARIANT = Q.get('v') || 'b', HOVER = Q.has('hover');
const FONT = '"Microsoft YaHei UI","Microsoft YaHei",sans-serif';
const TEXT = '#E8E4DC', DIM = '#A8A49C', DISABLED = '#6C6A66', ACCENT = '#E0A84A';
const KIND = {DANGER: 0xB8443C, BAD: 0xA86A3A, COLD: 0x4F7FB8, GOOD: 0x5FA67E};
const rgba = (rgb, a) => `rgba(${rgb >> 16 & 255},${rgb >> 8 & 255},${rgb & 255},${a})`;

// ---- glyphs (StatusBadgeHud) ----
const seg = (px, py, ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy))); return Math.hypot(px - ax - t * dx, py - ay - t * dy); };
const taper = (x, y, ax, ay, bx, by, w0, w1) => { const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy))); return Math.hypot(x - ax - dx * t, y - ay - dy * t) - (w0 + (w1 - w0) * (1 - Math.abs(2 * t - 1))); };
const CLAW = (x, y) => Math.min(taper(x, y, 0.42, 0.16, 0.18, 0.80, 0.02, 0.065), taper(x, y, 0.62, 0.10, 0.38, 0.88, 0.02, 0.07), taper(x, y, 0.82, 0.18, 0.58, 0.80, 0.02, 0.065));
const BONE = (x, y) => {
  const ax = 0.27, ay = 0.73, bx = 0.73, by = 0.27, p = 0.081;
  let d = seg(x, y, ax, ay, bx, by) - 0.075;
  for (const [cx, cy, sx, sy] of [[ax, ay, -1, 1], [bx, by, 1, -1]])
    for (const s of [-1, 1]) d = Math.min(d, Math.hypot(x - (cx + sx * 0.035 + s * p), y - (cy + sy * 0.035 + s * p)) - 0.095);
  const crack = Math.min(seg(x, y, 0.40, 0.42, 0.50, 0.50), seg(x, y, 0.50, 0.50, 0.47, 0.55), seg(x, y, 0.47, 0.55, 0.60, 0.60)) - 0.03;
  return Math.max(d, -crack);
};

const c = document.getElementById('c'), g = c.getContext('2d');
const base = new Image(), skin = new Image();
let loaded = 0;
const go = () => { if (++loaded < 2) return; g.drawImage(base, 0, 0); clearDoll(); draw(); document.title = 'done'; };
base.onload = go; skin.onload = go;
base.src = 'inventory_base.png'; skin.src = SKIN;

function clearDoll() {
  const x0 = 176, x1 = 464, y0 = 100, y1 = 690;
  const L = g.getImageData(x0 - 3, y0, 3, y1 - y0).data, R = g.getImageData(x1, y0, 3, y1 - y0).data;
  const out = g.createImageData(x1 - x0, y1 - y0);
  for (let y = 0; y < y1 - y0; y++) {
    const l = [0, 0, 0], r = [0, 0, 0];
    for (let i = 0; i < 3; i++) for (let k = 0; k < 3; k++) { l[k] += L[(y * 3 + i) * 4 + k] / 3; r[k] += R[(y * 3 + i) * 4 + k] / 3; }
    for (let x = 0; x < x1 - x0; x++) {
      const t = x / (x1 - x0 - 1), o = (y * (x1 - x0) + x) * 4;
      for (let k = 0; k < 3; k++) out.data[o + k] = l[k] + (r[k] - l[k]) * t;
      out.data[o + 3] = 255;
    }
  }
  g.putImageData(out, x0, y0);
}

// ---- the body: skin pixels, seen from the front (screen left = the body's right) ----
const U = 16, X0 = 320 - 8 * U, Y0 = 118;
// part: [x, y, w, h] in skin pixels on screen; src: the front face in the 64x64 skin [u, v] (and the overlay layer's)
const PARTS = {
  head:  {r: [4, 0, 8, 8],  src: [8, 8],   over: [40, 8]},
  chest: {r: [4, 8, 8, 6],  src: [20, 20], over: [20, 36]},
  belly: {r: [4, 14, 8, 6], src: [20, 26], over: [20, 42]},
  armR:  {r: [0, 8, 4, 12], src: [44, 20], over: [44, 36]},
  armL:  {r: [12, 8, 4, 12], src: [36, 52], over: [52, 52]},
  legR:  {r: [4, 20, 4, 12], src: [4, 20],  over: [4, 36]},
  legL:  {r: [8, 20, 4, 12], src: [20, 52], over: [4, 52]},
};
// how each part looks: a tint over it (null: healthy)
const HURT = {armR: [0xE0A84A, 0.38], legL: [0xC04A3E, 0.62]};
const HOVERED = HOVER ? 'legL' : null;

/** Skin pixels of one part, greyed and darkened so the injuries read first. */
function skinPart(p) {
  const [x, y, w, h] = p.r, src = document.createElement('canvas');
  src.width = w; src.height = h;
  const s = src.getContext('2d');
  s.drawImage(skin, p.src[0], p.src[1], w, h, 0, 0, w, h);
  s.drawImage(skin, p.over[0], p.over[1], w, h, 0, 0, w, h);
  const im = s.getImageData(0, 0, w, h);
  for (let i = 0; i < im.data.length; i += 4) {
    const l = 0.3 * im.data[i] + 0.59 * im.data[i + 1] + 0.11 * im.data[i + 2];
    for (let k = 0; k < 3; k++) im.data[i + k] = 46 + l * 0.42 + (im.data[i + k] - l) * 0.08;
  }
  s.putImageData(im, 0, 0);
  g.imageSmoothingEnabled = false;
  g.drawImage(src, X0 + x * U, Y0 + y * U, w * U, h * U);
}
/** Plain blocks: a flat grey with a faint per-pixel tone, like an untextured skin. */
function plainPart(p) {
  const [x, y, w, h] = p.r;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const n = Math.sin((x + i) * 12.9898 + (y + j) * 78.233) * 43758.5453, v = 64 + ((n - Math.floor(n)) - 0.5) * 8;
    g.fillStyle = `rgb(${v},${v},${v + 2})`;
    g.fillRect(X0 + (x + i) * U, Y0 + (y + j) * U, U, U);
  }
}

function text(s, x, y, color, px, align) {
  g.font = `${px}px ${FONT}`; g.fillStyle = color; g.textBaseline = 'top'; g.textAlign = align || 'left';
  g.fillText(s, x, y); return g.measureText(s).width;
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

function badge(px, py, r, kind, glyph) {
  const R = r + 4, size = r * 1.18, x0 = Math.floor(px - R), y0 = Math.floor(py - R), n = Math.ceil(2 * R) + 1;
  const im = g.getImageData(x0, y0, n, n), d = im.data, cov = v => Math.max(0, Math.min(1, 0.5 - v));
  const over = (o, rgb, a) => { if (a <= 0) return; for (let k = 0; k < 3; k++) d[o + k] = d[o + k] * (1 - a) + (rgb >> (16 - 8 * k) & 255) * a; };
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x = x0 + i + 0.5 - px, y = y0 + j + 0.5 - py, dist = Math.hypot(x, y), o = (j * n + i) * 4;
    const ang = ((Math.atan2(x, -y) * 180 / Math.PI) + 360) % 360;
    over(o, 0x000000, 0.35 * cov(dist - r - 2));
    over(o, KIND[kind], 0.95 * cov(dist - r));
    if (ang >= 300 || ang <= 60) over(o, 0xFFFFFF, 0.14 * cov(Math.abs(dist - r + 2) - 0.8));
    over(o, 0xE8E4DC, 0.45 * cov(Math.abs(dist - r - 0.6) - 0.8));
    const gx = (x + size / 2) / size, gy = (y + size / 2) / size;
    if (gx > -0.1 && gx < 1.1 && gy > -0.1 && gy < 1.1) over(o, 0xF6F2EA, cov(glyph(gx, gy) * size));
  }
  g.putImageData(im, x0, y0);
}

function iconSplint(x, y) {
  g.save(); g.translate(x + 20, y + 20); g.rotate(-0.6);
  g.fillStyle = '#B8915E'; g.fillRect(-16, -7, 32, 5); g.fillRect(-16, 2, 32, 5);
  g.fillStyle = '#EDE6D6'; g.fillRect(-4, -9, 8, 18); g.restore();
}
function iconStick(x, y) {
  g.save(); g.translate(x + 20, y + 20); g.rotate(-0.8);
  g.fillStyle = '#7A5634'; g.fillRect(-16, -2.5, 32, 5); g.restore();
}
function iconBandage(x, y) {
  g.beginPath(); g.arc(x + 20, y + 20, 13, 0, Math.PI * 2); g.fillStyle = '#EDE6D6'; g.fill();
  g.beginPath(); g.arc(x + 20, y + 20, 4, 0, Math.PI * 2); g.fillStyle = '#3a3a38'; g.fill();
}
function slot(x, y) { rr(x, y, 40, 40, 5); g.fillStyle = 'rgba(16,16,16,0.7)'; g.fill(); g.lineWidth = 1.2; g.strokeStyle = 'rgba(232,228,220,0.18)'; g.stroke(); }

function draw() {
  // shadow under the whole body, then each part, its tint, a one-pixel dark seam between parts
  g.fillStyle = 'rgba(0,0,0,0.25)';
  for (const p of Object.values(PARTS)) g.fillRect(X0 + p.r[0] * U + 4, Y0 + p.r[1] * U + 5, p.r[2] * U, p.r[3] * U);
  for (const [name, p] of Object.entries(PARTS)) {
    (VARIANT === 'a' ? plainPart : skinPart)(p);
    const [x, y, w, h] = p.r;
    if (HURT[name]) { g.fillStyle = rgba(HURT[name][0], HURT[name][1]); g.fillRect(X0 + x * U, Y0 + y * U, w * U, h * U); }
  }
  for (const [name, p] of Object.entries(PARTS)) {
    const [x, y, w, h] = p.r;
    g.lineWidth = 2; g.strokeStyle = 'rgba(12,12,12,0.9)'; g.strokeRect(X0 + x * U + 1, Y0 + y * U + 1, w * U - 2, h * U - 2);
  }
  for (const [name, p] of Object.entries(PARTS)) {   // hovered: a light frame, drawn last so the seams do not cut it
    if (name !== HOVERED) continue;
    const [x, y, w, h] = p.r;
    g.lineWidth = 3; g.strokeStyle = 'rgba(240,236,228,0.95)'; g.strokeRect(X0 + x * U - 1.5, Y0 + y * U - 1.5, w * U + 3, h * U + 3);
  }
  // badges: a cleaned and bandaged scratch on the right forearm, an unsplinted fracture in the left shin
  badge(X0 + 2 * U, Y0 + 16.5 * U, 14, 'BAD', CLAW);
  badge(X0 + 10 * U, Y0 + 27 * U, 15, 'BAD', BONE);
  text('右', X0 + 6 * U, Y0 + 32 * U + 6, DISABLED, 17, 'center');
  text('左', X0 + 10 * U, Y0 + 32 * U + 6, DISABLED, 17, 'center');

  text('生命', 64, 667, DIM, 20);
  rr(116, 676, 150, 8, 4); g.fillStyle = 'rgba(232,228,220,0.14)'; g.fill();
  rr(116, 676, 108, 8, 4); g.fillStyle = '#CC4A42'; g.fill();
  text('72 / 100', 278, 667, TEXT, 20);

  if (!HOVER) return;
  const tx = 404, ty = 316, tw = 486, th = 314;
  rr(tx + 3, ty + 4, tw, th, 8); g.fillStyle = 'rgba(0,0,0,0.35)'; g.fill();
  rr(tx, ty, tw, th, 8); g.fillStyle = 'rgba(20,20,20,0.94)'; g.fill(); g.lineWidth = 1.4; g.strokeStyle = 'rgba(232,228,220,0.26)'; g.stroke();
  let y = ty + 16, x = tx + 18;
  text('左腿', x, y, TEXT, 26);
  y += 44;
  badge(x + 13, y + 13, 12, 'BAD', BONE);
  const nw = text('腿骨折', x + 34, y, TEXT, 22);
  text('未固定', x + 34 + nw + 10, y + 2, DIM, 19);
  text('移动速度降低，无法疾跑；不固定几乎不会愈合', x + 34, y + 30, DIM, 18);
  y += 66;
  g.fillStyle = 'rgba(232,228,220,0.16)'; g.fillRect(tx + 14, y, tw - 28, 1.4);
  y += 12;
  text('建议处理', x, y, DIM, 18);
  y += 32;
  slot(x, y); g.globalAlpha = 0.4; iconSplint(x, y); g.globalAlpha = 1;
  text('夹板', x + 54, y + 1, DISABLED, 21);
  text('最好：固定后几天内愈合', x + 54, y + 23, DISABLED, 16);
  text('背包里没有', tx + tw - 18, y + 10, DISABLED, 18, 'right');
  y += 54;
  rr(tx + 10, y - 6, tw - 20, 52, 6); g.fillStyle = 'rgba(30,33,36,0.95)'; g.fill(); g.lineWidth = 1.2; g.strokeStyle = 'rgba(224,168,74,0.45)'; g.stroke();
  slot(x, y); iconStick(x, y);
  slot(x + 44, y); iconBandage(x + 44, y);
  text('×2', x + 26, y + 24, TEXT, 14); text('×1', x + 70, y + 24, TEXT, 14);
  text('用木棍和绷带做夹板', x + 98, y + 1, TEXT, 21);
  text('次选：在背包合成格做好再用', x + 98, y + 23, DIM, 16);
  text('背包里有', tx + tw - 18, y + 10, ACCENT, 18, 'right');
  y += 60;
  text('都没有：先别走动，找个地方休息', x, y, DIM, 17);
  const cx = X0 + 9.5 * U, cy = Y0 + 24 * U;
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx, cy + 30); g.lineTo(cx + 7, cy + 23); g.lineTo(cx + 12, cy + 34); g.lineTo(cx + 17, cy + 32);
  g.lineTo(cx + 12, cy + 21); g.lineTo(cx + 21, cy + 21); g.closePath();
  g.fillStyle = '#fff'; g.fill(); g.lineWidth = 2; g.strokeStyle = '#000'; g.stroke();
}
</script>
</body></html>
