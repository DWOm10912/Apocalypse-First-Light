<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Vehicle Dashboard V1</title>
<style>
@font-face { font-family: 'AFL Sans'; src: url('/assets/font/afl_sans_sc.ttf'); }
body { margin: 0; background: #141516; color: #E8E4DC; font-family: 'AFL Sans', 'Microsoft YaHei', sans-serif; }
canvas { display: block; max-width: 100%; margin: 12px auto; }
</style>
</head>
<body>
<div id="out"></div>
<script>
// Vehicle dashboard HUD V1 concepts (design use only). Everything is drawn in GUI px at GUI scale 3 on a 1920 x 1080
// frame (640 x 360 GUI), in the overlay style of docs/ui/afl_overlay_ui_style_v1.md and the survival HUD.
const G = 3, W = 640, H = 360;
const FONT = '"AFL Sans", "Microsoft YaHei", sans-serif';
const COL = {
  back: '#101010', line: '#E8E4DC', text: '#E8E4DC', dim: '#A8A49C', dis: '#6C6A66', accent: '#E0A84A',
  green: '#7CC47A', blue: '#5C9BE8', amber: '#E0A84A', red: '#CC4A42', fuel: '#D8A94A', cold: '#6FA3E0',
};
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
const ang = d => (d - 90) * Math.PI / 180;

// ---------- shapes ----------
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function panel(c, x, y, w, h, r, alpha = 0.62) {
  c.save();
  rr(c, x, y, w, h, r);
  c.shadowColor = 'rgba(0,0,0,0.22)'; c.shadowBlur = 9;
  c.fillStyle = rgba(COL.back, alpha); c.fill();
  c.shadowColor = 'transparent';
  c.lineWidth = 0.33; c.strokeStyle = rgba(COL.line, 0.28); c.stroke();
  c.restore();
}
function disc(c, x, y, r, hex, a) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = rgba(hex, a); c.fill(); }
function circleLine(c, x, y, r, a = 0.28, w = 0.33, d0 = 0, d1 = 360) {
  c.beginPath(); c.arc(x, y, r, ang(d0), ang(d1)); c.lineWidth = w; c.strokeStyle = rgba(COL.line, a); c.stroke();
}
function sector(c, cx, cy, r0, r1, d0, d1) {
  c.beginPath(); c.arc(cx, cy, r1, ang(d0), ang(d1)); c.arc(cx, cy, r0, ang(d1), ang(d0), true); c.closePath();
}
/** A segmented band: n cells from d0 over sweep degrees, gap in GUI px; fn(i, s0, s1) draws cell i. */
function cells(cx, cy, r, band, d0, sweep, n, gap, fn) {
  const gd = gap / (r - band / 2) * 180 / Math.PI, step = sweep / n;
  for (let i = 0; i < n; i++) fn(i, d0 + i * step + gd / 2, d0 + (i + 1) * step - gd / 2);
}
function text(c, s, x, y, size, colour, align = 'left', alpha = 1, shadow = true) {
  c.save();
  c.font = `${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'alphabetic';
  if (shadow) { c.fillStyle = 'rgba(0,0,0,0.45)'; c.fillText(s, x + size * 0.06, y + size * 0.06); }
  c.globalAlpha = alpha; c.fillStyle = colour; c.fillText(s, x, y);
  c.restore();
}

// ---------- telltale icons (centred, s = box size in GUI px) ----------
const ICON = {
  turnL(c, s) {
    c.beginPath(); c.moveTo(-0.5 * s, 0); c.lineTo(-0.04 * s, -0.42 * s); c.lineTo(-0.04 * s, -0.17 * s); c.lineTo(0.48 * s, -0.17 * s);
    c.lineTo(0.48 * s, 0.17 * s); c.lineTo(-0.04 * s, 0.17 * s); c.lineTo(-0.04 * s, 0.42 * s); c.closePath(); c.fill();
  },
  turnR(c, s) { c.scale(-1, 1); ICON.turnL(c, s); },
  lamp(c, s, dip) {
    c.beginPath(); c.moveTo(-0.02 * s, -0.32 * s); c.bezierCurveTo(0.6 * s, -0.32 * s, 0.6 * s, 0.32 * s, -0.02 * s, 0.32 * s); c.closePath(); c.stroke();
    for (const k of [-0.22, -0.075, 0.075, 0.22]) {
      c.beginPath(); c.moveTo(-0.14 * s, k * s); c.lineTo(-0.5 * s, k * s + (dip ? 0.16 * s : 0)); c.stroke();
    }
  },
  low(c, s) { ICON.lamp(c, s, true); },
  high(c, s) { ICON.lamp(c, s, false); },
  temp(c, s) {
    c.beginPath(); c.moveTo(0, -0.46 * s); c.lineTo(0, 0.06 * s); c.stroke();
    c.beginPath(); c.arc(0, 0.13 * s, 0.1 * s, 0, Math.PI * 2); c.fill();
    for (const k of [-0.36, -0.22, -0.08]) { c.beginPath(); c.moveTo(0.06 * s, k * s); c.lineTo(0.2 * s, k * s); c.stroke(); }
    for (const y of [0.33, 0.46]) {
      c.beginPath();
      for (let i = 0; i <= 16; i++) { const x = -0.46 + 0.92 * i / 16; const yy = y + Math.sin(i / 16 * Math.PI * 3) * 0.035; i ? c.lineTo(x * s, yy * s) : c.moveTo(x * s, yy * s); }
      c.stroke();
    }
  },
  engine(c, s) {
    const p = [[-0.3, -0.12], [-0.12, -0.12], [-0.12, -0.24], [-0.26, -0.24], [-0.26, -0.32], [0.12, -0.32], [0.12, -0.24], [-0.02, -0.24],
      [-0.02, -0.12], [0.22, -0.12], [0.3, -0.04], [0.42, -0.04], [0.42, -0.2], [0.48, -0.2], [0.48, 0.24], [0.42, 0.24], [0.42, 0.1], [0.3, 0.1],
      [0.18, 0.28], [-0.24, 0.28], [-0.3, 0.18], [-0.4, 0.18], [-0.4, 0.3], [-0.47, 0.3], [-0.47, -0.04], [-0.4, -0.04], [-0.4, 0.06], [-0.3, 0.06]];
    c.beginPath(); p.forEach(([x, y], i) => i ? c.lineTo(x * s, y * s) : c.moveTo(x * s, y * s)); c.closePath(); c.stroke();
  },
  glow(c, s) {
    c.beginPath(); c.moveTo(-0.48 * s, 0.22 * s); c.lineTo(-0.36 * s, 0.22 * s);
    for (let k = 0; k < 3; k++) {
      const x = -0.27 * s + k * 0.24 * s;
      c.arc(x, 0.02 * s, 0.11 * s, Math.PI * 0.75, Math.PI * 2.25);
    }
    c.lineTo(0.48 * s, 0.22 * s); c.stroke();
    c.beginPath(); c.moveTo(-0.4 * s, -0.3 * s); c.lineTo(0.4 * s, -0.3 * s); c.stroke();
  },
  oil(c, s) {
    c.beginPath(); c.moveTo(-0.44 * s, -0.06 * s); c.lineTo(-0.2 * s, -0.06 * s); c.lineTo(-0.2 * s, -0.16 * s); c.lineTo(0.02 * s, -0.16 * s);
    c.lineTo(0.02 * s, -0.06 * s); c.lineTo(0.12 * s, -0.06 * s); c.lineTo(0.42 * s, -0.2 * s); c.lineTo(0.2 * s, 0.22 * s); c.lineTo(-0.36 * s, 0.22 * s);
    c.lineTo(-0.36 * s, 0.04 * s); c.lineTo(-0.44 * s, 0.0 * s); c.closePath(); c.stroke();
    c.beginPath(); c.arc(0.44 * s, 0.14 * s, 0.05 * s, 0, Math.PI * 2); c.fill();
  },
  battery(c, s) {
    c.strokeRect(-0.44 * s, -0.2 * s, 0.88 * s, 0.48 * s);
    c.fillRect(-0.32 * s, -0.3 * s, 0.16 * s, 0.1 * s); c.fillRect(0.16 * s, -0.3 * s, 0.16 * s, 0.1 * s);
    c.beginPath(); c.moveTo(-0.32 * s, 0.04 * s); c.lineTo(-0.14 * s, 0.04 * s); c.moveTo(0.14 * s, 0.04 * s); c.lineTo(0.32 * s, 0.04 * s);
    c.moveTo(0.23 * s, -0.05 * s); c.lineTo(0.23 * s, 0.13 * s); c.stroke();
  },
  brake(c, s) {
    c.beginPath(); c.arc(0, 0, 0.3 * s, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.arc(0, 0, 0.44 * s, Math.PI * 0.72, Math.PI * 1.28); c.stroke();
    c.beginPath(); c.arc(0, 0, 0.44 * s, -Math.PI * 0.28, Math.PI * 0.28); c.stroke();
    c.font = `${0.4 * s}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('P', 0, 0.02 * s);
  },
  door(c, s) {
    rr(c, -0.16 * s, -0.44 * s, 0.32 * s, 0.88 * s, 0.1 * s); c.stroke();
    c.beginPath(); c.moveTo(-0.16 * s, -0.1 * s); c.lineTo(-0.44 * s, 0.12 * s); c.stroke();
    c.beginPath(); c.moveTo(-0.16 * s, -0.16 * s); c.lineTo(0.16 * s, -0.16 * s); c.stroke();
  },
  four(c, s) {
    rr(c, -0.48 * s, -0.3 * s, 0.96 * s, 0.6 * s, 0.12 * s); c.stroke();
    c.font = `${0.44 * s}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('4H', 0, 0.03 * s);
  },
  fuel(c, s) {
    c.beginPath(); c.moveTo(-0.34 * s, -0.4 * s); c.lineTo(0.12 * s, -0.4 * s); c.lineTo(0.12 * s, 0.42 * s); c.lineTo(-0.34 * s, 0.42 * s); c.closePath(); c.stroke();
    c.fillRect(-0.26 * s, -0.3 * s, 0.3 * s, 0.2 * s);
    c.beginPath(); c.moveTo(0.12 * s, 0.0); c.lineTo(0.3 * s, 0.0); c.lineTo(0.3 * s, 0.28 * s); c.lineTo(0.4 * s, 0.28 * s); c.lineTo(0.4 * s, -0.22 * s); c.lineTo(0.26 * s, -0.36 * s); c.stroke();
  },
};
function icon(c, name, x, y, s, colour, alpha = 1) {
  c.save(); c.translate(x, y); c.globalAlpha = alpha;
  c.strokeStyle = colour; c.fillStyle = colour; c.lineWidth = Math.max(0.5, s * 0.09); c.lineCap = 'round'; c.lineJoin = 'round';
  ICON[name](c, s); c.restore();
}

// ---------- the state of the truck ----------
const ORDER = [['low', 'high'], ['temp', 'engine', 'glow', 'oil', 'battery'], ['brake', 'door'], ['four', 'fuel']];
function lampColour(name, st) {
  if (name === 'turnL' || name === 'turnR' || name === 'low' || name === 'four') return COL.green;
  if (name === 'high') return COL.blue;
  if (name === 'temp') return st.lamps.temp === 'cold' ? COL.cold : COL.red;
  if (name === 'engine' || name === 'glow' || name === 'fuel') return COL.amber;
  return COL.red;
}
const STATES = {
  off: {name: '钥匙开、还没发动', mph: 0, rpm: 0, gear: 0, fuel: 0.55, coolant: 0.12, lamps: {glow: 1, oil: 1, battery: 1, brake: 1, temp: 'cold'}},
  cruise: {name: '巡航 42 mph、开近光、左转灯', mph: 42, rpm: 2050, gear: 4, fuel: 0.55, coolant: 0.5, lamps: {low: 1, turnL: 1}},
  rev: {name: '转速高、该升挡（远光、4H）', mph: 31, rpm: 4150, gear: 2, fuel: 0.55, coolant: 0.56, shiftUp: 1, lamps: {high: 1, four: 1}},
  warn: {name: '警告：油少、水温高、车门开着', mph: 18, rpm: 1500, gear: 2, fuel: 0.07, coolant: 0.9, lamps: {low: 1, temp: 'hot', engine: 1, door: 1, fuel: 1}},
};
const RPM_MAX = 5000, RPM_RED = 4300, SHIFT_AT = 3800;
const gearName = g => g < 0 ? 'R' : g === 0 ? 'N' : String(g);

// ---------- the survival cluster (as it is in game, approximate) ----------
function survival(c) {
  const cx = 320, cy = 312, S = 1.15;
  const dialR = 9.5 * S, bez = 1.15 * S, vr = 7.5 * S, vb = 2.1 * S, gap = 0.85 * S, vox = dialR + bez + 0.45 * S + vr;
  const cr = 6.1 * S, cb = 1.55 * S, cox = vox + vr + 3.6 * S, reach = 47.7;
  // crescents: stamina "(" left, thirst ")" right; filled from the lower tip
  for (const [side, fill, colour] of [[-1, 0.8, '#C8C6BE'], [1, 0.62, '#6FA3C7']]) {
    const x = cx + side * cox, out = side < 0 ? 270 : 90, d0 = out - 90 - reach, d1 = out + 90 + reach;
    sector(c, x, cy, cr - cb, cr, d0, d1); c.fillStyle = rgba(COL.back, 0.5); c.fill();
    const f = (d1 - d0) * fill;
    if (side < 0) sector(c, x, cy, cr - cb, cr, d0, d0 + f); else sector(c, x, cy, cr - cb, cr, d1 - f, d1);
    c.fillStyle = colour; c.fill();
    circleLine(c, x, cy, cr + 0.15, 0.28, 0.3, d0, d1); circleLine(c, x, cy, cr - cb - 0.15, 0.28, 0.3, d0, d1);
    disc(c, x, cy, 2.9 * S, COL.back, 0.35);
    c.save(); c.translate(x, cy); c.fillStyle = colour;
    if (side < 0) { c.beginPath(); c.moveTo(0.6, -2.6); c.lineTo(-1.4, 0.4); c.lineTo(0, 0.4); c.lineTo(-0.6, 2.6); c.lineTo(1.4, -0.4); c.lineTo(0, -0.4); c.closePath(); c.fill(); }
    else { c.beginPath(); c.moveTo(0, -2.6); c.bezierCurveTo(1.8, -0.4, 1.8, 2.2, 0, 2.2); c.bezierCurveTo(-1.8, 2.2, -1.8, -0.4, 0, -2.6); c.fill(); }
    c.restore();
  }
  // health and hunger rings
  for (const [side, fill, colour] of [[-1, 0.9, '#CC4A42'], [1, 0.8, '#D39A4C']]) {
    const x = cx + side * vox;
    disc(c, x, cy, vr - vb, COL.back, 0.45);
    cells(x, cy, vr, vb, 0, 360, 10, gap, (i, s0, s1) => {
      sector(c, x, cy, vr - vb, vr, s0, s1); c.fillStyle = rgba(COL.back, 0.5); c.fill();
      const f = Math.max(0, Math.min(1, fill * 10 - i));
      if (f > 0) { sector(c, x, cy, vr - vb, vr, s0, s0 + (s1 - s0) * f); c.fillStyle = colour; c.fill(); }
    });
    circleLine(c, x, cy, vr + 0.3, 0.28, 0.3);
    if (side < 0) {
      c.save(); c.translate(x, cy - 1.6); c.fillStyle = colour; c.beginPath();
      c.moveTo(0, 1.6); c.bezierCurveTo(-2.6, -0.2, -1.4, -2.2, 0, -0.9); c.bezierCurveTo(1.4, -2.2, 2.6, -0.2, 0, 1.6); c.fill(); c.restore();
      text(c, '18', x, cy + 4.2, 3.6, '#F0ECE4', 'center');
    } else {
      c.save(); c.translate(x, cy); c.rotate(-0.7); c.fillStyle = colour;
      c.beginPath(); c.ellipse(0, -0.6, 1.5, 2.1, 0, 0, Math.PI * 2); c.fill(); c.fillRect(-0.35, 1.2, 0.7, 1.6); c.restore();
    }
  }
  // temperature dial
  const grad = c.createLinearGradient(0, cy - dialR - bez, 0, cy + dialR + bez);
  grad.addColorStop(0, '#5A5E64'); grad.addColorStop(1, '#2A2C2F');
  c.beginPath(); c.arc(cx, cy, dialR + bez, 0, Math.PI * 2); c.fillStyle = grad; c.fill();
  circleLine(c, cx, cy, dialR + bez + 0.2, 0.28, 0.3);
  disc(c, cx, cy, dialR, '#1A1B1D', 0.95);
  sector(c, cx, cy, dialR - 1.6, dialR - 0.6, 220, 500); c.fillStyle = rgba('#8A8780', 0.35); c.fill();
  sector(c, cx, cy, dialR - 1.6, dialR - 0.6, 220, 330); c.fillStyle = '#C8C6BE'; c.fill();
  text(c, '14°', cx, cy + 1.6, 4.2, '#F0EEE6', 'center');
}

// ---------- concept A: ring (Forza-style round tach) ----------
function dashA(c, st) {
  const cx = 590, cy = 306, R = 34, B = 4.2, a0 = -125, sweep = 250, n = 20;
  disc(c, cx, cy, R - B - 0.4, COL.back, 0.5);
  sector(c, cx, cy, R - B - 0.4, R + 0.6, a0 - 3, a0 + sweep + 3); c.fillStyle = rgba(COL.back, 0.35); c.fill();
  const lit = st.rpm / RPM_MAX * n, shift = st.rpm >= SHIFT_AT;
  cells(cx, cy, R, B, a0, sweep, n, 0.9, (i, s0, s1) => {
    const red = (i + 0.5) / n * RPM_MAX >= RPM_RED;
    sector(c, cx, cy, R - B, R, s0, s1); c.fillStyle = red ? rgba(COL.red, 0.32) : rgba(COL.line, 0.13); c.fill();
    const f = Math.max(0, Math.min(1, lit - i));
    if (f > 0) {
      sector(c, cx, cy, R - B, R, s0, s0 + (s1 - s0) * f);
      c.fillStyle = red ? COL.red : shift ? COL.accent : COL.text; c.fill();
    }
  });
  circleLine(c, cx, cy, R + 0.35, 0.28, 0.33, a0 - 2, a0 + sweep + 2);
  circleLine(c, cx, cy, R - B - 0.4, 0.2, 0.3);
  for (let k = 0; k <= 5; k++) {
    const d = a0 + sweep * k / 5, r = R - B - 4.6;
    text(c, String(k), cx + Math.sin(d * Math.PI / 180) * r, cy - Math.cos(d * Math.PI / 180) * r + 1.6, 4.2, k >= 5 ? COL.red : COL.dim, 'center', 0.9, false);
  }
  text(c, String(st.mph), cx, cy + 4, 17, COL.text, 'center');
  text(c, 'MPH', cx, cy + 10.5, 3.8, COL.dim, 'center');
  // gear in the ring's lower gap
  panel(c, cx - 7, cy + R - 10, 14, 14, 3, 0.72);
  text(c, gearName(st.gear), cx, cy + R + 0.6, 10, COL.text, 'center');
  if (st.shiftUp) { c.save(); c.fillStyle = COL.accent; c.beginPath(); c.moveTo(cx + 10, cy + R - 2); c.lineTo(cx + 13, cy + R - 6.5); c.lineTo(cx + 16, cy + R - 2); c.closePath(); c.fill(); c.restore(); }
  // fuel: a crescent hugging the ring at the lower left, the same make as the stamina / thirst crescents
  const fa = 236, fd = R + 8.2, fx = cx + Math.sin(fa * Math.PI / 180) * fd, fy = cy - Math.cos(fa * Math.PI / 180) * fd;
  const cr = 7.4, cb = 1.9, f0 = fa - 140, f1 = fa + 140, low = st.fuel < 0.12, fc = low ? COL.red : COL.fuel;
  sector(c, fx, fy, cr - cb, cr, f0, f1); c.fillStyle = rgba(COL.back, 0.55); c.fill();
  sector(c, fx, fy, cr - cb, cr, f1 - (f1 - f0) * st.fuel, f1); c.fillStyle = fc; c.fill();
  circleLine(c, fx, fy, cr + 0.15, 0.28, 0.3, f0, f1); circleLine(c, fx, fy, cr - cb - 0.15, 0.28, 0.3, f0, f1);
  disc(c, fx, fy, 3.6, COL.back, 0.5);
  icon(c, 'fuel', fx, fy, 5.2, fc);
  // the top strip: every lamp keeps its place, unlit ones ghosted
  topStrip(c, st, 'pill');
}

// ---------- concept B: speed band (NFS-style big number and a rising rpm ramp) ----------
function dashB(c, st) {
  const x0 = 430, x1 = 640, y0 = 282, y1 = 356;
  const g = c.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, rgba(COL.back, 0)); g.addColorStop(0.42, rgba(COL.back, 0.5)); g.addColorStop(1, rgba(COL.back, 0.66));
  c.fillStyle = g; c.fillRect(x0, y0, x1 - x0, y1 - y0);
  const gl = c.createLinearGradient(x0, 0, x1, 0);
  gl.addColorStop(0, rgba(COL.line, 0)); gl.addColorStop(1, rgba(COL.line, 0.28));
  c.fillStyle = gl; c.fillRect(x0, y0, x1 - x0, 0.33); c.fillRect(x0, y1 - 0.33, x1 - x0, 0.33);
  // rpm ramp
  const n = 24, rx0 = 487, rx1 = 628, base = 302, cw = (rx1 - rx0) / n, lit = st.rpm / RPM_MAX * n, shift = st.rpm >= SHIFT_AT;
  for (let i = 0; i < n; i++) {
    const h = 2.6 + 8.4 * i / (n - 1), x = rx0 + i * cw, w = cw - 1.3, sk = 1.6, red = (i + 0.5) / n * RPM_MAX >= RPM_RED;
    const f = Math.max(0, Math.min(1, lit - i));
    c.beginPath(); c.moveTo(x, base); c.lineTo(x + sk, base - h); c.lineTo(x + sk + w, base - h); c.lineTo(x + w, base); c.closePath();
    c.fillStyle = f > 0.5 ? (red ? COL.red : shift ? COL.accent : COL.text) : red ? rgba(COL.red, 0.3) : rgba(COL.line, 0.13); c.fill();
  }
  for (let k = 1; k <= 5; k++) text(c, String(k), rx0 + (rx1 - rx0) * k / 5 - 1.2, base + 5.4, 3.6, k === 5 ? COL.red : COL.dim, 'center', 0.85, false);
  // gear box
  panel(c, 487, 314, 18, 19, 3, 0.7);
  text(c, gearName(st.gear), 496, 328.6, 13, COL.text, 'center');
  if (st.shiftUp) { c.save(); c.fillStyle = COL.accent; c.beginPath(); c.moveTo(492, 312); c.lineTo(496, 307.5); c.lineTo(500, 312); c.closePath(); c.fill(); c.restore(); }
  // speed
  text(c, String(st.mph), 612, 335, 27, COL.text, 'right');
  text(c, 'MPH', 627, 335, 4.6, COL.dim, 'right', 1, false);
  // fuel row
  const low = st.fuel < 0.12, fc = low ? COL.red : COL.fuel;
  icon(c, 'fuel', 492, 344.5, 5.6, fc);
  const fx0 = 500, fx1 = 628, cells2 = 12, cwf = (fx1 - fx0) / cells2;
  for (let i = 0; i < cells2; i++) {
    const f = Math.max(0, Math.min(1, st.fuel * cells2 - i));
    rr(c, fx0 + i * cwf, 343.3, cwf - 0.9, 2.4, 0.6); c.fillStyle = rgba(COL.line, 0.13); c.fill();
    if (f > 0) { rr(c, fx0 + i * cwf, 343.3, (cwf - 0.9) * f, 2.4, 0.6); c.fillStyle = fc; c.fill(); }
  }
  text(c, 'E', fx0 - 0.2, 351, 3.2, COL.dim, 'left', 0.8, false);
  text(c, 'F', fx1, 351, 3.2, COL.dim, 'right', 0.8, false);
  topStrip(c, st, 'fade');
}

// ---------- concept C: digital card ----------
function dashC(c, st) {
  const x = 470, y = 290, w = 162, h = 62;
  panel(c, x, y, w, h, 4);
  // thin rpm bar along the top edge
  const bx0 = x + 7, bx1 = x + w - 7, by = y + 6.5, red = bx0 + (bx1 - bx0) * RPM_RED / RPM_MAX, shift = st.rpm >= SHIFT_AT;
  rr(c, bx0, by, bx1 - bx0, 2.6, 1.3); c.fillStyle = rgba(COL.line, 0.12); c.fill();
  rr(c, red, by, bx1 - red, 2.6, 1.3); c.fillStyle = rgba(COL.red, 0.35); c.fill();
  const fill = (bx1 - bx0) * Math.min(1, st.rpm / RPM_MAX);
  if (fill > 0) {
    c.save(); rr(c, bx0, by, fill, 2.6, 1.3); c.clip();
    c.fillStyle = shift ? COL.accent : COL.text; c.fillRect(bx0, by, fill, 2.6);
    if (bx0 + fill > red) { c.fillStyle = COL.red; c.fillRect(red, by, bx0 + fill - red, 2.6); }
    c.restore();
  }
  for (let k = 1; k < 5; k++) { const tx = bx0 + (bx1 - bx0) * k / 5; c.fillStyle = rgba(COL.line, 0.3); c.fillRect(tx - 0.15, by + 3.2, 0.3, 1.3); }
  // gear strip: the selected gear lifts and the amber pill sits under it (the hotbar's selection, AflItemStrip)
  const gears = [-1, 0, 1, 2, 3, 4, 5], gx = x + 10, gs = 10.2;
  gears.forEach((gv, i) => {
    const on = gv === st.gear, cx = gx + i * gs;
    text(c, gearName(gv), cx, y + 27 - (on ? 1.6 : 0), on ? 9 : 6, on ? COL.text : COL.dis, 'center', 1, on);
    if (on) { rr(c, cx - 3.2, y + 29.6, 6.4, 1.6, 0.8); c.fillStyle = COL.accent; c.fill(); }
  });
  if (st.shiftUp) { c.save(); c.fillStyle = COL.accent; const ax = gx + (gears.indexOf(st.gear) + 1) * gs; c.beginPath(); c.moveTo(ax - 2.4, y + 25); c.lineTo(ax, y + 21.2); c.lineTo(ax + 2.4, y + 25); c.closePath(); c.fill(); c.restore(); }
  // fuel and coolant rows
  const low = st.fuel < 0.12, fc = low ? COL.red : COL.fuel, rx0 = x + 17, rx1 = x + 80;
  icon(c, 'fuel', x + 10.5, y + 40, 5.4, fc);
  rr(c, rx0, y + 38.8, rx1 - rx0, 2.4, 1.2); c.fillStyle = rgba(COL.line, 0.12); c.fill();
  rr(c, rx0, y + 38.8, (rx1 - rx0) * st.fuel, 2.4, 1.2); c.fillStyle = fc; c.fill();
  const hot = st.coolant > 0.82, cold = st.coolant < 0.25, tc = hot ? COL.red : cold ? COL.cold : COL.text;
  icon(c, 'temp', x + 10.5, y + 51, 5.6, hot ? COL.red : cold ? COL.cold : COL.dim);
  const tg = c.createLinearGradient(rx0, 0, rx1, 0);
  tg.addColorStop(0, rgba(COL.cold, 0.35)); tg.addColorStop(0.3, rgba(COL.line, 0.14)); tg.addColorStop(0.78, rgba(COL.line, 0.14)); tg.addColorStop(1, rgba(COL.red, 0.45));
  rr(c, rx0, y + 49.8, rx1 - rx0, 2.4, 1.2); c.fillStyle = tg; c.fill();
  const tx = rx0 + (rx1 - rx0) * st.coolant;
  rr(c, tx - 0.9, y + 48.2, 1.8, 5.6, 0.9); c.fillStyle = tc; c.fill();
  text(c, 'C', rx0, y + 58.6, 3.2, COL.dim, 'left', 0.8, false);
  text(c, 'H', rx1, y + 58.6, 3.2, COL.dim, 'right', 0.8, false);
  // divider and speed
  c.fillStyle = rgba(COL.line, 0.12); c.fillRect(x + 88, y + 15, 0.33, 40);
  text(c, String(st.mph), x + w - 8, y + 45, 25, COL.text, 'right');
  text(c, 'MPH', x + w - 8, y + 54.5, 4.4, COL.dim, 'right', 1, false);
  topStrip(c, st, 'discs');
}

// ---------- the telltale strip at the top ----------
function topStrip(c, st, kind) {
  const cx = 320, cy = 12, sp = 12.5, groupGap = 5, is = 8.2;
  const items = [];
  ORDER.forEach((grp, gi) => grp.forEach((name, i) => items.push({name, gap: gi > 0 && i === 0})));
  if (kind === 'discs') {
    const on = items.filter(it => st.lamps[it.name]);
    const ds = 15, total = (on.length - 1) * ds;
    on.forEach((it, i) => {
      const x = cx - total / 2 + i * ds;
      disc(c, x, cy, 6.3, COL.back, 0.58); circleLine(c, x, cy, 6.45, 0.28, 0.3);
      icon(c, it.name, x, cy, is * 0.95, lampColour(it.name, st));
    });
    for (const [name, side] of [['turnL', -1], ['turnR', 1]]) {
      if (!st.lamps[name]) continue;
      const x = cx + side * Math.max(52, total / 2 + 22);
      disc(c, x, cy, 6.3, COL.back, 0.58); circleLine(c, x, cy, 6.45, 0.28, 0.3);
      icon(c, name, x, cy, 8.6, COL.green);
    }
    return;
  }
  let width = 0;
  items.forEach((it, i) => { width += (i ? sp : 0) + (it.gap ? groupGap : 0); });
  const left = cx - width / 2;
  if (kind === 'pill') panel(c, left - 9, cy - 7.5, width + 18, 15, 7.5, 0.58);
  else {
    const g = c.createLinearGradient(left - 40, 0, left + width + 40, 0);
    g.addColorStop(0, rgba(COL.back, 0)); g.addColorStop(0.18, rgba(COL.back, 0.6)); g.addColorStop(0.82, rgba(COL.back, 0.6)); g.addColorStop(1, rgba(COL.back, 0));
    c.fillStyle = g; c.fillRect(left - 40, cy - 8, width + 80, 16);
    const gl = c.createLinearGradient(left - 40, 0, left + width + 40, 0);
    gl.addColorStop(0, rgba(COL.line, 0)); gl.addColorStop(0.5, rgba(COL.line, 0.28)); gl.addColorStop(1, rgba(COL.line, 0));
    c.fillStyle = gl; c.fillRect(left - 40, cy + 8, width + 80, 0.33);
  }
  let x = left;
  items.forEach((it, i) => {
    x += (i ? sp : 0) + (it.gap ? groupGap : 0);
    if (it.gap && kind === 'pill') { c.fillStyle = rgba(COL.line, 0.16); c.fillRect(x - sp / 2 - groupGap / 2 - 0.15, cy - 4.5, 0.3, 9); }
    const lit = st.lamps[it.name];
    icon(c, it.name, x, cy, is, lit ? lampColour(it.name, st) : COL.line, lit ? 1 : 0.16);
  });
  const ax = kind === 'pill' ? width / 2 + 21 : width / 2 + 34;
  icon(c, 'turnL', cx - ax, cy, 9.5, st.lamps.turnL ? COL.green : COL.line, st.lamps.turnL ? 1 : 0.16);
  icon(c, 'turnR', cx + ax, cy, 9.5, st.lamps.turnR ? COL.green : COL.line, st.lamps.turnR ? 1 : 0.16);
}

// ---------- frames and sheets ----------
let BG;
const CONCEPTS = {
  A: {fn: dashA, title: '方案 A · 环形转速表', lines: [
    '右下一个分段圆环当转速表（0–5 千转，4300 起红区，快到断油时整圈变琥珀色），圈里是车速（mph），下方缺口里是挡位。',
    '油量是贴着大环左下的半环（和生存 HUD 的耐力 / 口渴半环同一种做法，油泵图标在里面，油少变红）。',
    '顶上一条圆角指示灯栏：近光 / 远光 | 水温 / 发动机 / 预热 / 机油 / 电瓶 | 手刹 / 车门 | 4H / 油少，转向灯在两端；没亮的灯淡淡地留着位置。参考 Forza Horizon 的圆表。']},
  B: {fn: dashB, title: '方案 B · 速度带', lines: [
    '右下大号车速，上面一条往右越来越高的斜格转速带（4300 起红格，快到断油时亮格变琥珀色），左边方框是挡位，该升挡时方框上出现琥珀色小箭头。',
    '油量是车速下面一排 12 格（E–F，油少变红）。底板从右往左渐隐，和按键提示面板一样，不画左边框。',
    '顶上的指示灯条两端渐隐，转向灯在条的两头；没亮的灯淡淡地留着位置。参考 NFS Heat 的大数字 + 转速带。']},
  C: {fn: dashC, title: '方案 C · 数字卡片', lines: [
    '右下一张圆角卡片（和交互面板同一种底和描边）：顶边一条细转速条；左上一排 R N 1–5，当前挡上顶、下面是琥珀色小胶囊（和快捷栏选中同一个动画，换挡时胶囊滑过去）。',
    '左下两条：油量（油少变红）和水温（C–H，冷时偏蓝、过热变红）；右边大号车速。',
    '顶上只显示亮着的灯，每个灯垫一个小圆底，像生存 HUD 半环里的图标；转向灯亮时出现在两侧。最安静的一套。']},
};
function frame(c, key, st) {
  c.save();
  const s = 1920 / BG.width, h = BG.height * s;
  c.drawImage(BG, 0, (1080 - h) / 2, 1920, h);
  c.globalCompositeOperation = 'multiply'; c.fillStyle = '#8890A4'; c.fillRect(0, 0, 1920, 1080);
  c.globalCompositeOperation = 'source-over';
  const v = c.createLinearGradient(0, 0, 0, 1080); v.addColorStop(0, 'rgba(10,14,26,0.35)'); v.addColorStop(0.45, 'rgba(10,14,26,0)'); v.addColorStop(1, 'rgba(0,0,0,0.25)');
  c.fillStyle = v; c.fillRect(0, 0, 1920, 1080);
  c.scale(G, G);
  survival(c);
  CONCEPTS[key].fn(c, st);
  c.restore();
}
function caption(c, y, w, title, lines, note) {
  c.fillStyle = '#141516'; c.fillRect(0, y, w, 1e4);
  c.fillStyle = '#E8E4DC'; c.font = `34px ${FONT}`; c.textBaseline = 'top'; c.fillText(title, 40, y + 22);
  c.font = `21px ${FONT}`; c.fillStyle = '#C8C4BC';
  lines.forEach((l, i) => c.fillText(l, 40, y + 74 + i * 33));
  if (note) { c.fillStyle = '#8A8780'; c.font = `18px ${FONT}`; c.fillText(note, 40, y + 74 + lines.length * 33 + 8); }
}
const NOTE = '示意：画面是 T15 驾驶室的离线渲染（压暗成黄昏），界面缩放 3。中间是现有的生存 HUD；坐进车里快捷栏、物品名、负重条已经隐藏（本轮已做）。转向灯游戏里还没有，先画出位置。';
function sheetConcept(key) {
  const cv = document.createElement('canvas'); cv.width = 1920; cv.height = 1080 + 230;
  const c = cv.getContext('2d');
  frame(c, key, STATES.cruise);
  caption(c, 1080, 1920, CONCEPTS[key].title + '（状态：' + STATES.cruise.name + '）', CONCEPTS[key].lines, NOTE);
  return cv;
}
function sheetStates() {
  const cellW = 660, cellH = 350, left = 180, top = 64, keys = ['A', 'B', 'C'], states = ['off', 'cruise', 'rev', 'warn'];
  const cv = document.createElement('canvas'); cv.width = left + states.length * cellW + 20; cv.height = top + keys.length * cellH + 70;
  const c = cv.getContext('2d');
  c.fillStyle = '#141516'; c.fillRect(0, 0, cv.width, cv.height);
  const f = document.createElement('canvas'); f.width = 1920; f.height = 1080; const fc = f.getContext('2d');
  c.textBaseline = 'top';
  states.forEach((s, j) => { c.fillStyle = '#E8E4DC'; c.font = `22px ${FONT}`; c.fillText(STATES[s].name, left + j * cellW + 12, 22); });
  keys.forEach((k, i) => {
    c.fillStyle = '#E8E4DC'; c.font = `26px ${FONT}`; c.fillText('方案 ' + k, 24, top + i * cellH + 150);
    c.fillStyle = '#8A8780'; c.font = `17px ${FONT}`; c.fillText(CONCEPTS[k].title.split('· ')[1], 24, top + i * cellH + 186);
    states.forEach((s, j) => {
      fc.clearRect(0, 0, 1920, 1080); frame(fc, k, STATES[s]);
      const x = left + j * cellW, y = top + i * cellH;
      // top strip (GUI x 205..435, y 1..23) scaled to the cell width, then the bottom right (GUI x 430..640, y 270..360) 1:1
      c.drawImage(f, 205 * G, 1 * G, 230 * G, 22 * G, x + 10, y, cellW - 20, (cellW - 20) * 22 / 230);
      c.drawImage(f, 430 * G, 270 * G, 210 * G, 90 * G, x + 15, y + 66, 210 * G, 90 * G);
    });
  });
  c.fillStyle = '#8A8780'; c.font = `18px ${FONT}`;
  c.fillText('每格上面是屏幕顶部的指示灯（略缩小），下面是右下角的仪表（原大，界面缩放 3）。颜色：绿 / 蓝是提示，琥珀是注意，红是警告；平时全是暖灰，只有挡位 / 换挡提示用一处琥珀色。', 24, cv.height - 46);
  return cv;
}
async function save(cv, name) {
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  await fetch('/save?name=' + name, {method: 'POST', body: blob});
}
async function sheets() {
  for (const k of ['A', 'B', 'C']) await save(sheetConcept(k), 'dash_' + k + '.png');
  await save(sheetStates(), 'dash_states.png');
  return 'saved';
}
(async () => {
  await document.fonts.load(`20px "AFL Sans"`);
  // onload, not decode(): decode() never settles in a hidden tab
  BG = new Image(); await new Promise(res => { BG.onload = res; BG.src = '/design/vehicles/first_pickup_v0/sheets/v1_cab_eye.png'; });
  const out = document.getElementById('out');
  for (const k of ['A', 'B', 'C']) out.appendChild(sheetConcept(k));
  out.appendChild(sheetStates());
  window.ready = true;
})();
</script>
