@font-face { font-family: 'AFL Sans'; src: url('/assets/font/afl_sans_sc.ttf'); }
:root {
  --back: rgba(16,16,16,.62); --back-hover: rgba(30,33,36,.72); --back-down: rgba(8,9,10,.8);

* { box-sizing: border-box; }
body { margin: 0; background: #141516; color: var(--text); font-family: 'AFL Sans', 'Microsoft YaHei', sans-serif; }
.sheet { width: 1920px; }
.screen { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(9px) brightness(.5) saturate(.85); }
.shade { position: absolute; inset: 0; }
.caption { background: #18191a; padding: 30px 40px 34px; min-height: 230px; }
.caption h1 { margin: 0 0 14px; font-size: 34px; font-weight: normal; }
.caption p { margin: 6px 0; font-size: 21px; color: #CFCBC3; line-height: 1.5; }
.abs { position: absolute; }
.panel { background: var(--back); border: 1.5px solid var(--line); border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,.22); }
.h { font-size: 22px; color: var(--dim); letter-spacing: 1px; }
.t { font-size: 26px; }
.d { color: var(--dim); }
.o { color: var(--off); }
.key { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 32px; padding: 0 9px; border-radius: 7px;
  background: rgba(232,228,220,.92); color: #16181A; font-size: 19px; margin-right: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 64px; padding: 0 34px; border-radius: 10px; font-size: 26px;
  background: var(--back); border: 1.5px solid var(--line); color: var(--text); }
.btn.main { background: rgba(232,228,220,.92); color: #16181A; border-color: transparent; }
.btn.small { height: 46px; padding: 0 20px; font-size: 21px; }
.field { height: 60px; border-radius: 10px; background: rgba(8,9,10,.55); border: 1.5px solid var(--line); display: flex; align-items: center; padding: 0 20px; font-size: 25px; }
.field.focus { border-color: var(--line-hi); }
.caret { display: inline-block; width: 2px; height: 28px; background: var(--text); margin-left: 2px; }
.pips { display: inline-flex; gap: 6px; }
.pip { width: 26px; height: 14px; border-radius: 4px; background: rgba(232,228,220,.12); border: 1px solid rgba(232,228,220,.18); }
.pip.on { background: #D8D4CC; border-color: transparent; }
.pip.add { background: var(--acc); border-color: transparent; }
.pm { width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; color: var(--text); background: rgba(8,9,10,.4); }
.pm.off { color: var(--off); border-color: rgba(232,228,220,.12); }
.badge { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; position: relative;
  box-shadow: 0 1px 4px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,255,255,.28); flex: none; }
.badge svg { width: 24px; height: 24px; }
.tag { display: inline-block; font-size: 17px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--dim); margin-left: 8px; }
.seg { display: flex; gap: 12px; }
.check { width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.check.on { background: rgba(232,228,220,.92); border-color: transparent; }
.check.on::after { content: ''; width: 12px; height: 7px; border-left: 3px solid #16181A; border-bottom: 3px solid #16181A; transform: rotate(-45deg) translate(1px,-1px); }
.radio { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-hi); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.radio.on::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--text); }
</style>

// ---------- the survivor drawn from a pool skin (front + right side, oblique) ----------
async function character(canvas, skinUrl, px) {
  const img = new Image(); img.src = skinUrl; await img.decode();
  const c = canvas.getContext('2d'); c.imageSmoothingEnabled = false;
  // oblique view: one texel of depth goes (DX, DY) texels on screen, so the model's right side and the tops show
  const DX = -0.55, DY = -0.32;
  // the model spans x -4..12 and y 0..32 (texels), depth 8 at the head; centre it on the canvas
  const ox = canvas.width / px / 2 - (-4 + 8 * DX + 12) / 2, oy = canvas.height / px / 2 - (8 * DY + 32) / 2;
  // a box: front face at (x, y) w x h texels, d deep; uv corners of its front, right-side and top faces
  function box(x, y, w, h, d, front, side, top, inflate = 0) {
    const s = px, X = (ox + x - inflate) * s, Y = (oy + y - inflate) * s;
    const fw = (w + 2 * inflate) / w, fh = (h + 2 * inflate) / h, fd = (d + 2 * inflate) / d;
    if (side) {   // u: 0 at the back, d at the front edge
      c.save();
      c.setTransform(-DX * s * fd, -DY * s * fd, 0, s * fh, X, Y);
      c.translate(-d, 0);
      c.drawImage(img, side[0], side[1], d, h, 0, 0, d, h);
      c.fillStyle = 'rgba(0,0,0,0.3)'; c.fillRect(0, 0, d, h);
      c.restore();
    }
    if (top) {    // v: 0 at the back, d at the front edge
      c.save();
      c.setTransform(s * fw, 0, -DX * s * fd, -DY * s * fd, X, Y);
      c.translate(0, -d);
      c.drawImage(img, top[0], top[1], w, d, 0, 0, w, d);
      c.fillStyle = 'rgba(255,255,255,0.07)'; c.fillRect(0, 0, w, d);
      c.restore();
    }
    c.drawImage(img, front[0], front[1], w, h, X, Y, w * s * fw, h * s * fh);
  }
  // back to front: left leg, right leg, body, left arm, right arm, head; the outer layer slightly inflated
  box(4, 20, 4, 12, 4, [20, 52], null, null); box(4, 20, 4, 12, 4, [4, 52], null, null, 0.25);
  box(0, 20, 4, 12, 4, [4, 20], [0, 20], null); box(0, 20, 4, 12, 4, [4, 36], [0, 36], null, 0.25);
  box(0, 8, 8, 12, 4, [20, 20], null, [20, 16]); box(0, 8, 8, 12, 4, [20, 36], null, [20, 32], 0.25);
  box(8, 8, 4, 12, 4, [36, 52], null, [36, 48]); box(8, 8, 4, 12, 4, [52, 52], null, [52, 48], 0.25);
  box(-4, 8, 4, 12, 4, [44, 20], [40, 20], [44, 16]); box(-4, 8, 4, 12, 4, [44, 36], [40, 36], [44, 32], 0.25);
  box(0, 0, 8, 8, 8, [8, 8], [0, 8], [8, 0]); box(0, 0, 8, 8, 8, [40, 8], [32, 8], [40, 0], 0.5);
}

      <div style="flex:1;height:54px;border-radius:9px;background:rgba(232,228,220,.92);color:#16181A;display:flex;align-items:center;justify-content:center;font-size:25px">普通</div>
      <div style="flex:1;height:54px;display:flex;align-items:center;justify-content:center;font-size:25px" class="d">困难</div></div>
    <div style="font-size:21px;margin-bottom:4px">死了由另一位幸存者接着活。</div>
    <div class="o" style="font-size:18px;margin-bottom:30px">死后随身物品都留在遗体上。选了就不能改。</div>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:0"><span class="check"></span><span style="font-size:22px">允许命令</span><span class="o" style="font-size:18px">开发、录视频用</span></div>`;
  add(s, 80, 900, 560, 0, '', `<div style="display:flex;gap:16px"><span class="btn">取消</span><span class="btn main" style="flex:1">创建世界</span></div>
    <div class="d" style="font-size:19px;margin-top:14px;text-align:right">下一步：幸存者 ›</div>`);
  add(s, 1300, 990, 560, 0, '', `<div class="d" style="text-align:right;font-size:19px">背景：以后换成开局场景的实景</div>`);
}

// ---------- B2: Survivor, the person in the middle, backgrounds as cards ----------
function survivorB() {
  const bg = bgOf(PICK.bg), P = points(bg), [str, fit] = PICK.body;
  const s = sheet('方案 B · 幸存者：人站中间，背景是底部一排卡片', [
    '像选角色的界面：人站在正中，底下一排背景卡片（图标、名字、一句话、固定特质、点数预算），点一张人就换装、数值跟着变。顶上一行选出生地（联机时房主定）。',
    '左栏：身体机能两项（加减号、点条、读数；虚线的 6、7 级只能靠成长涨），下面只读地列出成长的起点（枪械三项的等级和换弹档位）和开局汇总。',
    '右栏：按组分的特质列表，可以滚动（底部渐隐 + 滚动条）；鼠标停在哪个特质上，标题下面写它改了什么。比方案 A 人更大、更有仪式感，但特质列表窄，一屏看到的少。',
  ]);
  backdrop(s, '/design/ui/new_world_v1/source/bg_forest.png', 'radial-gradient(ellipse at 50% 40%, rgba(8,9,10,.0), rgba(8,9,10,.62) 70%)');
  add(s, 60, 40, 700, 0, '', `<div style="display:flex;align-items:center"><span class="key">Esc</span><span class="t d">退出到标题</span></div>`);
  add(s, 0, 30, 1920, 0, '', `<div style="text-align:center"><div style="font-size:40px">幸存者</div></div>`);
  add(s, 1160, 26, 700, 0, '', `<div style="text-align:right"><span class="o" style="font-size:18px;margin-right:18px">背景 ${bg.budget} · 负面特质 +${P.got}</span><span class="d" style="font-size:22px">剩余点数</span>
    <span style="font-size:52px;margin-left:14px">${P.left}</span><span class="d" style="font-size:26px"> / ${P.total}</span></div>`);
  add(s, 460, 94, 1000, 0, '', `<div style="display:flex;justify-content:center;gap:10px;white-space:nowrap">${SCENES.map(sc =>
    `<span style="display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;font-size:20px;border:1.5px solid ${sc.id === PICK.scene ? 'var(--line-hi)' : 'var(--line)'};background:${sc.id === PICK.scene ? 'rgba(232,228,220,.14)' : 'var(--back)'};color:${sc.id === PICK.scene ? 'var(--text)' : 'var(--dim)'}">
     ${svg(sc.icon, sc.id === PICK.scene ? '#E8E4DC' : '#A8A49C').replace('<svg', '<svg style="width:20px;height:20px"')}${sc.name}</span>`).join('')}</div>
     <div class="o" style="text-align:center;font-size:18px;margin-top:8px">出生地 · 联机时由房主定</div>`);

  // person
  s.appendChild(el(`<canvas id="ch" class="abs" width="560" height="580" style="left:680px;top:176px"></canvas>`));
  add(s, 760, 740, 400, 0, '', `<div style="text-align:center"><div style="font-size:30px">Dev</div><div class="d" style="font-size:19px;margin-top:4px">账号名 · <u>改名</u></div></div>`);

  // body, growth start, summary: left
  const left = add(s, 60, 180, 560, 0, 'panel', '', 'padding:16px 24px 18px');
  const row = (icon, name, lv, read) => `<div style="display:grid;grid-template-columns:24px 48px 30px 192px 30px 1fr;align-items:center;gap:9px;height:46px">
    <span style="opacity:.7">${svg(icon, '#E8E4DC').replace('<svg', '<svg style="width:22px;height:22px"')}</span>
    <span style="font-size:21px">${name}</span><span class="pm" style="width:30px;height:30px;font-size:20px">−</span>${bodyPips(lv, 22)}<span class="pm ${lv >= 5 ? 'off' : ''}" style="width:30px;height:30px;font-size:20px">+</span>
    <span class="d" style="font-size:17px;text-align:right;white-space:nowrap">${read}</span></div>`;
  const g0 = gunStart(bg);
  const grow = (icon, name, lv) => `<div style="display:grid;grid-template-columns:24px 72px 1fr auto;align-items:center;gap:10px;height:34px">
    <span style="opacity:.6">${svg(icon, '#E8E4DC').replace('<svg', '<svg style="width:20px;height:20px"')}</span>
    <span style="font-size:19px">${name}</span>${growPips(lv)}<span class="d" style="font-size:17px">${lv} 级 · ${tier(lv)}换弹</span></div>`;
  left.innerHTML = `<div class="h" style="font-size:20px">身体机能</div>` +
    row('weight', '力量', str, `${LOAD(str)} kg`) + row('run', '体能', fit, `体力 ${STAM[fit - 1]}`) +
    `<div class="o" style="font-size:16px;margin:2px 0 10px">从 3 起，加一级花 1 点；虚线的 6、7 级靠成长</div>
    <div style="border-top:1px solid rgba(232,228,220,.14);padding-top:10px;display:flex;justify-content:space-between;align-items:baseline">
      <span class="h" style="font-size:20px">成长 · 起点</span><span class="o" style="font-size:16px">进游戏后做什么练什么</span></div>` +
    grow('pistol', '手枪', g0) + grow('rifle', '长枪', has(bg, 'hunted') ? Math.max(g0, 3) : g0) + grow('shotgun', '霰弹枪', has(bg, 'hunted') ? Math.max(g0, 3) : g0) +
    `<div style="border-top:1px solid rgba(232,228,220,.14);margin-top:10px;padding-top:8px">` +
    [['舒适负重', `${LOAD(str)} kg`], ['体力', `${STAM[fit - 1]} · 恢复 ×${REGEN[fit - 1].toFixed(2)}`], ['舒适温度', tempRange(bg)], ['脚步声', '×0.7']].map(([k, v]) =>
      `<div style="display:flex;justify-content:space-between;font-size:20px;padding:2px 0"><span class="d">${k}</span><span>${v}</span></div>`).join('') + '</div>';

  // traits: right, grouped, scrolling
  const right = add(s, 1300, 180, 560, 620, 'panel', '', 'padding:16px 24px 0;overflow:hidden');
  const H = TRAITS[PICK.hover];
  const chip = k => {
    const t = TRAITS[k], fromBg = bg.traits.includes(k), picked = has(bg, k), off = blocked(bg, k), hover = k === PICK.hover;
    return `<div style="display:flex;align-items:center;gap:8px;height:38px;padding:0 8px;border-radius:8px;${picked ? 'background:rgba(232,228,220,.09);border:1.5px solid var(--line-hi)' : hover ? 'background:rgba(232,228,220,.045);border:1.5px solid transparent' : 'border:1.5px solid transparent'}">
      ${badge(k, 28, off)}<div style="flex:1;min-width:0;display:flex;justify-content:space-between;align-items:baseline;white-space:nowrap;opacity:${off ? .4 : 1}">
      <span style="font-size:19px">${t.name}</span><span class="d" style="font-size:15px">${fromBg ? lock : ''}${costText(t, fromBg)}</span></div></div>`;
  };
  right.innerHTML = `<div class="h" style="font-size:20px">特质</div>
    <div style="font-size:17px;margin:4px 0 2px;white-space:nowrap;overflow:hidden">${H.name} <span class="d">· ${costText(H)} 点 · ${H.what}</span></div>
    <div style="position:absolute;right:7px;top:84px;bottom:12px;width:5px;border-radius:3px;background:rgba(232,228,220,.08)">
      <div style="height:58%;border-radius:3px;background:rgba(232,228,220,.35)"></div></div>
    <div style="margin-right:8px">${GROUPS.map(g => `<div style="display:flex;align-items:center;gap:10px;margin:8px 0 3px"><span class="d" style="font-size:16px">${g}</span>
      <span style="flex:1;height:1px;background:rgba(232,228,220,.12)"></span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 8px">${listed(bg, g).map(chip).join('')}</div>`).join('')}</div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:70px;border-radius:0 0 12px 12px;background:linear-gradient(rgba(16,16,16,0),rgba(16,16,16,.9))"></div>`;

  // background cards
  const W = 176, G = 12, X0 = 60;
  BACKGROUNDS.forEach((b, i) => {
    const on = b.id === PICK.bg;
    add(s, X0 + i * (W + G), on ? 818 : 830, W, on ? 212 : 200, 'panel', `
      <div style="display:flex;align-items:center;gap:10px"><span class="badge" style="width:40px;height:40px;background:rgba(232,228,220,${on ? .24 : .12})">${svg(b.icon)}</span>
      <span style="font-size:${b.name.length > 4 ? 19 : 22}px;line-height:1.1;white-space:nowrap">${b.name}</span></div>
      <div class="d" style="font-size:16px;margin-top:10px;line-height:1.4;height:46px;overflow:hidden">${b.line}</div>
      <div class="${on ? '' : 'd'}" style="font-size:16px;margin-top:6px;line-height:1.45;height:46px">${b.traits.length ? b.traits.map(k => `<span style="white-space:nowrap;margin-right:10px">${TRAITS[k].name}</span>`).join(' ') : '<span class="o">无固定特质</span>'}</div>
      <div class="${on ? '' : 'd'}" style="font-size:16px;margin-top:2px">${b.budget} 点</div>
      ${on ? '<div style="position:absolute;left:20px;right:20px;bottom:-1.5px;height:4px;border-radius:2px;background:var(--acc)"></div>' : ''}`,
      `padding:14px 14px;${on ? 'border-color:var(--line-hi);background:rgba(30,33,36,.8)' : ''}`);
  });
  add(s, X0 + 8 * (W + G) + 8, 830, 1860 - (X0 + 8 * (W + G) + 8), 200, '', `
    <span class="btn small" style="width:100%;margin-bottom:12px">${svg('dice', '#E8E4DC').replace('<svg', '<svg style="width:20px;height:20px;margin-right:8px"')}随机</span>
    <span class="btn main" style="width:100%;height:84px;font-size:30px">开始</span>
    <div class="o" style="font-size:16px;text-align:center;margin-top:10px">开始以后不能再改</div>`);
  return () => character(document.getElementById('ch'), '/assets/textures/entity/survivor/m03.png', 15.5);
}

(async () => {
  await document.fonts.load("26px 'AFL Sans'");
  const after = ({A1: newWorldA, A2: survivorA, B1: newWorldB, B2: survivorB})[S]();
  if (after) await after();
  document.body.dataset.ready = '1';
})();
</script>
