<!doctype html><html><head><meta charset="utf-8"><title>Town Buildings Sheets</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #ecebe6; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; color: #24282b; }
  .sheet { width: 1600px; height: 1000px; padding: 26px 30px; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; gap: 18px; border-bottom: 2px solid #24282b; padding-bottom: 8px; }
  header h1 { font-size: 26px; margin: 0; font-weight: 700; }
  header .sub { font-size: 15px; color: #5c6266; }
  header .tag { margin-left: auto; font-size: 13px; color: #fff; background: #8a4b2e; padding: 3px 10px; border-radius: 3px; }
  .row { display: flex; gap: 14px; min-height: 0; }
  .fig { position: relative; background: #d9dcdc; border-radius: 4px; overflow: hidden; }
  .fig img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fig .cap { position: absolute; left: 0; top: 0; background: rgba(36, 40, 43, .82); color: #fff; font-size: 14px; padding: 4px 10px; border-bottom-right-radius: 4px; }
  .fig .rec { position: absolute; right: 8px; top: 8px; background: #2f6b45; color: #fff; font-size: 14px; padding: 3px 10px; border-radius: 3px; font-weight: 700; }
  .card { background: #fff; border-radius: 4px; padding: 12px 14px; font-size: 14px; line-height: 1.55; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card ul { margin: 0; padding-left: 18px; }
  .card li { margin: 1px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; background: #fff; }
  th, td { border: 1px solid #c9cbc8; padding: 5px 8px; text-align: left; vertical-align: top; line-height: 1.45; }
  th { background: #3a4044; color: #fff; font-weight: 600; }
  td.k { background: #f2f1ec; font-weight: 600; white-space: nowrap; }
  .good { color: #2f6b45; font-weight: 700; } .warn { color: #9a5a1e; font-weight: 700; }
  .plan { background: #fff; border-radius: 4px; padding: 6px; display: flex; flex-direction: column; }
  .plan .t { font-size: 14px; font-weight: 700; padding: 2px 6px 4px; }
  .plan svg { flex: 1; min-height: 0; }
  .note { font-size: 13px; color: #5c6266; }
</style></head><body>
<div id="root"></div>
<script>
const Q = new URLSearchParams(location.search), N = +(Q.get('sheet') || 1);
const R = n => `../renders/${n}.png`;
const fig = (n, cap, style, o) => `<div class="fig" style="${style}"><img src="${R(n)}" style="object-position:${(o && o.pos) || 'center'}">${cap ? `<div class="cap">${cap}</div>` : ''}${o && o.rec ? `<div class="rec">${o.rec}</div>` : ''}</div>`;
const head = (t, sub) => `<header><h1>${t}</h1><span class="sub">${sub}</span><span class="tag">概念阶段 · 没有实现 · 没进游戏</span></header>`;

// ------------------------------------------------------------------ floor plans
// rooms: [label, [[x0, z0, x1, z1], ...]]; doors: [x, z, 'h'|'v', width]; the street is at the bottom (z = 0 front),
// x is mirrored so the plan reads like the street elevation (lot x = 0 on the right)
function plan(title, P) {
  const pad = 1.4, zm = P.zmin || 0, W = P.w + pad * 2, H = P.d - zm + pad * 2 + 1.2, X = x => pad + (P.w - x), Y = z => pad + (P.d - z);
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, sans-serif">`;
  const rect = (r, fill, stroke, sw, dash) => `<rect x="${X(r[2])}" y="${Y(r[3])}" width="${r[2] - r[0]}" height="${r[3] - r[1]}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
  for (let x = 0; x <= P.w; x++) s += `<line x1="${X(x)}" y1="${Y(P.d)}" x2="${X(x)}" y2="${Y(P.zmin || 0)}" stroke="#eceae4" stroke-width="0.04"/>`;
  for (let z = P.zmin || 0; z <= P.d; z++) s += `<line x1="${X(P.w)}" y1="${Y(z)}" x2="${X(0)}" y2="${Y(z)}" stroke="#eceae4" stroke-width="0.04"/>`;
  for (const [, rs, c] of P.rooms) for (const r of rs) s += rect(r, c || '#f6f3ea', 'none', 0);
  for (const r of (P.out || [])) s += rect(r, '#ebe8de', '#8b8f8c', 0.06, '0.3 0.2');
  for (const [, rs, , open] of P.rooms) if (!open) for (const r of rs) s += rect(r, 'none', '#4a4f52', 0.12);
  for (const r of P.shell) s += rect(r, 'none', '#24282b', 0.36);
  for (const [x, z, o, w] of P.doors || []) s += o === 'h' ? `<rect x="${X(x + w / 2)}" y="${Y(z) - 0.25}" width="${w}" height="0.5" fill="#fff"/><line x1="${X(x + w / 2)}" y1="${Y(z)}" x2="${X(x - w / 2)}" y2="${Y(z)}" stroke="#b5492f" stroke-width="0.1"/>`
    : `<rect x="${X(x) - 0.25}" y="${Y(z + w / 2)}" width="0.5" height="${w}" fill="#fff"/><line x1="${X(x)}" y1="${Y(z + w / 2)}" x2="${X(x)}" y2="${Y(z - w / 2)}" stroke="#b5492f" stroke-width="0.1"/>`;
  for (const [x, z, o, w] of P.wins || []) s += o === 'h' ? `<line x1="${X(x + w / 2)}" y1="${Y(z)}" x2="${X(x - w / 2)}" y2="${Y(z)}" stroke="#6fa8c8" stroke-width="0.22"/>`
    : `<line x1="${X(x)}" y1="${Y(z + w / 2)}" x2="${X(x)}" y2="${Y(z - w / 2)}" stroke="#6fa8c8" stroke-width="0.22"/>`;
  for (const [a, b] of P.dash || []) s += `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" stroke="#9a5a1e" stroke-width="0.08" stroke-dasharray="0.25 0.18"/>`;
  for (const [x0, z0, x1, z1, n] of P.stairs || []) { s += rect([x0, z0, x1, z1], '#e3ddd0', '#6a6e70', 0.06); for (let k = 1; k < n; k++) { const z = z0 + (z1 - z0) * k / n; s += `<line x1="${X(x1)}" y1="${Y(z)}" x2="${X(x0)}" y2="${Y(z)}" stroke="#6a6e70" stroke-width="0.05"/>`; } }
  for (const [label, rs, , , lp] of P.rooms) { const r = rs[0], cx = lp ? lp[0] : (r[0] + r[2]) / 2, cz = lp ? lp[1] : (r[1] + r[3]) / 2, a = Math.round((r[2] - r[0]) * (r[3] - r[1]) + (rs[1] ? (rs[1][2] - rs[1][0]) * (rs[1][3] - rs[1][1]) : 0));
    // shrink the label to fit narrow rooms (CJK ~1 em per character, Latin ~0.55 em)
    const em = [...label].reduce((n, c) => n + (c.charCodeAt(0) > 255 ? 1 : 0.55), 0), fs = Math.min(0.62, (r[2] - r[0] - 0.4) / em), small = r[3] - r[1] < 1.6;
    s += `<text x="${X(cx)}" y="${Y(cz) + (small ? 0.2 : 0)}" font-size="${fs}" text-anchor="middle" fill="#24282b" font-weight="700">${label}</text>`;
    if (!P.noArea && !small) s += `<text x="${X(cx)}" y="${Y(cz) + fs + 0.15}" font-size="${Math.min(0.46, fs * 0.8)}" text-anchor="middle" fill="#6a6e70">${a} m²</text>`; }
  for (const [x, z, t] of P.labels || []) s += `<text x="${X(x)}" y="${Y(z)}" font-size="0.5" text-anchor="middle" fill="#9a5a1e">${t}</text>`;
  s += `<text x="${X(P.w / 2)}" y="${Y(P.zmin || 0) + 1.1}" font-size="0.55" text-anchor="middle" fill="#5c6266">▼ 街道（正面） · 网格 1 m = 1 格</text></svg>`;
  return `<div class="plan" style="${P.style || ''}"><div class="t">${title}</div>${s}</div>`;
}
const PLAN = {
  A: { w: 13, d: 10, zmin: -2, shell: [[0, 0, 13, 10], [0, -2, 5, 0]],

      ['卧室 2', [[7, 5, 10, 10]]], ['卫生间 / 洗衣', [[10, 5, 13, 10]], '#eef1f1']],

    rooms: [['起居室', [[0, 0, 5, 9]]], ['门厅 / 楼梯', [[5, 0, 7, 5]], '#efece4', false, [6, 3.6]], ['卧室 1', [[7, 0, 11, 5]]], ['厨房', [[7, 5, 11, 9]]], ['卫生间', [[5, 5, 7, 9]], '#eef1f1']],
    stairs: [[5.3, 0.3, 6.7, 3.0, 8]], doors: [[6, 0, 'h', 1], [5, 2.5, 'v', 1.2], [7, 3.8, 'v', 0.9], [6, 5, 'h', 0.8], [9, 5, 'h', 1.0], [8.5, 9, 'h', 0.9]],
    wins: [[1.5, 0, 'h', 1], [3.6, 0, 'h', 1], [7.6, 0, 'h', 1], [9.6, 0, 'h', 1], [0, 3, 'v', 1], [0, 6.5, 'v', 1], [11, 2.5, 'v', 1], [10, 9, 'h', 1], [2.5, 9, 'h', 1.2]] },
  B2: { w: 11, d: 9, shell: [[0, 0, 11, 9]],
    rooms: [['卧室 2', [[0, 0, 4.6, 9]]], ['楼梯厅', [[4.6, 0, 6.6, 5]], '#efece4', false, [5.6, 4.2]], ['储藏', [[4.6, 5, 6.6, 9]], '#efece4'], ['卧室 3', [[6.6, 0, 11, 9]]]],
    stairs: [[4.9, 0.3, 6.3, 3.0, 8]], doors: [[4.6, 3.8, 'v', 0.9], [6.6, 3.8, 'v', 0.9], [5.6, 5, 'h', 0.8]],
    wins: [[2.3, 0, 'h', 1], [8.8, 0, 'h', 1], [0, 4.5, 'v', 1], [11, 4.5, 'v', 1]],
    dash: [[[0, 1.6], [11, 1.6]], [[0, 7.4], [11, 7.4]]] },
  C: { w: 14, d: 9, shell: [[3, 0, 14, 9]], out: [[0, 0, 3, 9]],
    rooms: [['起居室', [[3, 0, 11, 5]]], ['厨房 / 餐厅', [[3, 5, 7, 9]]], ['卧室 1', [[11, 0, 14, 5]]], ['走廊', [[7, 5, 9.5, 6]], '#efece4', false],
      ['卫生间', [[7, 6, 9.5, 9]], '#eef1f1'], ['卧室 2', [[9.5, 5, 14, 9]]]],
    doors: [[11.6, 0, 'h', 1], [3, 7.5, 'v', 0.9], [11, 3.5, 'v', 0.9], [8.2, 5, 'h', 1.2], [8.2, 6, 'h', 0.8], [9.5, 5.5, 'v', 0.8]],
    wins: [[7.6, 0, 'h', 3.4], [5.5, 0, 'h', 0.6], [9.7, 0, 'h', 0.6], [13.0, 0, 'h', 1.2], [14, 2.5, 'v', 1.2], [14, 7, 'v', 1.2], [5, 9, 'h', 1.2], [8.2, 9, 'h', 0.6], [11.7, 9, 'h', 1.2]],
    labels: [[1.5, 4.5, '车棚']] },
  SA: { w: 12, d: 22, shell: [[0, 0, 12, 22]], noArea: false,
    rooms: [['营业厅', [[2, 0, 12, 15]], '#f6f1e2'], ['楼梯间', [[0, 0, 2, 9]], '#efece4', false, [1, 7.8]], ['卫生间', [[0, 9, 2, 15]], '#eef1f1'], ['后场库房', [[0, 15, 12, 22]], '#ece8dd']],
    stairs: [[0.2, 0.6, 1.8, 6.6, 18]], doors: [[1.15, 0, 'h', 1], [7, 1.2, 'h', 1.1], [7, 15, 'h', 1.6], [1, 15, 'h', 0.8], [10.4, 22, 'h', 1]],
    wins: [[4.3, 0, 'h', 3.6], [9.8, 0, 'h', 3.6], [3, 22, 'h', 0.9], [6, 22, 'h', 0.9]],
    labels: [[7, 0.6, '凹入式入口'], [10.4, 22.9, '后门']], out: [[5.9, 0, 8.1, 1.3]] },
  SA2: { w: 12, d: 22, shell: [[0, 0, 12, 22]],
    rooms: [['起居室', [[2, 0, 12, 7]]], ['卧室 1', [[2, 7, 7, 13]]], ['卧室 2', [[7, 7, 12, 13]]], ['走廊', [[0, 7, 2, 22]], '#efece4', false, [1, 17]],
      ['卫生间', [[2, 13, 6, 17]], '#eef1f1'], ['储藏 / 洗衣', [[2, 17, 6, 22]], '#efece4'], ['厨房 / 餐厅', [[6, 13, 12, 22]]], ['楼梯口', [[0, 0, 2, 7]], '#efece4', false, [1, 6.4]]],
    stairs: [[0.2, 0.4, 1.8, 6.0, 16]], doors: [[2, 3, 'v', 1], [4.5, 7, 'h', 0.9], [2, 8, 'v', 0.9], [9.5, 7, 'h', 0.9], [2, 15, 'v', 0.8], [2, 19, 'v', 0.8], [6, 14, 'v', 0.9], [1.6, 22, 'h', 0.9]],
    wins: [[1.5, 0, 'h', 1], [4.5, 0, 'h', 1], [7.5, 0, 'h', 1], [10.5, 0, 'h', 1], [4, 22, 'h', 0.9], [8.6, 22, 'h', 0.9], [11.0, 22, 'h', 0.9]],
    labels: [[1.6, 22.9, '后门 → 木平台和楼梯']] },
};

const sheets = {
  1: () => head('小住宅 · 三个方向', '住宅街 14 × 16 m 的小住宅地块，1 层，前退界 7.5 m') +
    `<div class="row" style="height:330px">${fig('houses_compare', '同一条街上并排（从左到右：C 小牧场式 · B 科德角式 · A 最简传统式）', 'flex:1')}</div>
    <div class="row" style="height:250px">${fig('hA_front', 'A · 最简传统式', 'flex:1', {rec: '推荐'})}${fig('hB_front', 'B · 科德角式', 'flex:1')}${fig('hC_front', 'C · 小牧场式', 'flex:1')}</div>
    <table><tr><th style="width:120px"></th><th>A · 最简传统式（1935–1950）</th><th>B · 科德角式（1930–1955）</th><th>C · 小牧场式（1950–1965）</th></tr>
    <tr><td class="k">体量</td><td>主体 13 × 10 m，前面凸出 5 × 2 m 的小山墙，1 层</td><td>11 × 9 m，1 层半，楼上两间卧室在坡屋顶下</td><td>11 × 9 m，1 层，旁边 3 m 宽车棚</td></tr>
    <tr><td class="k">屋顶</td><td>侧山墙 1:2（6:12），沥青瓦</td><td>1:1（12:12），两个老虎窗</td><td>1:3（4:12），宽屋檐</td></tr>
    <tr><td class="k">外墙和门窗</td><td>搭接木板，大玻璃窗，门廊台阶加铁栏杆，外墙砖烟囱</td><td>搭接木板，6 格上下推拉窗加百叶窗，三角门罩</td><td>下部 0.9 m 砖墙裙、上部木板，大玻璃窗</td></tr>
    <tr><td class="k">做进游戏</td><td class="good">屋面直接用老宅已有的 1:2 拼块，只要换沥青瓦材质；凸山墙是同一套拼块的小号</td><td class="warn">1:1 屋面要新做一套拼块；老虎窗要单独做</td><td class="warn">1:3 屋面要新做一套拼块；车棚要细柱子</td></tr>
    <tr><td class="k">在镇上的感觉</td><td>中西部小镇最常见的战后小屋，颜色一换就不重样</td><td>更老、更"东部"，适合做少数</td><td>最新，跟加油站 A1 是同一个年代</td></tr></table>

    `<div class="row" style="height:330px">${fig('hA_front', '街上看', 'flex:1.15')}${fig('hA_rear', '后院看：后门、厨房窗、侧窗', 'flex:1')}</div>

      <div style="flex:1.25;display:flex;flex-direction:column;gap:14px">${fig('el_hA', '正立面（正交）', 'height:250px', {})}
