async function build() {

    if (c.b === 'planks') { const t = 'apocalypse_firstlight:block/wood/white_oak_planks'; cube(t, x, y, z, [t, t, t, t, t, t]); continue; }

  for (const [k, c] of G) if (c.b === 'fence') {

    const straightX = isF(1, 0) && isF(-1, 0) && !isF(0, 1) && !isF(0, -1), straightZ = isF(0, 1) && isF(0, -1) && !isF(1, 0) && !isF(-1, 0);
    const postOn = !(straightX || straightZ) || ((x + z) % 3 + 3) % 3 === 0;
    if (postOn) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.075, 1.25, 0.075), post); m.position.set(x + 0.5, y + 0.625, z + 0.5); m.castShadow = true; scene.add(m); }
