function ribbon(sc,Hf,P,w,m,tile,dy,off){off=off||0;const pos=[],uv=[],idx=[];let s=0;

function sheet(name,title,rows){const SW=2400,HD=96,CAP=58;const lay=rows.map(row=>{const asp=row.reduce((s,[c])=>s+c.width/c.height,0);return {row,h:Math.round(SW/asp)};});
 const TH=HD+lay.reduce((s,l)=>s+l.h+CAP,0);const [c,g]=cv(SW,TH,'#1e1f21');label(g,title,36,HD/2+2,{s:44,b:true,c:'#ece7dc',halo:false});

 let y=HD;for(const {row,h} of lay){let x=0;for(const [cc,cap] of row){const w=Math.round(cc.width/cc.height*h);g.drawImage(cc,x,y,w,h);g.fillStyle='#26282b';g.fillRect(x,y+h,w,CAP);

 return save(name,c).then(()=>name+' '+SW+'x'+TH);}
