<!doctype html>
<html><head><meta charset="utf-8"><title>Wood Furniture preview</title>
<style>html,body{margin:0;background:#9fb0b8;overflow:hidden}canvas{display:block}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head><body>
<script>
// Wood Furniture V1, M2.1 (docs/models/wood_furniture_v1.md): an offline look at the generated furniture pieces
// (tools/build-wood-furniture-v1.mjs) against the cabin's log wall on a white oak planks floor (design use only, not a game
// asset). Served by m1_source/serve.cjs at /repo/design/buildings/forest_start_home_v1/m2_source/furniture_preview.html;
// saves go to m1_sheets/ and are moved to m2_sheets/.
// Plain sun + sky, no light map, no normal maps; nearest texel filtering as in game. No guns on the rack (GeckoLib models).
const A = '/repo/src/main/resources/assets/apocalypse_firstlight/';
const W = 1600, H = 1000;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xa9bcc6);
scene.add(new THREE.HemisphereLight(0xe6ecef, 0x6a5e4c, 0.8));
const sun = new THREE.DirectionalLight(0xfff1dc, 0.95); sun.position.set(-6, 12, -9); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, {left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40}); sun.shadow.bias = -0.0004;
scene.add(sun);

// cells: north = -z. A log wall along x at z 2 (y 0..2), the oak floor at y -1; the furniture at y 0 in front of the wall,
// the tables and chairs out in the room.
const P = [];   // [piece, turn, x, y, z]
const T = {north: 0, east: 1, south: 2, west: 3};
P.push(['furniture/counter_body', 0, 0, 0, 1], ['furniture/counter_doors_closed', 0, 0, 0, 1]);
P.push(['furniture/sink_body', 0, 1, 0, 1], ['furniture/counter_doors_closed', 0, 1, 0, 1]);
P.push(['furniture/counter_body', 0, 2, 0, 1], ['furniture/counter_doors_open', 0, 2, 0, 1]);
P.push(['furniture/sink_body', 0, 4, 0, 1], ['furniture/counter_doors_open', 0, 4, 0, 1]);
P.push(['furniture/gun_rack', 0, 6, 1, 1]);
P.push(['furniture/table_z_1', 0, 9, 0, -1], ['furniture/table_z_4', 0, 9, 0, -2]);
P.push(['furniture/chair', T.east, 8, 0, -1], ['furniture/chair', T.east, 8, 0, -2], ['furniture/chair', T.west, 10, 0, -1], ['furniture/chair', T.west, 10, 0, -2]);
P.push(['furniture/table_x_0', 0, 6, 0, -2], ['furniture/chair', T.south, 6, 0, -3], ['furniture/chair', T.north, 5, 0, -1]);
const WALL = [];
for (let x = -1; x <= 11; x++) for (let y = 0; y <= 2; y++) WALL.push([x, y, 2]);

const loader = new THREE.TextureLoader(), texCache = new Map(), matCache = new Map(), pieceCache = new Map();
const texPath = id => id.replace('apocalypse_firstlight:', A + 'textures/') + '.png';
function texture(id) {
  if (!texCache.has(id)) {
    const t = loader.load(texPath(id)); t.flipY = false; t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearMipmapLinearFilter; texCache.set(id, t);
  }
  return texCache.get(id);
}
function material(id) {
  if (!matCache.has(id)) {
    const n = id.split('/').pop(), opts = {map: texture(id), roughness: 0.82, metalness: 0};
    if (/iron|cast/.test(n)) opts.roughness = 0.55;
    if (/enamel/.test(n)) opts.roughness = 0.25;
    if (/^wood(_v|_top|_panel)?$/.test(n)) opts.roughness = 0.6;
    matCache.set(id, new THREE.MeshStandardMaterial(opts));
  }
  return matCache.get(id);
}
async function piece(name) {
  if (!pieceCache.has(name)) pieceCache.set(name, fetch(A + 'cabin_mesh/' + name + '.json').then(r => { if (!r.ok) throw new Error('missing piece ' + name); return r.json(); }));
  return pieceCache.get(name);
}
const buckets = new Map();
function emit(texId, pts, uvs, nrm) {
  if (!buckets.has(texId)) buckets.set(texId, {p: [], uv: [], n: []});
  const b = buckets.get(texId);
  for (const i of [0, 1, 2, 0, 2, 3]) { b.p.push(...pts[i]); b.uv.push(...uvs[i]); b.n.push(...nrm[i]); }
}
function turnP([x, y, z], r) { for (let i = 0; i < r; i++) [x, z] = [1 - z, x]; return [x, y, z]; }
function turnN([x, y, z], r) { for (let i = 0; i < r; i++) [x, z] = [-z, x]; return [x, y, z]; }
async function addPiece(name, r, ox, oy, oz) {
  const pc = await piece(name);
  for (const q of pc.quads) {
    const t = pc.textures[q[0]], pts = [], uvs = [], nrm = [];
    for (let i = 0; i < 4; i++) {
      const o = 1 + i * 8, p = turnP([q[o], q[o + 1], q[o + 2]], r);
      pts.push([p[0] + ox, p[1] + oy, p[2] + oz]); uvs.push([q[o + 3], q[o + 4]]); nrm.push(turnN([q[o + 5], q[o + 6], q[o + 7]], r));
    }
    emit(t, pts, uvs, nrm);
  }
}
async function build() {
  const jobs = P.map(([n, r, x, y, z]) => addPiece(n, r, x, y, z));
  for (const [x, y, z] of WALL) jobs.push(addPiece('log_wall/run_x', 0, x, y, z));
  await Promise.all(jobs);
  for (const [t, b] of buckets) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(b.p, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2)); g.setAttribute('normal', new THREE.Float32BufferAttribute(b.n, 3));
    const m = new THREE.Mesh(g, material(t)); m.castShadow = m.receiveShadow = true; scene.add(m);
  }
  const fl = material('apocalypse_firstlight:block/wood/white_oak_planks');
  fl.map.wrapS = fl.map.wrapT = THREE.RepeatWrapping; fl.map.repeat.set(14, 9);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 9), fl); floor.rotation.x = -Math.PI / 2; floor.position.set(5, 0, -2.5); floor.receiveShadow = true; scene.add(floor);
}
const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 200);
const VIEWS = {
  all: [[3.5, 3.4, -6.8], [4.5, 0.6, 0.6], 44],
  counters: [[1.4, 2.0, -2.4], [2.4, 0.6, 1.4], 46],
  sink: [[3.9, 1.85, -0.75], [4.5, 0.75, 1.6], 50],
  under: [[4.5, 0.55, -0.9], [4.5, 0.42, 1.5], 50],
  rack: [[6.5, 1.55, -1.3], [6.5, 1.45, 1.8], 44],
  dining: [[11.4, 1.9, -4.6], [9.2, 0.45, -1.4], 44],
  chair: [[4.1, 1.2, -3.6], [5.7, 0.55, -1.3], 40],
};
function view(name) { const [p, t, fov] = VIEWS[name]; camera.position.set(...p); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(...t); renderer.render(scene, camera); }
async function save(name) {
  const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
  await fetch('/save?name=' + name, {method: 'POST', body: blob});
}
window.renderAll = async (prefix = 'm2_1_') => { for (const v of Object.keys(VIEWS)) { view(v); await save(prefix + v + '.png'); } return 'saved'; };
window.view = view;
build().then(() => setTimeout(() => { view('all'); document.title = 'ready'; }, 1500)).catch(e => { document.title = 'error ' + e.message; console.error(e); });
</script>
</body></html>
