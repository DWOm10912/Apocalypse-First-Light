<!doctype html>
<html><head><meta charset="utf-8"><title>Generator inlet preview</title>
<style>html,body{margin:0;background:#555}canvas{display:block}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head><body>
<script>
// Generator Inlet Box V1 (docs/models/generator_inlet_v1.md) game-asset preview: the mesh of tools/build-generator-inlet-v1.mjs
// (meshes/generator_inlet_box.aflmesh.json, LabPBR _s read as roughness / metal) on a plain wall, hood shut with the cord in
// use and hood open with the cord coiled, plus the L14-30P plug OBJ. Design use only. Served by m1_source/serve.cjs at
// /repo/design/buildings/forest_start_home_v1/m2_source/inlet_preview.html; render() saves m1_sheets/m2_4_inlet_game.png (the server writes there; moved to m2_sheets/).
const A_ = '/repo/src/main/resources/assets/apocalypse_firstlight/';
const W = 1600, H = 1000;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.autoClear = false; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const env = new THREE.Scene(), ec = document.createElement('canvas'); ec.width = 16; ec.height = 256;
{ const g = ec.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256); [[0, '#dfe8ee'], [0.45, '#b9c6cc'], [0.55, '#5e624c'], [1, '#2d2a22']].forEach(([t, c]) => gr.addColorStop(t, c)); g.fillStyle = gr; g.fillRect(0, 0, 16, 256); }
const et = new THREE.CanvasTexture(ec); et.encoding = THREE.sRGBEncoding;
env.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.MeshBasicMaterial({map: et, side: THREE.BackSide})));
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(env, 0.02).texture;
scene.background = new THREE.Color(0xa9bcc6);
scene.add(new THREE.HemisphereLight(0xdfe8ee, 0x5d6a4a, 0.6));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.3); sun.position.set(-2, 3, -3); scene.add(sun);
// the wall the box hangs on (block frame: the inlet cell at the origin facing north, the wall at z 1), the ground at y -1
const wall = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.2), new THREE.MeshStandardMaterial({color: 0xb7aa92, roughness: 0.85})); wall.position.set(0.5, 0.5, 1.1); scene.add(wall);
const ground = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 3), new THREE.MeshStandardMaterial({color: 0x4f5c35, roughness: 0.95})); ground.position.set(0.5, -1.05, 0); scene.add(ground);
const loader = new THREE.TextureLoader(), pending = [];
function pbr(id, flip = false) {
  const m = new THREE.MeshStandardMaterial({map: loader.load(A_ + 'textures/block/' + id + '.png'), roughness: 1, metalness: 1});
  m.map.encoding = THREE.sRGBEncoding; m.map.flipY = flip; m.map.magFilter = THREE.NearestFilter;
  pending.push(new Promise(res => { const img = new Image(); img.onload = () => {
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
    for (let i = 0; i < p.length; i += 4) { const s = p[i] / 255, rough = Math.max(0.05, (1 - s) * (1 - s)); p[i + 2] = p[i + 1] >= 230 ? 255 : 0; p[i] = 0; p[i + 1] = Math.round(rough * 255); p[i + 3] = 255; }
    g.putImageData(d, 0, 0); const t = new THREE.CanvasTexture(c); t.flipY = flip; t.magFilter = THREE.NearestFilter; m.roughnessMap = m.metalnessMap = t; m.needsUpdate = true; res(); };
    img.src = A_ + 'textures/block/' + id + '_s.png'; }));
  return m;
}
const MAT = pbr('generator_inlet_box');
let MESH = null, GEO = null;
/** The inlet mesh with the hood at `deg` and the coil shown or not (block frame 0..1). */
function inlet(deg, coil) {
  const bones = new Map(GEO['minecraft:geometry'][0].bones.map(b => [b.name, b])), pos = [], uv = [], idx = [], a = deg * Math.PI / 180;
  let base = 0;
  for (const p of MESH.parts) {
    if (p.bone === 'coil' && !coil) continue;
    const b = bones.get(p.bone), pv = [-b.pivot[0] / 16, b.pivot[1] / 16, b.pivot[2] / 16];
    for (const v of p.vertices) {
      let [x, y, z] = v; if (p.bone === 'hood') [y, z] = [y * Math.cos(a) - z * Math.sin(a), y * Math.sin(a) + z * Math.cos(a)];
      pos.push(pv[0] + x + 0.5, pv[1] + y, pv[2] + z + 0.5); uv.push(v[3], v[4]);
    }
    for (const f of p.faces) for (let i = 1; i + 1 < f.length; i++) idx.push(base + f[0], base + f[i], base + f[i + 1]);
    base += p.vertices.length;
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals(); return new THREE.Mesh(g, MAT);
}
// the in-use cord as the game draws it: from the connector's tail (EXIT, EXIT_DIR of the generator) down to the ground
function cordRun() {
  const e = new THREE.Vector3(0.5, 5.622928 / 16, 5.6112 / 16 + 0.5), d = new THREE.Vector3(0, -0.866025, -0.5);
  const pts = [e, e.clone().addScaledVector(d, 0.1), new THREE.Vector3(0.5, -0.6, 0.05), new THREE.Vector3(0.52, -0.99, -0.3), new THREE.Vector3(0.6, -0.99, -1.2)];
  return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 80, 0.0105, 10), new THREE.MeshStandardMaterial({color: new THREE.Color(0xdcae22).convertSRGBToLinear(), roughness: 0.62}));
}
const views = [];
function view(x, y, w, h, eye, at, fov, objs) { views.push({x, y, w, h, eye, at, fov, objs}); }
async function render() {
  [MESH, GEO] = await Promise.all([fetch(A_ + 'meshes/generator_inlet_box.aflmesh.json').then(r => r.json()), fetch(A_ + 'geo/generator_inlet_box.geo.json').then(r => r.json())]);
  const plugText = await (await fetch(A_ + 'models/block/l14_30_plug.obj')).text(), plug = new THREE.OBJLoader().parse(plugText);
  const pm = pbr("generator_inlet_box", true);
  plug.traverse(o => { if (o.isMesh) o.material = pm; });
  await Promise.all(pending);
  const closed = [inlet(0, false), cordRun()], open = [inlet(100, true)];
  plug.position.set(-0.5, -0.5, -0.5); const pg = new THREE.Group(); pg.add(plug); pg.position.set(0.5, 0.2, -0.6); pg.rotation.set(0.3, 2.4, 0);
  view(0, 0, 800, 500, [0.15, 0.62, -0.55], [0.5, 0.42, 0.85], 34, closed);
  view(800, 0, 800, 500, [0.0, 0.55, -0.6], [0.5, 0.36, 0.9], 40, open);
  view(0, 500, 800, 500, [1.25, 0.5, 0.2], [0.5, 0.42, 0.88], 32, closed);
  view(800, 500, 800, 500, [0.5 + 0.18, 0.2 + 0.05, -0.6 - 0.12], [0.5, 0.2, -0.6], 40, [pg]);
  renderer.clear();
  for (const v of views) {
    const cam = new THREE.PerspectiveCamera(v.fov, v.w / v.h, 0.01, 50); cam.position.set(...v.eye); cam.lookAt(...v.at);
    const g = new THREE.Group(); v.objs.forEach(o => g.add(o)); scene.add(g);
    renderer.setViewport(v.x, H - v.y - v.h, v.w, v.h); renderer.setScissor(v.x, H - v.y - v.h, v.w, v.h); renderer.setScissorTest(true);
    renderer.render(scene, cam); scene.remove(g);
  }
  const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
  await fetch('/save?name=m2_4_inlet_game.png', {method: 'POST', body: blob});
  return 'saved';
}
window.done = render();
</script></body></html>
