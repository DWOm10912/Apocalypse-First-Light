  for (const c of data.cells) { if (c.k < 0) continue; const [id, p] = parseState(c.s), cell = cellOf(id, p); if (cell) G.set(K(c.X, c.k, c.Z), cell); }
  for (const f of data.fixtures) {
    const n = f.block_id.replace('apocalypse_firstlight:', ''), [x, y, z] = f.at;
    if (n === 'box_stove') G.set(K(x, y, z), {b: 'stove', facing: f.facing});
    if (n === 'wooden_kitchen_counter' || n === 'wooden_sink_counter') G.set(K(x, y, z), {b: 'counter', facing: f.facing, sink: n.includes('sink')});
    if (n === 'wooden_gun_rack') G.set(K(x, y, z), {b: 'rack', facing: f.facing});
  }
  const planks = material('apocalypse_firstlight:block/wood/white_oak_planks');
  const grassTop = new THREE.MeshStandardMaterial({map: groundTex.clone(), roughness: 1}), dirt = new THREE.MeshStandardMaterial({color: new THREE.Color(0x5b4632).convertSRGBToLinear(), roughness: 1});
  grassTop.map.repeat.set(0.25, 0.25);
  const fe = 'apocalypse_firstlight:block/cabin/firewood_end', fs = 'apocalypse_firstlight:block/cabin/firewood_side';
  const jobs = [];
  for (const [k, c] of G) {
    const [x, y, z] = k.split(',').map(Number);
    if (c.b === 'stone' || c.b === 'flag') { macroBlock(x, y, z, c.b === 'flag'); continue; }
    if (c.b === 'planks') { cube(x, y, z, planks); continue; }
    if (c.b === 'grass') { cube(x, y, z, [dirt, dirt, grassTop, dirt, dirt, dirt]); continue; }
    if (c.b === 'fire') { const E = material(fe), S = material(fs); cube(x, y, z, c.axis === 'x' ? [E, E, S, S, S, S] : c.axis === 'z' ? [S, S, S, S, E, E] : [S, S, E, E, S, S]); continue; }
    for (const [name, r] of choose(x, y, z, c)) jobs.push(addPiece(name, r, x, y, z));
  }
  await Promise.all(jobs);
  for (const [t, b] of buckets) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(b.p, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2)); g.setAttribute('normal', new THREE.Float32BufferAttribute(b.n, 3));
    const m = new THREE.Mesh(g, material(t)); m.castShadow = !/glass/.test(t); m.receiveShadow = true; house.add(m);
  }
}

function setSwitch(variant, on, x = 9, k = 2, z = 9, facing = 'north') {
  sw.group.clear();
  if (!variant) return;
  const holder = new THREE.Group(), inner = new THREE.Group();
  const [pw, ph] = SW.plate, padW = S(pw) + 0.04, padH = S(ph) + 0.04;
  const pad = rbox(-padW / 2, padW / 2, -padH / 2, padH / 2, -0.08, 0, material('apocalypse_firstlight:block/cabin/oak_trim_v'), 0.002);
  inner.add(pad);
  const dev = variant.make(on); inner.add(dev);
  inner.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
  inner.rotation.y = Math.PI; inner.position.set(0.5, SW.centreY, 1 - 0.08);   // block frame: wall at z 1, front toward -z
  holder.add(inner);
  sw.group.add(placeBlock(holder, x, k, z, facing));
}
