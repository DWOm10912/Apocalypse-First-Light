<script>
// Forest start home B, M2 F1 (docs/worldgen/forest_start_home_b_v1_plan.md): concept round for the cast-iron box stove
// (user 2026-10-13: "做铸铁箱式炉，先出概念图"). Design use only, not a game asset. Two candidates in the cabin's stove
// corner, built from the real cabin pieces (log wall, white oak floor, stove pipe, chairs) around a procedural stove:
//   A  old long box stove: long axis along the wall, loading door on the east end, one cook lid, four cast legs; fits the
//      existing 3 x 1 hearth and the centred pipe.
//   B  compact upright box stove: door toward the room, ash drawer, flat cook top; needs the hearth one row deeper.
// Real constraints (2026-10-13 research): 6" (15 cm) flue = the existing stove_pipe; the log wall bulges 7 cm into the
// stove cell, so the stove back is ~31 cm from the logs: legal only with a ventilated heat shield (sheet on 2.5 cm
// standoffs, open at the bottom: 36" -> 12"); non-combustible floor 45 cm (18") in front of the loading door.
// Served by m1_source/serve.cjs at /repo/design/buildings/forest_start_home_v1/m2_source/stove_concepts.html;
// window.renderSheets() saves the sheets to m1_sheets/ (moved to m2_sheets/ by hand): m2_2_stove_A / _B / _compare.png.
const A_ = '/repo/src/main/resources/assets/apocalypse_firstlight/';
const FONT = '"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif';
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85;
renderer.physicallyCorrectLights = false;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
// Everything below is built in a design frame (wall at +z, room at -z) and shown through root, which mirrors z about 1 so
// the picture matches the house: north wall at z 0..1, stove cell z 1, room toward +z, east (+x) on the right when
// looking at the wall. Camera and annotation points are written in the design frame and go through W().
const root = new THREE.Group(); root.scale.z = -1; root.position.z = 2; scene.add(root);
const W = p => [p[0], p[1], 2 - p[2]];

// ---------------------------------------------------------------- environment (so the iron picks up soft highlights)
{
  const env = new THREE.Scene();
  const c = document.createElement('canvas'); c.width = 16; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#d9d4ca'); gr.addColorStop(0.45, '#bfb6a6'); gr.addColorStop(0.55, '#6a5a46'); gr.addColorStop(1, '#3a3026');
  g.fillStyle = gr; g.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  env.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.MeshBasicMaterial({map: t, side: THREE.BackSide})));
  const win = new THREE.Mesh(new THREE.PlaneGeometry(4, 3), new THREE.MeshBasicMaterial({color: 0xffffff}));
  win.position.set(6, 2, -6); win.lookAt(0, 0, 0); env.add(win);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.02).texture;
}
const hemi = new THREE.HemisphereLight(0xe9e3d8, 0x5b4b39, 0.5); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0dc, 0.85); sun.position.set(13, 4.5, -5.5); sun.target.position.set(8.5, 0.4, 0.4);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0003;
Object.assign(sun.shadow.camera, {left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20});
root.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xcfd8e0, 0.25); fill.position.set(4, 3, -6); root.add(fill);

// ---------------------------------------------------------------- textures and materials
const loader = new THREE.TextureLoader();
function tex(path, rep) {
  const t = loader.load(A_ + 'textures/' + path + '.png'); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.flipY = false;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); }
  return t;
}
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
// flat stone slabs for the hearth (a proposal: the M0 hearth is fieldstone rubble seen from the top)
function flagstone(cols, rows, seed) {
  return canvasTex(cols * 400, rows * 400, (g, w, h) => {
    const r = rng(seed); g.fillStyle = '#5d5850'; g.fillRect(0, 0, w, h);
    const xs = [0]; while (xs[xs.length - 1] < w - 1) xs.push(Math.min(w, xs[xs.length - 1] + 150 + r() * 130));
    if (w - xs[xs.length - 2] < 90) xs.splice(xs.length - 2, 1);
    for (let i = 0; i + 1 < xs.length; i++) {
      let y = 0;
      while (y < h - 1) {
        let y2 = Math.min(h, y + 120 + r() * 120); if (h - y2 < 70) y2 = h;
        const j = () => (r() - 0.5) * 22, x0 = xs[i] + 5, x1 = xs[i + 1] - 5, ya = y + 5, yb = y2 - 5;
        const tone = 118 + r() * 34, warm = r() * 10;
        g.fillStyle = `rgb(${tone + warm},${tone + warm * 0.6 - 3},${tone - 8})`;
        g.beginPath(); g.moveTo(x0 + j(), ya + j()); g.lineTo(x1 + j(), ya + j()); g.lineTo(x1 + j(), yb + j()); g.lineTo(x0 + j(), yb + j()); g.closePath(); g.fill();
        for (let k = 0; k < 900; k++) { g.fillStyle = 'rgba(' + (r() < 0.5 ? '40,36,30' : '210,204,192') + ',' + (0.05 + r() * 0.07) + ')'; g.fillRect(x0 + r() * (x1 - x0), ya + r() * (yb - ya), 1 + r() * 3, 1 + r() * 3); }
        y = y2;
      }
    }
  });
}
const firebrickTex = canvasTex(256, 128, (g, w, h) => {
  g.fillStyle = '#4c3a2a'; g.fillRect(0, 0, w, h); const r = rng(7);
  for (let row = 0; row < 4; row++) for (let col = -1; col < 3; col++) {
    const x = col * 128 + (row % 2) * 64 + 3, y = row * 32 + 3, t = 150 + r() * 30;
    g.fillStyle = `rgb(${t},${t * 0.74},${t * 0.5})`; g.fillRect(x, y, 122, 26);
  }
});
const ashTex = canvasTex(256, 256, (g, w, h) => { const r = rng(3); g.fillStyle = '#4a4744'; g.fillRect(0, 0, w, h); for (let i = 0; i < 500; i++) { const v = 50 + r() * 60; g.fillStyle = `rgb(${v},${v - 2},${v - 5})`; g.fillRect(r() * w, r() * h, 2 + r() * 6, 2 + r() * 6); } });
const emberTex = canvasTex(256, 256, (g, w, h) => { const r = rng(5); g.fillStyle = '#000'; g.fillRect(0, 0, w, h); for (let i = 0; i < 70; i++) { const x = r() * w, y = r() * h, s = 3 + r() * 9, gr = g.createRadialGradient(x, y, 0, x, y, s); gr.addColorStop(0, '#ffb050'); gr.addColorStop(0.5, '#e0501a'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, s, 0, 7); g.fill(); } });
const flameTex = canvasTex(128, 256, (g, w, h) => {
  for (const [cx, sc] of [[64, 1], [40, 0.65], [90, 0.7]]) {
    const gr = g.createRadialGradient(cx, h * 0.92, 2, cx, h * (1 - 0.5 * sc), h * 0.55 * sc);
    gr.addColorStop(0, 'rgba(255,240,200,0.95)'); gr.addColorStop(0.25, 'rgba(255,170,60,0.85)'); gr.addColorStop(0.6, 'rgba(230,80,20,0.45)'); gr.addColorStop(1, 'rgba(120,20,0,0)');
    g.fillStyle = gr; g.beginPath(); g.moveTo(cx - 34 * sc, h); g.quadraticCurveTo(cx - 38 * sc, h * (1 - 0.45 * sc), cx, h * (1 - 0.95 * sc)); g.quadraticCurveTo(cx + 38 * sc, h * (1 - 0.45 * sc), cx + 34 * sc, h); g.fill();
  }
});
const M = {
  iron: new THREE.MeshStandardMaterial({color: 0x2a2c2f, roughness: 0.62, metalness: 0.35, envMapIntensity: 0.9}),
  edge: new THREE.MeshStandardMaterial({color: 0x4c4f54, roughness: 0.42, metalness: 0.6, envMapIntensity: 1.0}),
  pipe: new THREE.MeshStandardMaterial({color: 0x232527, roughness: 0.6, metalness: 0.3, envMapIntensity: 0.8}),
  nickel: new THREE.MeshStandardMaterial({color: 0xc4c2bc, roughness: 0.28, metalness: 1.0}),
  hole: new THREE.MeshStandardMaterial({color: 0x0b0b0b, roughness: 1, metalness: 0}),
  glow: new THREE.MeshBasicMaterial({color: 0xff7a2a}),
  brick: new THREE.MeshStandardMaterial({map: firebrickTex, roughness: 0.95}),
  ash: new THREE.MeshStandardMaterial({map: ashTex, roughness: 1, emissiveMap: emberTex, emissive: 0x000000}),
  flame: new THREE.MeshBasicMaterial({map: flameTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide}),
  shield: new THREE.MeshStandardMaterial({color: 0x6b6f73, roughness: 0.55, metalness: 0.6, envMapIntensity: 0.7}),
  ceramic: new THREE.MeshStandardMaterial({color: 0xe6e1d6, roughness: 0.35}),
  logSide: new THREE.MeshStandardMaterial({map: tex('block/cabin/firewood_side'), roughness: 0.9}),
  logEnd: new THREE.MeshStandardMaterial({map: tex('block/cabin/firewood_end'), roughness: 0.9}),
};
for (const m of Object.values(M)) if (m.color && !m.map) m.color.convertSRGBToLinear();
function mesh(g, m, shadow = true) { const o = new THREE.Mesh(g, m); o.castShadow = shadow; o.receiveShadow = true; return o; }
/** A box x0..x1, y0..y1, z0..z1 with its edges rounded by r (cast iron is never razor sharp). */
function rbox(x0, x1, y0, y1, z0, z1, m, r = 0.003) {
  const w = x1 - x0, h = y1 - y0, d = z1 - z0; r = Math.min(r, w / 3, h / 3, d / 3);
  const s = new THREE.Shape(), x = w / 2 - r, y = h / 2 - r;
  s.moveTo(-x, -y); s.lineTo(x, -y); s.lineTo(x, y); s.lineTo(-x, y); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {depth: Math.max(1e-4, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 2, curveSegments: 2});
  g.translate(0, 0, -(d - 2 * r) / 2);
  const o = mesh(g, m); o.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); return o;
}
/** A cylinder along axis 'x' | 'y' | 'z' centred at c. */
function cyl(r, len, axis, c, m, seg = 32, r2 = r) {
  const o = mesh(new THREE.CylinderGeometry(r2, r, len, seg), m);
  if (axis === 'x') o.rotation.z = -Math.PI / 2; if (axis === 'z') o.rotation.x = Math.PI / 2;
  o.position.set(...c); return o;
}
/** A coil-spring handle (stays cool): a nickel wire helix of length len along axis. */
function coil(len, axis, c) {
  class Helix extends THREE.Curve { getPoint(t) { const a = t * Math.PI * 2 * 10; return new THREE.Vector3(Math.cos(a) * 0.009, t * len - len / 2, Math.sin(a) * 0.009); } }
  const o = mesh(new THREE.TubeGeometry(new Helix(), 400, 0.0017, 6, false), M.nickel);
  if (axis === 'x') o.rotation.z = -Math.PI / 2; if (axis === 'z') o.rotation.x = Math.PI / 2;
  o.position.set(...c); return o;
}
/** A raised cast frame on a panel face: rectangle u0..u1 x v0..v1 in the plane, out = the face's outward axis. */
function frame(out, plane, u0, u1, v0, v1, w = 0.016, t = 0.005) {
  const g = new THREE.Group(), [ax, sign, at] = out;   // e.g. ['z', -1, 0.30]: the face at z 0.30 looking -z
  const f0 = sign < 0 ? at - t : at, f1 = sign < 0 ? at : at + t;
  const strip = (a0, a1, b0, b1) => {
    if (ax === 'z') g.add(rbox(a0, a1, b0, b1, f0, f1, M.edge, 0.002));
    else g.add(rbox(f0, f1, b0, b1, a0, a1, M.edge, 0.002));
  };
  strip(u0, u1, v0, v0 + w); strip(u0, u1, v1 - w, v1); strip(u0, u0 + w, v0 + w, v1 - w); strip(u1 - w, u1, v0 + w, v1 - w);
  return g;
}
/** A spin draft (rosette) on a door face: disc of radius 0.04 facing axis, six holes. */
function spinDraft(axis, sign, c, holes) {
  const g = new THREE.Group(), d = 0.008;
  const at = (k, off) => { const p = [...c]; p[k] += off; return p; };
  const k = axis === 'x' ? 0 : 2;
  g.add(cyl(0.042, d, axis, at(k, sign * d / 2), M.edge, 40));
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2, p = [...c], u = Math.cos(a) * 0.026, v = Math.sin(a) * 0.026;
    p[1] += v; if (axis === 'x') p[2] += u; else p[0] += u; p[k] += sign * (d + 0.0005);
    const h = cyl(0.0065, 0.001, axis, p, M.hole, 16); holes.push(h); g.add(h);
  }
  g.add(cyl(0.011, 0.012, axis, at(k, sign * (d + 0.006)), M.edge, 20));
  return g;
}
/** A cast leg: tapered, splayed out toward (sx, sz), with a pad foot. */
function leg(x, z, h, sx, sz) {
  const g = new THREE.BoxGeometry(0.044, h, 0.044, 1, 4, 1), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const t = (h / 2 - p.getY(i)) / h, s = 1 - 0.3 * t, k = 0.016 * t * t;
    p.setX(i, p.getX(i) * s + sx * k); p.setZ(i, p.getZ(i) * s + sz * k);
  }
  g.computeVertexNormals();
  const o = new THREE.Group(), l = mesh(g, M.iron); l.position.set(x, h / 2, z); o.add(l);
  o.add(rbox(x + sx * 0.016 - 0.024, x + sx * 0.016 + 0.024, 0, 0.012, z + sz * 0.016 - 0.024, z + sz * 0.016 + 0.024, M.iron, 0.003));
  return o;
}
function flames(g, list) { for (const [x, y, z, w, h, ry] of list) { const f = new THREE.Mesh(new THREE.PlaneGeometry(w, h), M.flame); f.position.set(x, y, z); f.rotation.y = ry; f.renderOrder = 10; g.add(f); } }
function logPiece(r, len, axis, c) { const o = mesh(new THREE.CylinderGeometry(r, r, len, 14), [M.logSide, M.logEnd, M.logEnd]); if (axis === 'x') o.rotation.z = -Math.PI / 2; if (axis === 'z') o.rotation.x = Math.PI / 2; o.position.set(...c); return o; }

// ---------------------------------------------------------------- stove A: old long box stove (door on the east end)
// cell frame: x 0..1 along the wall, z 0 room side .. 1 wall side (the logs bulge to 0.93), y up. Flue at the cell centre.
function stoveA() {
  const S = {group: new THREE.Group(), holes: [], fire: new THREE.Group(), door: new THREE.Group()}, g = S.group;
  const X0 = 0.32, X1 = 1.02, Z0 = 0.30, Z1 = 0.62, Y0 = 0.165, Y1 = 0.53, T = 0.012;
  for (const [x, z, sx, sz] of [[0.37, 0.335, -1, -1], [0.97, 0.335, 1, -1], [0.37, 0.585, -1, 1], [0.97, 0.585, 1, 1]]) g.add(leg(x, z, 0.15, sx, sz));
  g.add(rbox(X0 - 0.006, X1 + 0.006, 0.14, Y0, Z0 - 0.006, Z1 + 0.006, M.iron, 0.004));            // bottom plate
  g.add(rbox(X0 - 0.012, X1 + 0.012, Y1, 0.56, Z0 - 0.012, Z1 + 0.012, M.iron, 0.006));            // top plate
  g.add(rbox(X0, X1, Y0, Y1, Z0, Z0 + T, M.iron, 0.002)); g.add(rbox(X0, X1, Y0, Y1, Z1 - T, Z1, M.iron, 0.002));   // long sides
  g.add(rbox(X0, X0 + T, Y0, Y1, Z0, Z1, M.iron, 0.002));                                          // west end
  const OY0 = 0.255, OY1 = 0.435, OZ0 = 0.355, OZ1 = 0.565;                                        // east end, the door opening
  g.add(rbox(X1 - T, X1, Y0, OY0, Z0, Z1, M.iron, 0.002)); g.add(rbox(X1 - T, X1, OY1, Y1, Z0, Z1, M.iron, 0.002));
  g.add(rbox(X1 - T, X1, OY0, OY1, Z0, OZ0, M.iron, 0.002)); g.add(rbox(X1 - T, X1, OY0, OY1, OZ1, Z1, M.iron, 0.002));
  g.add(frame(['z', -1, Z0], 'xy', X0 + 0.025, X1 - 0.025, Y0 + 0.025, Y1 - 0.025));               // raised cast frames
  g.add(frame(['z', 1, Z1], 'xy', X0 + 0.025, X1 - 0.025, Y0 + 0.025, Y1 - 0.025));
  g.add(frame(['x', -1, X0], 'zy', Z0 + 0.025, Z1 - 0.025, Y0 + 0.025, Y1 - 0.025));
  for (const [x, z] of [[X0, Z0], [X1, Z0], [X0, Z1], [X1, Z1]]) g.add(cyl(0.009, Y1 - Y0, 'y', [x, (Y0 + Y1) / 2, z], M.edge, 12));
  for (const x of [X0 + 0.02, X1 - 0.02]) for (const y of [Y0 + 0.02, Y1 - 0.02]) for (const [z, s] of [[Z0, -1], [Z1, 1]]) { const b = mesh(new THREE.SphereGeometry(0.0055, 10, 6), M.edge); b.position.set(x, y, z + s * 0.004); g.add(b); }
  // ash apron under the door
  g.add(rbox(X1, X1 + 0.08, 0.142, 0.16, 0.33, 0.59, M.iron, 0.003)); g.add(rbox(X1 + 0.07, X1 + 0.082, 0.16, 0.172, 0.33, 0.59, M.edge, 0.003));
  // cook lid (lift it with the lifter: the notch), and the flue collar with its flange
  g.add(cyl(0.0905, 0.003, 'y', [0.80, 0.5615, 0.46], M.hole, 48));
  g.add(cyl(0.087, 0.007, 'y', [0.80, 0.5635, 0.46], M.edge, 48));
  g.add(rbox(0.875, 0.888, 0.566, 0.57, 0.455, 0.465, M.hole, 0.001));
  g.add(cyl(0.10, 0.008, 'y', [0.5, 0.564, 0.5], M.edge, 48)); g.add(cyl(0.08, 0.06, 'y', [0.5, 0.59, 0.5], M.iron, 48));
  g.add(cyl(0.0755, 0.38, 'y', [0.5, 0.81, 0.5], M.pipe, 40));                                       // single-wall pipe to the cell top
  g.add(cyl(0.004, 0.2, 'x', [0.5, 0.86, 0.5], M.iron, 8)); g.add(coil(0.045, 'x', [0.62, 0.86, 0.5]));   // damper
  // door: hinged on the wall side (z 0.58), opens toward the wall so the room sees in
  const d = S.door; d.position.set(X1, 0.345, 0.58);
  d.add(rbox(0, 0.015, -0.105, 0.105, -0.24, 0, M.iron, 0.003));
  d.add(frame(['x', 1, 0.015], 'zy', -0.24, 0, -0.105, 0.105, 0.014, 0.004));
  d.add(spinDraft('x', 1, [0.019, 0, -0.12], S.holes));
  d.add(rbox(0.015, 0.042, -0.012, 0.012, -0.226, -0.214, M.iron, 0.002));                         // latch arm
  d.add(coil(0.06, 'y', [0.046, 0, -0.22]));
  for (const y of [-0.07, 0.07]) d.add(cyl(0.008, 0.03, 'y', [0.008, y, 0.002], M.edge, 12));      // hinge knuckles
  g.add(d);
  // inside: firebrick, ash bed with embers, two splits
  g.add(rbox(X0 + 0.02, X1 - 0.02, Y0, 0.40, Z0 + T, Z0 + T + 0.022, M.brick, 0.001));
  g.add(rbox(X0 + 0.02, X1 - 0.02, Y0, 0.40, Z1 - T - 0.022, Z1 - T, M.brick, 0.001));
  g.add(rbox(X0 + T, X0 + T + 0.022, Y0, 0.40, Z0 + T, Z1 - T, M.brick, 0.001));
  g.add(rbox(X0 + T, X1 - T, Y0, 0.19, Z0 + T + 0.022, Z1 - T - 0.022, M.ash, 0.001));
  g.add(logPiece(0.045, 0.44, 'x', [0.70, 0.237, 0.43])); g.add(logPiece(0.038, 0.38, 'x', [0.66, 0.229, 0.52]));
  flames(S.fire, [[0.74, 0.30, 0.47, 0.24, 0.17, Math.PI / 2], [0.62, 0.29, 0.45, 0.22, 0.15, Math.PI / 2], [0.70, 0.29, 0.47, 0.36, 0.13, 0.6]]);
  const lamp = new THREE.PointLight(0xff8a3a, 1.2, 2.6, 2); lamp.position.set(X1 + 0.03, 0.33, 0.46); S.fire.add(lamp);
  g.add(S.fire);
  S.open = a => { d.rotation.y = -a; };
  return S;
}

// ---------------------------------------------------------------- stove B: compact upright box stove (door toward the room)
function stoveB() {
  const S = {group: new THREE.Group(), holes: [], fire: new THREE.Group(), door: new THREE.Group()}, g = S.group;
  const X0 = 0.32, X1 = 0.68, Z0 = 0.12, Z1 = 0.62, Y0 = 0.14, Y1 = 0.60, T = 0.012;
