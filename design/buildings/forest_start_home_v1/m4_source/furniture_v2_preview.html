<!doctype html>
<html><head><meta charset="utf-8"><title>Wood Furniture V2 preview</title>
<style>html,body{margin:0;background:#9fb0b8;overflow:hidden}canvas{display:block}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head><body>
<script>
// Wood Furniture V2 (docs/models/wood_furniture_v2.md, 2026-10-15): an offline look at the generated bedroom and storage
// pieces (tools/build-wood-furniture-v2.mjs) against the cabin's log wall on a white oak planks floor (design use only, not
// a game asset). Served by ../m1_source/serve.cjs at /repo/design/buildings/forest_start_home_v1/m4_source/furniture_v2_preview.html;
// saves go to m1_sheets/ and are moved to m4_sheets/. Plain sun + sky, no normal maps, nearest texels as in game. No
// items on the tool rack (items are drawn in game only).
const A = '/repo/src/main/resources/assets/apocalypse_firstlight/';
const W = 1600, H = 1000;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xa9bcc6);
scene.add(new THREE.HemisphereLight(0xe6ecef, 0x6a5e4c, 0.8));
const sun = new THREE.DirectionalLight(0xfff1dc, 0.95); sun.position.set(-6, 12, -9); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, {left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50}); sun.shadow.bias = -0.0004;
sun.target.position.set(8, 0, 0); scene.add(sun.target);
scene.add(sun);

// cells: north = -z; the log wall along x at z 2 (y 0..2), everything in front of it facing north
const P = [];   // [piece, turn, x, y, z]
const F = 'furniture/';
P.push([F + 'bed_head', 0, 0, 0, 1], [F + 'bed_foot', 0, 0, 0, 0]);
P.push([F + 'chest_body_left', 0, 0, 0, -1], [F + 'chest_body_right', 0, 1, 0, -1], [F + 'chest_lid_closed_left', 0, 0, 0, -1], [F + 'chest_lid_closed_right', 0, 1, 0, -1]);
P.push([F + 'nightstand_body', 0, 1, 0, 1], [F + 'nightstand_drawer_closed', 0, 1, 0, 1]);
for (const n of ['radio/body', 'radio/dial_off', 'radio/slider_off', 'radio/crank_0']) P.push([n, 0, 1, 0.66, 1]);
for (const [x, s] of [[3, 'closed'], [4, 'open']]) P.push([F + 'wardrobe_body_lower', 0, x, 0, 1], [F + 'wardrobe_body_upper', 0, x, 1, 1],
  [F + `wardrobe_doors_${s}_lower`, 0, x, 0, 1], [F + `wardrobe_doors_${s}_upper`, 0, x, 1, 1]);
P.push([F + 'tool_rack', 0, 6, 1, 1]);
P.push([F + 'nightstand_body', 0, 7, 0, 1], [F + 'nightstand_drawer_open', 0, 7, 0, 1]);
P.push([F + 'chest_body_left', 0, 8, 0, 1], [F + 'chest_body_right', 0, 9, 0, 1], [F + 'chest_lid_open_left', 0, 8, 0, 1], [F + 'chest_lid_open_right', 0, 9, 0, 1]);
P.push([F + 'chest_body_left', 0, 10, 0, 1], [F + 'chest_body_right', 0, 11, 0, 1], [F + 'chest_lid_closed_left', 0, 10, 0, 1], [F + 'chest_lid_closed_right', 0, 11, 0, 1]);
P.push([F + 'freezer_body_left', 0, 12, 0, 1], [F + 'freezer_body_right', 0, 13, 0, 1], [F + 'freezer_lid_closed_left', 0, 12, 0, 1],
  [F + 'freezer_lid_closed_right', 0, 13, 0, 1], [F + 'freezer_lamp_lit', 0, 12, 0, 1]);
P.push([F + 'freezer_body_left', 0, 15, 0, 1], [F + 'freezer_body_right', 0, 16, 0, 1], [F + 'freezer_lid_open_left', 0, 15, 0, 1],
  [F + 'freezer_lid_open_right', 0, 16, 0, 1], [F + 'freezer_lamp_off', 0, 15, 0, 1]);
const WALL = [];
for (let x = -1; x <= 17; x++) for (let y = 0; y <= 2; y++) WALL.push([x, y, 2]);

const loader = new THREE.TextureLoader(), texCache = new Map(), matCache = new Map(), pieceCache = new Map();
const texPath = id => id.replace('apocalypse_firstlight:', A + 'textures/') + '.png';
function texture(id) {
  if (!texCache.has(id)) {
    const t = loader.load(texPath(id)); t.flipY = false; t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearMipmapLinearFilter; texCache.set(id, t);
  }
  return texCache.get(id);
}
function material(id) {
  if (!matCache.has(id)) {
    const n = id.split('/').pop(), opts = {map: texture(id), roughness: 0.82, metalness: 0};
    if (/iron|cast/.test(n)) opts.roughness = 0.55;
    if (/enamel/.test(n)) opts.roughness = 0.3;
    if (/chrome/.test(n)) { opts.roughness = 0.25; opts.metalness = 0.85; }
    if (/liner/.test(n)) opts.roughness = 0.6;
    if (/blanket|linen|ticking/.test(n)) opts.roughness = 0.95;
    if (/^wood(_v|_top|_panel)?$/.test(n)) opts.roughness = 0.6;
    if (/_glow$/.test(n)) { opts.emissive = new THREE.Color(0xffffff); opts.emissiveMap = opts.map; }
    matCache.set(id, new THREE.MeshStandardMaterial(opts));
  }
  return matCache.get(id);
}
async function piece(name) {
  if (!pieceCache.has(name)) pieceCache.set(name, fetch(A + 'cabin_mesh/' + name + '.json').then(r => { if (!r.ok) throw new Error('missing piece ' + name); return r.json(); }));
  return pieceCache.get(name);
}
const buckets = new Map();
function emit(texId, pts, uvs, nrm) {
  if (!buckets.has(texId)) buckets.set(texId, {p: [], uv: [], n: []});
  const b = buckets.get(texId);
  for (const i of [0, 1, 2, 0, 2, 3]) { b.p.push(...pts[i]); b.uv.push(...uvs[i]); b.n.push(...nrm[i]); }
}
function turnP([x, y, z], r) { for (let i = 0; i < r; i++) [x, z] = [1 - z, x]; return [x, y, z]; }
function turnN([x, y, z], r) { for (let i = 0; i < r; i++) [x, z] = [-z, x]; return [x, y, z]; }
async function addPiece(name, r, ox, oy, oz) {
  const pc = await piece(name);
  for (const q of pc.quads) {
    const t = pc.textures[q[0]], pts = [], uvs = [], nrm = [];
    for (let i = 0; i < 4; i++) {
      const o = 1 + i * 8, p = turnP([q[o], q[o + 1], q[o + 2]], r);
      pts.push([p[0] + ox, p[1] + oy, p[2] + oz]); uvs.push([q[o + 3], q[o + 4]]); nrm.push(turnN([q[o + 5], q[o + 6], q[o + 7]], r));
    }
    emit(t, pts, uvs, nrm);
  }
}
async function build() {
  const jobs = P.map(([n, r, x, y, z]) => addPiece(n, r, x, y, z));
  for (const [x, y, z] of WALL) jobs.push(addPiece('log_wall/run_x', 0, x, y, z));
  await Promise.all(jobs);
  for (const [t, b] of buckets) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(b.p, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2)); g.setAttribute('normal', new THREE.Float32BufferAttribute(b.n, 3));
    const m = new THREE.Mesh(g, material(t)); m.castShadow = m.receiveShadow = true; scene.add(m);
  }
  const fl = material('apocalypse_firstlight:block/wood/white_oak_planks');
  fl.map.wrapS = fl.map.wrapT = THREE.RepeatWrapping; fl.map.repeat.set(20, 9);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 9), fl); floor.rotation.x = -Math.PI / 2; floor.position.set(8, 0, -2.5); floor.receiveShadow = true; scene.add(floor);
}
const camera = new THREE.PerspectiveCamera(40, W / H, 0.05, 200);
const VIEWS = {
  all: [[8, 4.4, -9.5], [8, 0.7, 0.8], 44],
  bedroom: [[3.0, 1.75, -2.4], [0.7, 0.45, 0.5], 46],
  bed: [[1.75, 1.15, -0.2], [0.45, 0.5, 1.3], 50],
  wardrobes: [[3.6, 1.6, -2.2], [4.0, 1.0, 1.4], 46],
  rack_drawer: [[6.7, 1.45, -1.1], [6.8, 1.0, 1.6], 46],
  chests: [[9.4, 1.6, -1.3], [9.4, 0.3, 1.5], 46],
  freezers: [[14.5, 2.1, -2.6], [14.5, 0.6, 1.4], 46],
  freezer_open: [[16.1, 2.0, -0.3], [16.0, 0.35, 1.45], 50],
};
function view(name) { const [p, t, fov] = VIEWS[name]; camera.position.set(...p); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(...t); renderer.render(scene, camera); }
async function save(name) {
  const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
  await fetch('/save?name=' + name, {method: 'POST', body: blob});
}
window.renderAll = async (prefix = 'fv2_') => { for (const v of Object.keys(VIEWS)) { view(v); await save(prefix + v + '.png'); } return 'saved'; };
/** One sheet: the views in a 2 x 3 grid at half size, each with its label (the concept sheet sent to the user). */
window.renderSheet = async (names, labels, file) => {
  const c = document.createElement('canvas'), w = W / 2, h = H / 2; c.width = w * 2; c.height = h * Math.ceil(names.length / 2);
  const g = c.getContext('2d');
  for (let i = 0; i < names.length; i++) {
    view(names[i]); const x = (i % 2) * w, y = Math.floor(i / 2) * h;
    g.drawImage(renderer.domElement, x, y, w, h);
    g.font = '22px sans-serif'; g.fillStyle = 'rgba(20,22,24,0.72)'; g.fillRect(x + 12, y + 12, g.measureText(labels[i]).width + 28, 40);
    g.fillStyle = '#f3efe6'; g.fillText(labels[i], x + 26, y + 40);
  }
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  await fetch('/save?name=' + file, {method: 'POST', body: blob});
  return 'saved';
};
/** Wood finish study (wood_finish_swatches.mjs): one view per finish in a 2 x N grid, the five wood textures swapped for finish_tex/<key>/. */
const FINISH_TEX = ['wood', 'wood_v', 'wood_top', 'wood_panel', 'wood_inside'];
window.finishSheet = async (viewName, keys, labels, file) => {
  const c = document.createElement('canvas'), w = W / 2, h = H / 2; c.width = w * 2; c.height = h * Math.ceil(keys.length / 2);
  const g = c.getContext('2d');
  for (let i = 0; i < keys.length; i++) {
    await Promise.all(FINISH_TEX.map(n => new Promise((ok, bad) => {
      const m = matCache.get('apocalypse_firstlight:block/furniture/' + n); if (!m) return ok();
      loader.load('finish_tex/' + keys[i] + '/' + n + '.png', t => {
        t.flipY = false; t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
        m.map = t; m.needsUpdate = true; ok();
      }, undefined, bad);
    })));
    view(viewName); const x = (i % 2) * w, y = Math.floor(i / 2) * h;
    g.drawImage(renderer.domElement, x, y, w, h);
    g.font = '22px sans-serif'; g.fillStyle = 'rgba(20,22,24,0.72)'; g.fillRect(x + 12, y + 12, g.measureText(labels[i]).width + 28, 40);
    g.fillStyle = '#f3efe6'; g.fillText(labels[i], x + 26, y + 40);
  }
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  await fetch('/save?name=' + file, {method: 'POST', body: blob});
  return 'saved';
};
window.VIEWS = VIEWS;
window.view = view;
build().then(() => setTimeout(() => { view('all'); document.title = 'ready'; }, 1500)).catch(e => { document.title = 'error ' + e.message; console.error(e); });
</script>
</body></html>
