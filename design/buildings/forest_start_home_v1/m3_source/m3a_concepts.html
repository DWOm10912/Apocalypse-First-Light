const FONT = '"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif';

function envMap(stops) {

scene.environment = envMap([[0, '#dfe8ee'], [0.45, '#b9c6cc'], [0.55, '#5e624c'], [1, '#2d2a22']]);

}
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    for (let i = 0; i < n; i++) { const d = dots[Math.floor(r() * dots.length)]; g.fillStyle = d; g.fillRect(r() * w, r() * h, 2 + r() * 5, 2 + r() * 5); } });

const M = {

  asphalt: new THREE.MeshStandardMaterial({map: speckle('#3d3c3a', ['rgba(70,68,64,0.6)', 'rgba(30,30,29,0.6)'], 9000, 5, [16, 2]), roughness: 0.95}),

// ---------------------------------------------------------------- the site: county road stand-in along X, driveway +Z

    s.position.set(L / 2, GATE_Y0 + 0.55 * H, -0.03); g.add(s);                                   // face 5 (-z) faces the road
    // two U-bolts over the bars it hangs on

function gatePost(x, z, hardware) {

  p.position.set(0, POST_H / 2, 0); g.add(p);

  if (hardware === 'hinge') for (const y of [0.32, 1.2]) { const pin = tube(M.hinge, V3(0, GATE_Y0 + y, 0), V3(POST_R + 0.06, GATE_Y0 + y, 0), 0.009); g.add(pin); }
  if (hardware === 'latch') {                                                                        // a chain round the post and the gate's end
    for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2, l = mesh(new THREE.TorusGeometry(0.014, 0.0035, 6, 10), M.hinge);

}

const leaf = gateLeaf(true), leafHolder = new THREE.Group(); leafHolder.add(leaf);

function setGate(open) { leafHolder.rotation.y = open ? -Math.PI / 2 : 0; }      // swings in, away from the road

// barbed wire either side (context only): steel T-posts every 3 m, 3 strands

  const x0 = side < 0 ? HINGE_X - POST_R : LATCH_X + POST_R, x1 = side * 22;

const MB = {L: 0.483, W: 0.165, H: 0.229, bottom: 1.07};

  const s = new THREE.Shape(); s.moveTo(-r, 0); s.lineTo(r, 0); s.lineTo(r, wall); s.absarc(0, wall, r, 0, Math.PI, false); s.lineTo(-r, 0);

  const flag = new THREE.Group(), arm = mesh(new THREE.BoxGeometry(0.004, 0.022, 0.2), M.flag), plate = mesh(new THREE.BoxGeometry(0.004, 0.07, 0.09), M.flag);
  arm.position.set(0, 0, -0.1); plate.position.set(0, 0.024, -0.19); flag.add(arm, plate);
  flag.position.set(-r - 0.006, MB.bottom + 0.08, MB.L / 2 - 0.06); flag.rotation.x = flagUp ? Math.PI / 2 : 0; g.add(flag);
  // 4x4 post and a 2x6 cradle under the box
  const post = mesh(new THREE.BoxGeometry(0.089, MB.bottom - 0.04, 0.089), M.post); post.position.set(0, (MB.bottom - 0.04) / 2, 0.05); g.add(post);
  const cradle = mesh(new THREE.BoxGeometry(0.14, 0.038, 0.42), M.post); cradle.position.set(0, MB.bottom - 0.019, 0); g.add(cradle);
  const num = mesh(new THREE.PlaneGeometry(0.2, 0.06), new THREE.MeshStandardMaterial({map: canvasTex(400, 120, (c, w, h) => { c.fillStyle = '#1f2021'; c.fillRect(0, 0, w, h); c.fillStyle = '#e8e2cf'; c.font = 'bold 92px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('1462', w / 2, h / 2 + 4); }), roughness: 0.6}), false);
  num.position.set(0, MB.bottom + 0.055, -MB.L / 2 - 0.0135); num.rotation.y = Math.PI; g.add(num);   // on the door
  return g;
}
const MB_X = -(DRIVE_HALF + 2.9), MB_Z = EDGE + 0.45;            // right-hand side seen from the road (-x)
let mbox = mailbox(true); mbox.position.set(MB_X, 0, MB_Z); scene.add(mbox);

// ---------------------------------------------------------------- trees (context)
const trees = new THREE.Group(); scene.add(trees);
{ const r = rng(21);
  for (let i = 0; i < 70; i++) {
    const x = (r() - 0.5) * 90, z = 16 + r() * 40; if (Math.abs(x) < 6 && z < 42) continue;
    const h = 7 + r() * 9, fir = r() < 0.4, t = new THREE.Group();
    const trunk = mesh(new THREE.CylinderGeometry(0.12, 0.2, h * 0.5, 8), M.bark); trunk.position.y = h * 0.25; t.add(trunk);
    if (fir) { const c = mesh(new THREE.ConeGeometry(h * 0.18, h * 0.75, 9), M.fir); c.position.y = h * 0.6; t.add(c); }
    else { const c = mesh(new THREE.SphereGeometry(h * 0.22, 10, 8), M.leaf); c.scale.y = 1.2; c.position.y = h * 0.72; t.add(c); }
    t.position.set(x, 0, z); trees.add(t);
  }
  for (let i = 0; i < 30; i++) { const x = (r() - 0.5) * 100, z = -9 - r() * 30, h = 8 + r() * 8, t = new THREE.Group();
    const trunk = mesh(new THREE.CylinderGeometry(0.12, 0.2, h * 0.5, 8), M.bark); trunk.position.y = h * 0.25; t.add(trunk);
    const c = mesh(new THREE.SphereGeometry(h * 0.22, 10, 8), M.leaf); c.scale.y = 1.2; c.position.y = h * 0.72; t.add(c); t.position.set(x, 0, z); trees.add(t); }
}

// ---------------------------------------------------------------- cameras, overlays, sheets
const persp = new THREE.PerspectiveCamera(42, 1.5, 0.02, 300);
function shoot(w, h, cam) {
  renderer.setSize(w, h); if (cam.isPerspectiveCamera) { cam.aspect = w / h; cam.updateProjectionMatrix(); }
  renderer.render(scene, cam);
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(renderer.domElement, 0, 0); return c;
}
function look(pos, target, fov) { persp.position.set(...pos); persp.fov = fov; persp.lookAt(...target); persp.updateMatrixWorld(); persp.updateProjectionMatrix(); return persp; }

  cam.up.set(...up); cam.position.copy(c).addScaledVector(V3(...dir).normalize(), -30); cam.lookAt(c); cam.updateMatrixWorld(); cam.updateProjectionMatrix(); return cam;
}

  g.strokeStyle = '#3a3530'; g.fillStyle = '#3a3530'; g.lineWidth = 1.6;
  g.setLineDash([3, 4]); g.beginPath(); g.moveTo(x1, y1); g.lineTo(...a); g.moveTo(x2, y2); g.lineTo(...b); g.stroke(); g.setLineDash([]);
  g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();

  for (const [pt, s] of [[a, 1], [b, -1]]) { g.beginPath(); g.moveTo(...pt); g.lineTo(pt[0] + s * 11 * Math.cos(ang - 0.35), pt[1] + s * 11 * Math.sin(ang - 0.35)); g.lineTo(pt[0] + s * 11 * Math.cos(ang + 0.35), pt[1] + s * 11 * Math.sin(ang + 0.35)); g.fill(); }
  g.font = `bold 21px ${FONT}`; const tw = g.measureText(text).width, mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  g.fillStyle = 'rgba(232,228,221,0.94)'; g.fillRect(mx - tw / 2 - 6, my - 15, tw + 12, 30); g.fillStyle = '#2b2622'; g.fillText(text, mx - tw / 2, my + 8);

  g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y + dy); g.stroke();
  g.font = `20px ${FONT}`; const tw = g.measureText(text).width, tx = dx < 0 ? x + dx - tw - 12 : x + dx + 4;
  g.fillStyle = 'rgba(28,24,20,0.8)'; g.fillRect(tx - 6, y + dy - 18, tw + 16, 32); g.fillStyle = '#f5efe4'; g.fillText(text, tx + 2, y + dy + 6);
}
function caption(g, x, y, text) { g.font = `bold 23px ${FONT}`; const tw = g.measureText(text).width; g.fillStyle = 'rgba(20,17,14,0.8)'; g.fillRect(x, y, tw + 28, 40); g.fillStyle = '#f5efe4'; g.fillText(text, x + 14, y + 28); }
function wrapText(g, s, maxW, indent = '') {
  const tokens = s.match(/[A-Za-z0-9.%°+\-–×=\/]+|[\s\S]/gu), close = /^[，。；：、）)」"！？,.;:]$/, out = [];
  let line = '';

function notes(g, x, y, w, hgt, title, lines) {
  g.fillStyle = '#ece8e1'; g.fillRect(x, y, w, hgt); g.fillStyle = '#2b2622'; g.font = `bold 26px ${FONT}`; g.fillText(title, x + 24, y + 44);
  let yy = y + 84;
  for (const l of lines) {
    if (l === '') { yy += 12; continue; }
    const bold = l.startsWith('!'), s = bold ? l.slice(1) : l; g.font = `${bold ? 'bold ' : ''}21px ${FONT}`;
    const ws = wrapText(g, s, w - 60, '  ');
    ws.forEach((t, i) => g.fillText(t, x + 26, yy + i * 30)); yy += (ws.length - 1) * 30 + 32;
  }

}
async function save(c, name) { const blob = await new Promise(r => c.toBlob(r, 'image/png')); await fetch('/save?name=' + name, {method: 'POST', body: blob}); }
function sheet(w, h, title, sub, foot) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = '#d8d3cb'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#26211c'; g.fillRect(0, 0, w, 90); g.fillStyle = '#f2ece2'; g.font = `bold 38px ${FONT}`; g.fillText(title, 32, 58);
  g.font = `22px ${FONT}`; g.fillStyle = '#bdb3a4'; g.fillText(sub, w - 32 - g.measureText(sub).width, 56);
  g.fillStyle = '#5f574d'; g.font = `18px ${FONT}`; g.fillText(foot, 32, h - 16);
  return [c, g];
}

// ---------------------------------------------------------------- the carport plan (2-D): F8 vehicle anchor
function carportPlan(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = '#ece8e1'; g.fillRect(0, 0, w, h);
  const s = 62, ox = (w - 6 * s) / 2, oy = 70;                         // 6 m wide (x) x 7 m deep (y), 1 m = s px
  g.fillStyle = '#b9b2a6'; g.fillRect(ox, oy, 6 * s, 7 * s);           // gravel floor
  g.strokeStyle = '#4a443d'; g.lineWidth = 3; g.strokeRect(ox, oy, 6 * s, 7 * s);
  for (const [px, py] of [[0, 0], [6, 0], [0, 3.5], [6, 3.5], [0, 7], [6, 7]]) { g.fillStyle = '#5b4a3a'; g.fillRect(ox + px * s - 7, oy + py * s - 7, 14, 14); }
  // pickup footprint 5.2 x 1.9, nose out (toward the open side, y = 7), centred
  const tx = ox + 3 * s, L = 5.2 * s, W = 1.9 * s, ty0 = oy + 0.6 * s;
  g.setLineDash([10, 7]); g.strokeStyle = '#2c3e4a'; g.lineWidth = 3; g.strokeRect(tx - W / 2, ty0, W, L); g.setLineDash([]);
  g.fillStyle = 'rgba(44,62,74,0.12)'; g.fillRect(tx - W / 2, ty0, W, L);
  for (const fy of [0.85, 4.05]) for (const fx of [-1, 1]) { g.fillStyle = '#2c3e4a'; g.fillRect(tx + fx * (W / 2) - (fx > 0 ? 10 : 0), ty0 + fy * s - 18, 10, 36); }
  // the anchor: ground point at the footprint centre, heading arrow
  const ay = ty0 + L / 2; g.fillStyle = '#b5281f'; g.beginPath(); g.arc(tx, ay, 9, 0, 7); g.fill();
  g.strokeStyle = '#b5281f'; g.lineWidth = 4; g.beginPath(); g.moveTo(tx, ay); g.lineTo(tx, ay + 1.6 * s); g.stroke();
  g.beginPath(); g.moveTo(tx - 12, ay + 1.6 * s - 14); g.lineTo(tx, ay + 1.6 * s + 4); g.lineTo(tx + 12, ay + 1.6 * s - 14); g.fill();
  g.fillStyle = '#2b2622'; g.font = `bold 22px ${FONT}`;
  g.fillText('车棚 6 × 7 m（M1 已搭）', ox, oy - 22);
  g.font = `20px ${FONT}`;
  g.fillText('↓ 敞开的一面，车道', tx - 80, oy + 7 * s + 34);
  g.fillText('皮卡 5.2 × 1.9 m（以后的车）', ox + 6 * s + 18, ty0 + 30);
  g.fillText('左右各 2.05 m，前后各约 0.6–1.2 m', ox + 6 * s + 18, ty0 + 62);
  g.fillStyle = '#b5281f'; g.fillText('● 车辆锚点：地面中心 + 车头朝向', ox + 6 * s + 18, ay + 6);
  g.fillStyle = '#2b2622'; g.fillText('锚点不是方块，是老宅模板里的一个命名点', ox + 6 * s + 18, ay + 40);
  return c;
}
